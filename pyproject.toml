[build-system]
requires = ["setuptools>=68,<90", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "agmind"
version = "0.1.0.dev0"
description = "Private LLM/RAG platform for AMD Strix Halo and generic x86_64"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "AGmind core" }]
keywords = ["llm", "rag", "rocm", "vulkan", "strix-halo", "amd"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=2.0,<3",
  "typer>=0.26,<1",  # 0.26 vendored click (typer._click); tests use typer.testing
  "rich>=13.7,<16",
  "questionary>=2.0,<3",
  "platformdirs>=4.2,<5",
  "pydantic>=2.7,<3",
  # Phase N: `agmind install` orchestrator вызывает ansible-playbook для
  # bootstrap step (apt / usermod / mkdir). Без ansible-core install не запустится.
  "ansible-core>=2.16,<2.22",
  "structlog>=24.0,<26",
  "textual>=0.80,<9",
  "pyfiglet>=1.0,<2",
  "PyYAML>=6.0,<7",
  "huggingface_hub>=0.24,<2",
  # M4.U: cluster auto-detect via mDNS (Avahi-compatible). Pure Python.
  "zeroconf>=0.130,<1",
  # Hash a generated Authelia admin password into users_database.yml at install (argon2id,
  # Authelia's default) so the SSO never ships the upstream example hash. manylinux wheels.
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.7,<3",
  "onnxruntime>=1.22,<2",
  "llama-cpp-python>=0.3.23,<0.4",
  "scipy>=1.14,<2",
]
vulkan = [
  "torch>=2.7,<3",
  "onnxruntime>=1.22,<2",
  "llama-cpp-python>=0.3.23,<0.4",  # build with CMAKE_ARGS=-DGGML_VULKAN=ON
  "scipy>=1.14,<2",
]
rocm = [
  "torch>=2.7,<3",     # install from rocm index-url
  "onnxruntime>=1.22,<2",
  "llama-cpp-python>=0.3.23,<0.4",  # build with CMAKE_ARGS=-DGGML_HIP=ON
  "scipy>=1.14,<2",
]
dev = [
  "pytest>=8.0,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=5.0,<8",
  "pytest-benchmark>=4.0,<6",
  "ruff==0.15.13",
  "mypy>=1.10,<3",
  "pre-commit>=4.0,<5",
  "types-PyYAML>=6.0,<7",
  "types-psutil>=7.0,<8",
  "jsonschema>=4.0,<5",  # tests/services/test_catalog_render.py validates catalog JSON Schema
]

[project.scripts]
agmind = "agmind.cli:app"

# Phase H'.E: setuptools entry_points для compute backends.
# Third-party плагины делают `pip install agmind-intel-backend` и регистрируют
# свой класс под группой `agmind.backends` — core не нужно править.
# См. ADR-0008.
[project.entry-points."agmind.backends"]
cpu = "agmind.compute.backends.cpu:CPUBackend"
vulkan = "agmind.compute.backends.vulkan:VulkanBackend"
rocm = "agmind.compute.backends.rocm:ROCmBackend"
npu = "agmind.compute.backends.npu_stub:NPUStubBackend"

[project.urls]
Documentation = "https://github.com/botAGI/AGmind64"
Repository = "https://github.com/botAGI/AGmind64"

# Explicit package list (not `packages.find`): the data trees below are mapped
# into the `agmind` namespace via `package-dir`, and setuptools only ships them
# when they are declared packages. tests/core/test_data_root.py guards this list
# against drift (every agmind subpackage must be declared; the 3 data dirs must
# be wired as package-data).
[tool.setuptools]
packages = [
  "agmind",
  "agmind.addons",
  "agmind.ci",
  "agmind.cli",
  "agmind.cli.tui",
  "agmind.cluster",
  "agmind.components",
  "agmind.compute",
  "agmind.compute.backends",
  "agmind.compute.backends._engines",
  "agmind.compute.clients",
  "agmind.config",
  "agmind.core",
  "agmind.deploy",
  "agmind.diagnostics",
  "agmind.governance",
  "agmind.i18n",
  "agmind.install",
  "agmind.loadtest",
  "agmind.migrations",
  "agmind.migrations.versions",
  "agmind.models",
  "agmind.observability",
  "agmind.ops",
  "agmind.schemas",
  "agmind.security",
  "agmind.services",
  # Data trees bundled *inside* the wheel so an installed `agmind` can run
  # `agmind install` (templates/ + ansible/) and maintenance commands
  # (scripts/). In an editable checkout, data_root() still uses the repo tree.
  "agmind.templates",
  "agmind.ansible",
  "agmind.scripts",
  # docs/ is bundled so doc-reading commands (`agmind troubleshoot`) resolve
  # data_root()/docs/ in a wheel install, not only an editable checkout.
  "agmind.docs",
]

[tool.setuptools.package-dir]
"agmind.templates" = "templates"
"agmind.ansible" = "ansible"
"agmind.scripts" = "scripts"
"agmind.docs" = "docs"

[tool.setuptools.package-data]
"agmind.templates" = ["**/*"]
"agmind.ansible" = ["**/*"]
"agmind.scripts" = ["**/*"]
"agmind.docs" = ["**/*"]

[tool.setuptools.exclude-package-data]
# Keep gitignored runtime caches and bytecode out of the wheel. ansible/.galaxy
# (downloaded collections) and ansible/.facts_cache are installed/created at
# runtime, never shipped.
"agmind.ansible" = [".galaxy/**", ".facts_cache/**", "**/__pycache__/**", "**/*.pyc"]
"agmind.scripts" = ["**/__pycache__/**", "**/*.pyc"]
"agmind.templates" = ["**/__pycache__/**", "**/*.pyc"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "B005",   # intentional multi-character strip in lightweight parsers
  "B007",   # loop vars kept for readability in simple scans
  "B008",   # Typer uses Option/Argument calls in defaults by design
  "B017",   # broad exception assertions are used in a few immutability tests
  "B904",   # CLI exception chaining would add noise without user value
  "E402",   # Textual/optional imports sometimes live after helper definitions
  "E501",   # rich CLI strings and docs occasionally exceed 100 chars
  "E741",   # legacy short names in parser tests
  "UP028",  # explicit yield loops are clearer in streaming fallbacks
  "UP042",  # StrEnum would add an unnecessary runtime dependency pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]  # magic value in tests is fine

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["legacy/", "tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["llama_cpp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
  "backend_cpu: tests requiring CPU backend",
  "backend_vulkan: tests requiring Vulkan backend (gfx1151)",
  "backend_rocm: tests requiring ROCm backend (gfx1151)",
  "backend_any: tests backend-agnostic",
  "slow: tests > 1s",
  "integration: requires docker daemon / real-compose smoke",
]
addopts = "-ra --strict-markers -m \"not integration\""
# Phase J: pytest-asyncio для TUI tests (Textual Pilot async API)
asyncio_mode = "auto"
