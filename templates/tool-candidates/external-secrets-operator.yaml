id: external-secrets-operator
name: External Secrets Operator
status: candidate
category: secrets
summary: Kubernetes secrets synchronization addon for GitOps and enterprise secret stores.
recommended_version: "2.4.1"
version_source: https://github.com/external-secrets/external-secrets/releases/tag/v2.4.1
admission:
  scope: deploy-target-addon
  runtime: kubernetes
  contracts:
    - configure
    - operate
    - secure
  component_contract_required: false
  service_descriptor_required: false
  image_pin_required: false
dependencies:
  deploy_targets:
    - k3s
  profiles:
    - secrets
  storage_profiles:
    - longhorn
    - external
  secrets_profiles:
    - external-secrets
    - vault
    - infisical
  ports: []
  requires_gpu: false
risks:
  - CRD lifecycle, SecretStore RBAC, and provider credentials must be governed before k3s promotion.
  - Needs a SOPS/age or external vault bootstrap story so cluster secrets are not introduced manually.
next_step: Define SecretStore/ClusterSecretStore policy and a no-secret-leak render check before adding Kubernetes manifests.
verification:
  commands:
    - agmind tools status external-secrets-operator
    - agmind render kubernetes --profile core --target k3s --namespace agmind
  research_refs:
    - docs/adr/0014-deploy-targets-and-provisioning-boundary.md
    - docs/adr/0014-deploy-targets-and-provisioning-boundary.md
