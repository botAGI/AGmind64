id: n8n
name: n8n
status: accepted
category: automation
summary: Optional local workflow automation service for agent and integration flows.
recommended_version: 2.22.3
version_source: https://hub.docker.com/r/n8nio/n8n/tags?name=2.22.3
admission:
  scope: service-profile
  runtime: compose
  contracts:
    - render
    - operate
  component_contract_required: true
  service_descriptor_required: true
  image_pin_required: true
dependencies:
  deploy_targets:
    - ubuntu-compose
    - proxmox-vm-compose
  profiles:
    - automation
  storage_profiles:
    - local-paths
    - proxmox-zfs
  secrets_profiles:
    - env-files
    - sops-age
  # No host port — n8n is reached only via traefik (n8n.agmind.dev) behind Authelia; the
  # 127.0.0.1 loopback publish was removed (live-audit n8n-owner-unclaimed-loopback).
  ports: []
  requires_gpu: false
risks:
  - Workflow credentials are tied to N8N_ENCRYPTION_KEY; losing the persisted key makes old credentials unrecoverable.
  - The default descriptor uses n8n's local SQLite-backed data folder for low-friction homelab installs; external Postgres remains the enterprise HA follow-up.
next_step: Add an enterprise Postgres mode after AGmind grows first-class multi-database provisioning.
verification:
  commands:
    - agmind render compose --profile automation --no-traefik --domain ci.example.com --output /tmp/agmind-n8n.yml
    - docker compose --env-file /opt/agmind/.env -f /tmp/agmind-n8n.yml config --quiet
  research_refs:
    - docs/adr/0014-deploy-targets-and-provisioning-boundary.md
    - https://docs.n8n.io/hosting/installation/docker/
    - https://docs.n8n.io/hosting/securing/telemetry-opt-out/
