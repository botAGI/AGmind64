# Minimal Authelia 4.39 config — AGmind (security profile).
# Secrets are NOT in this file — Authelia reads them from the runtime .env as env vars
# (it merges AUTHELIA_<PATH> over the file at load):
#   AUTHELIA_SESSION_SECRET                              -> session.secret
#   AUTHELIA_STORAGE_ENCRYPTION_KEY                      -> storage.encryption_key
#   AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET -> identity_validation.reset_password.jwt_secret
#   AUTHELIA_SESSION_REDIS_PASSWORD (= REDIS_PASSWORD)   -> session.redis.password
# Manage users in users_database.yml. __AGMIND_DOMAIN__ is substituted at staging time.
theme: light

server:
  address: 'tcp://0.0.0.0:9091'

log:
  level: info

authentication_backend:
  file:
    path: '/config/users_database.yml'

access_control:
  default_policy: one_factor
  rules:
    # Step up to 2FA for the infrastructure-CONTROL consoles (container management, ops console,
    # dashboards-with-admin, automation-that-runs-arbitrary-workflows). Everything else stays
    # one_factor. Enrollment is via the filesystem notifier (/data/notification.txt, read by the
    # operator) so there is NO lockout even without SMTP. live-audit 2026-06-05 authelia-no-2fa-stepup.
    - domain:
        - 'portainer.__AGMIND_DOMAIN__'
        - 'komodo.__AGMIND_DOMAIN__'
        - 'grafana.__AGMIND_DOMAIN__'
        - 'n8n.__AGMIND_DOMAIN__'
      policy: two_factor

session:
  cookies:
    - domain: '__AGMIND_DOMAIN__'
      authelia_url: 'https://auth.__AGMIND_DOMAIN__'
  redis:
    host: 'redis'
    port: 6379

storage:
  # /data is a separate persistent mount (NOT the staged /config, which a re-install
  # replaces) — keeps the sqlite DB (2FA registrations, prefs) across re-installs.
  local:
    path: '/data/db.sqlite3'

notifier:
  filesystem:
    filename: '/data/notification.txt'
