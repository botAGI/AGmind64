antipatterns:
  - id: GDN_OLD_BUILD
    description: "Qwen3.5/3.6 A3B на llama.cpp < b8765 fallback CPU → 11.87 t/s"
    source: "llama.cpp#20354 (closed Mar 2026)"
    severity: critical
  - id: MXFP4_DENSE
    description: "Unsloth удалил MXFP4 из dense Q2/3/4_K_XL — остался только MXFP4_MOE"
    source: "unsloth docs"
    severity: high
  - id: DENSE_70B_PLUS
    description: "Llama 3.1 70B = 5.1 t/s, Mistral Medium 3.5 128B = 3.0 t/s — unfit"
    source: "kyuz0, slb350"
    severity: high
  - id: MINICPM_V_4_GGUF
    description: "vision pipeline broken — images ignored"
    source: "OpenBMB/MiniCPM-V#957"
    severity: high
    action: skip
  - id: OLLAMA_VENDORED
    description: "Ollama vendored llama.cpp -56% — use standalone llama-cpp-python"
    source: "ollama#15601"
    severity: high
  - id: AMDVLK_ICD
    description: "AMDVLK 2 GiB cap ломает ≥30B dense — use RADV only"
    source: "R2-vulkan-radv-vs-amdvlk.md"
    severity: critical
  - id: VULKAN_MMPROJ_DEGRADED
    description: "Vulkan mmproj может выдавать поврежденные features на specific images"
    source: "llama.cpp#20081"
    severity: medium
  - id: JINA_V3_NO_GGUF
    description: "jina-embeddings-v3 — нет GGUF conversion (use v4 если нужно)"
    source: "llama.cpp#9585"
    severity: low
  - id: VULKAN_DEVICELOST
    description: "DeviceLost crash на больших ubatch/ctx — pin -ub 2048 -b 2048"
    source: "llama.cpp#20515"
    severity: medium
  - id: HIP_GT_6GB_HANG
    description: "HIP models >6 GB hang — нужен -dio flag в llama-server или mmap=False"
    source: "R3-llama-cpp-vulkan-hip.md"
    severity: high
  - id: ROCWMMA_LONG_CTX
    description: "rocWMMA на long ctx (ROCm 7.0.2+) медленнее standard HIP"
    source: "R3"
    severity: low
  - id: SHADERC_2025_2
    description: "shaderc v2025.2 ломает Vulkan compile — pin 2025.1"
    source: "llama.cpp#15344"
    severity: high
