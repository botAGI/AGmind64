# AGmind GGUF model inventory — pinned per tier для Strix Halo (gfx1151).
# См. agmind/models.py (runtime API) and .planning/codebase/DEPENDENCIES.md.
#
# Правила:
#   - НИКАКОГО :latest — pin конкретный quant + filename
#   - hf_repo:filename должны существовать; verification field обязателен
#   - sha256 опциональный (HF auto-computes); если есть — добавлять
#   - tier S/M/L/XL/XXL соответствует §1.4 (S=16GB RAM, M=32GB, L=64GB,
#     XL=128GB, XXL=128GB+)
#
# Verification:
#   verified-strix     — real bench на gfx1151 (kyuz0/visorcraft/slb350/0xSero/hogeheer499)
#   verified-llamacpp  — architecture supported в llama.cpp
#   inferred           — extrapolated from comparable model
#   unverified         — no Strix data yet

schema_version: 1
last_updated: "2026-05-19"

