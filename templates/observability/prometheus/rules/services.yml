# Per-exporter service alerts (parent-borrow P1.2).
#
# Auto-loaded: prometheus.yml declares `rule_files: /etc/prometheus/rules/*.yml`
# and install stages this whole dir, so dropping a file here needs no wiring.
#
# LABEL MODEL: AGmind scrapes a single docker_sd job ("docker-auto"), so series
# carry {service="<descriptor-name>"} / {instance="agmind-<name>"} — NEVER a
# per-exporter "job" label. Select on {service=...}.
#
# `up{service="<exporter>"}` = is the EXPORTER reachable; `redis_up` / `pg_up`
# (emitted BY the exporter) = is the BACKEND reachable. Both matter: an exporter
# can be up while its backend is down.
#
# Container crash-loops are already covered by system.yml (ContainerRestartLoop),
# so these stay backend/saturation-specific and non-overlapping.
#
# NOTE: Elasticsearch alerts are intentionally NOT here — elasticsearch.yaml has
# no prometheus_scrape and we ship no elasticsearch_exporter, so ES emits zero
# metrics. Wiring ES alerts is a dedicated follow-up (add the exporter first).

groups:
  - name: redis_alerts
    rules:
      - alert: RedisExporterDown
        expr: up{service="redis-exporter"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "redis-exporter {{ $labels.instance }} unreachable"
          description: "No Redis metrics for 5+ minutes — exporter down or unscraped."

      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis backend down ({{ $labels.instance }})"
          description: "redis-exporter reports the Redis server unreachable for 2+ minutes."

      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis rejecting connections on {{ $labels.instance }}"
          description: "{{ $value }} connections rejected in 5m — maxclients reached?"

      - alert: RedisMemoryHigh
        expr: redis_memory_max_bytes > 0 and (redis_memory_used_bytes / redis_memory_max_bytes) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory >90% of maxmemory on {{ $labels.instance }}"
          description: "Eviction/OOM risk — raise maxmemory or reduce dataset."

  - name: postgres_alerts
    rules:
      - alert: PostgresExporterDown
        expr: up{service="postgres-exporter"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "postgres-exporter {{ $labels.instance }} unreachable"
          description: "No Postgres metrics for 5+ minutes — exporter down or unscraped."

      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Postgres backend down ({{ $labels.instance }})"
          description: "postgres-exporter reports the database unreachable for 2+ minutes."

      - alert: PostgresConnectionSaturation
        expr: sum(pg_stat_activity_count) / on() pg_settings_max_connections * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connection pool >80% used"
          description: "{{ $value | humanize }}% of max_connections in use — risk of refusals."
