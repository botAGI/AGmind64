# Alertmanager config (Phase H'.D, ADR-0007).
#
# Telegram через native `telegram_configs` (Alertmanager 0.24+).
# НЕ используем `alertmanager-bot` от metalmatze — он deprecated (архив 2022).
# См. deep-dive 03 §8.

global:
  resolve_timeout: 5m

route:
  receiver: tg-default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: tg-critical
      repeat_interval: 30m

receivers:
  - name: tg-default
    telegram_configs:
      - bot_token_file: /etc/alertmanager/tg_bot_token
        # chat_id_file is read at notify-time (not at config-load), so the config
        # validates and alertmanager BOOTS whether or not Telegram is configured.
        # Wired from AGMIND_ALERT_TELEGRAM_CHAT_ID in the runtime .env.
        chat_id_file: /etc/alertmanager/tg_chat_id
        parse_mode: HTML
        send_resolved: true
        message: |
          <b>[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}</b>
          Severity: {{ .CommonLabels.severity }}
          {{ range .Alerts }}
          • <code>{{ .Labels.instance }}</code> — {{ .Annotations.summary }}
          {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
          {{ end }}

  - name: tg-critical
    telegram_configs:
      - bot_token_file: /etc/alertmanager/tg_bot_token
        chat_id_file: /etc/alertmanager/tg_chat_id
        parse_mode: HTML
        send_resolved: true
        disable_notifications: false
        message: |
          🚨 <b>CRITICAL: {{ .CommonLabels.alertname }}</b>
          {{ range .Alerts }}
          • <code>{{ .Labels.instance }}</code>: {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

# No inhibit_rules: the old HostDown rule was dead — no alert rule emits alertname=HostDown,
# and `equal: [instance]` cannot correlate it with service alerts (instance is the per-service
# container name, not a host label). Re-add only with a real host-down alert + a shared host
# label to group on (review LOW alertmanager-inhibit-hostdown-missing).
