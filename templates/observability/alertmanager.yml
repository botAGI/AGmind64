# Alertmanager config (Phase H'.D, ADR-0007).
#
# Telegram через native `telegram_configs` (Alertmanager 0.24+).
# НЕ используем `alertmanager-bot` от metalmatze — он deprecated (архив 2022).
# См. deep-dive 03 §8.

global:
  resolve_timeout: 5m

route:
  receiver: tg-default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: tg-critical
      repeat_interval: 30m

receivers:
  - name: tg-default
    telegram_configs:
      - bot_token_file: /run/secrets/tg_bot_token
        chat_id: 0  # populated via Ansible from group_vars
        parse_mode: HTML
        send_resolved: true
        message: |
          <b>[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}</b>
          Severity: {{ .CommonLabels.severity }}
          {{ range .Alerts }}
          • <code>{{ .Labels.instance }}</code> — {{ .Annotations.summary }}
          {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
          {{ end }}

  - name: tg-critical
    telegram_configs:
      - bot_token_file: /run/secrets/tg_bot_token
        chat_id: 0
        parse_mode: HTML
        send_resolved: true
        disable_notifications: false
        message: |
          🚨 <b>CRITICAL: {{ .CommonLabels.alertname }}</b>
          {{ range .Alerts }}
          • <code>{{ .Labels.instance }}</code>: {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  # Если хост умер — не спамим алертами про сервисы на нём
  - source_matchers:
      - alertname="HostDown"
    target_matchers:
      - alertname=~".*"
    equal: [instance]
