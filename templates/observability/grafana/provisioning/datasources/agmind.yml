# Grafana datasources provisioning (Phase H'.D, ADR-0007).
# Auto-provisioned при старте Grafana — никаких ручных настроек через UI.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST
      manageAlerts: false  # alerts через Alertmanager, не Grafana

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 5000
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: "trace_id=([a-f0-9]+)"
          name: TraceID
          url: "$${__value.raw}"

  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      # `implementation` MUST match the running Alertmanager flavour or Grafana's
      # built-in alertmanager datasource plugin reports "Plugin unavailable" on
      # its health probe (observability audit OBS-5). We run vanilla Prometheus
      # Alertmanager → `prometheus`. `handleGrafanaManagedAlerts: false` keeps
      # this a read-only view of Prometheus-routed alerts (alerting is via
      # Alertmanager, not Grafana-managed — mirrors the Prometheus DS manageAlerts).
      implementation: prometheus
      handleGrafanaManagedAlerts: false
