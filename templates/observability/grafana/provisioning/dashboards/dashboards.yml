# Grafana dashboards provisioning (Phase H'.D, ADR-0007).
# JSON dashboards live in the json/ subdir NEXT TO this file. The install materialize step
# (_stage_directory_contents) copies the whole provisioning/ tree into the RO mount
# (GF_PATHS_PROVISIONING=/etc/grafana/provisioning), so the provider path must point INSIDE
# that mount — NOT /var/lib/grafana/dashboards (a separate writable mount nothing populates,
# which is why dashboards were empty).

apiVersion: 1

providers:
  - name: agmind-dashboards
    orgId: 1
    folder: AGmind
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
