# AGmind SSRF forward-proxy (Squid) — caged egress for dify-sandbox.
# Mounted read-only at /etc/squid/squid.conf. Vendored from Dify's upstream
# ssrf_proxy config, adapted for AGmind. See templates/services/ssrf-proxy.yaml.

# --- Block cloud-metadata FIRST (the canonical SSRF target) ---
acl metadata dst 169.254.169.254
acl metadata dst 169.254.0.0/16
http_access deny metadata

# --- Ports ---
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl SSL_ports port 443
acl CONNECT method CONNECT

# --- Private/internal DESTINATIONS the sandbox must NOT reach (the SSRF cage) ---
# live-audit 2026-06-05 (HIGH ssrf-proxy-src-based-acl): the old rule allowed by SOURCE
# (the sandbox's own docker IP in 172.16/10), which permitted EVERY destination it could
# route to — sandboxed untrusted code could reach internal LAN/cluster services on 80/443.
# Squid resolves `dst` hostnames to IPs, so this also defeats DNS-rebinding to an internal IP.
acl to_internal dst 10.0.0.0/8
acl to_internal dst 172.16.0.0/12
acl to_internal dst 192.168.0.0/16
acl to_internal dst 127.0.0.0/8
acl to_internal dst 169.254.0.0/16
acl to_internal dst fc00::/7
acl to_internal dst ::1

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny to_internal
# Only public destinations on the vetted safe ports survive to here.
http_access allow Safe_ports
http_access deny all

http_port 3128

# Long timeouts so large docling PDF fetches are not cut off.
request_timeout 30 minutes
read_timeout 30 minutes

# Keep the proxy itself quiet/anonymous.
forwarded_for delete
via off

# The ICMP pinger needs CAP_NET_RAW (absent in this container) and otherwise logs a scary
# "FATAL: Unable to open any ICMP sockets" + "Service squid stopped ... code 1" on every boot
# while the proxy core keeps serving. Disable it — a forward proxy needs no ICMP RTT.
# live-audit 2026-06-05 (log-noise).
pinger_enable off
