# yaml-language-server: $schema=../schemas/component.json
id: app-interfaces
kind: app
core:
  upstream: Open WebUI and Docling release streams
  recommended_version: 2026-05-23-r20
  current_pin: 2026-05-23-r20
  update_policy: compatible-minor
  source: manual
runtime:
  service_descriptors:
    - docling
    - openwebui
  compose_profiles:
    - rag
    - ui
  ports:
    - docling:5002
    - openwebui:3001
provides:
  - chat_ui
  - document_parsing
requires:
  capabilities:
    - llm_inference
verification:
  smoke:
    - agmind render compose --profile core,rag,ui --domain ci.example.com --output /tmp/agmind-apps.yml
    - docker compose --env-file /opt/agmind/.env -f /tmp/agmind-apps.yml config --quiet
  schema_refs:
    - templates/schemas/service.json
