# yaml-language-server: $schema=../schemas/component.json
id: ragflow
kind: app
core:
  upstream: https://github.com/infiniflow/ragflow
  min_version: v0.25.5
  recommended_version: v0.25.5
  current_pin: v0.25.5
  update_policy: manual-hold
  hold_reason: v1.x requires R18 compatibility review before bump.
  source: registry
runtime:
  service_descriptors:
    - ragflow
  compose_profiles:
    - ragflow
  ports:
    - ragflow:9380
provides:
  - rag_stack
  - dify_external_kb
requires:
  capabilities:
    - llm_inference
    - embedding_inference
    - search_index
    - mysql_db
    - object_storage
    - redis_cache
verification:
  smoke:
    - agmind render compose --profile core,ragflow --domain ci.example.com --output /tmp/agmind-ragflow.yml
    - docker compose -f /tmp/agmind-ragflow.yml config --quiet
  schema_refs:
    - templates/schemas/service.json
