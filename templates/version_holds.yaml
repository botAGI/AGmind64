# Tried the real minor bump v0.25.5->v0.26.4 but the ragflow container never reaches `healthy` in
# compose-up-smoke — verified twice locally (300s AND 600s waits) and on CI, with every data-tier
# dep (mysql/es/minio/redis) healthy and the container stuck `Starting`. The healthz path
# (/api/v1/system/healthz) is unchanged in v0.26.4 and our env surface matches, so the failure is
# a slower/changed init we don't yet understand — held pending root-cause diagnosis on the live
# stack. v0.25.5 stays pinned (it boots healthy).
infiniflow/ragflow:
  reason: "v0.26.4 never reaches healthy in compose-up-smoke (deps healthy, container stuck Starting >600s; healthz path + env unchanged) — root cause TBD. v1.0 in the report is a phantom (no such tag)."
  hold_until: 2026-09-01
