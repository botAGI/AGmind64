# Phase P: upstream version holds.
#
# Format:
#   <image-without-tag>:
#     reason: "human-readable why we don't bump"
#     hold_until: ISO-date (optional — auto-clear after this date, see below)
#     max_version: "v1.x"  (optional cap — bump до этого OK, выше — нет)
#
# Используется scripts/checks/version_check.py чтобы pad'нуть statuses:
#   ⏸ HOLD <reason>
#   🔒 X-pinned (if dependency requires)
#
# hold_until "auto-clear": once the date has passed, build_reports() stops
# REPORTING the image as HOLD (status falls through to the normal
# patch/minor/major/etc compare, with a "HOLD expired since <date>" warning)
# — this entry itself is NOT auto-deleted or mutated. Bump the date (or drop
# hold_until) to re-extend the hold once reviewed.
#
# Edit при появлении upstream breaking changes / known regressions.

# llama.cpp pin reason: Phase H baseline verified на b9049 (73 t/s).
# Bumping без re-bench может изменить tps; держим до сравнения.
ghcr.io/ggml-org/llama.cpp:
  reason: "Phase H bench reference build (b9049). Bump после re-bench на новой версии."
  hold_until: 2026-08-01

# Dify pin: plugin daemon co-bump required; verify against upstream releases
# before changing any Dify image in isolation.
langgenius/dify-api:
  reason: "Plugin Daemon co-bump required; bump только после verify в dify-plugin-daemon."

langgenius/dify-plugin-daemon:
  reason: "Local build — track upstream stable carefully. 0.6.x = current target."

# Dify-backing datastores. AGmind ships its own modern pins (PG 17 LTS,
# Redis 8) verified against Dify; bump majors only after re-verifying Dify.
postgres:
  reason: "Dify metadata store on PG 17 LTS (verified 2026-05-16); bump majors только после Dify re-verify."

redis:
  reason: "Dify task queue + plugin cache on Redis 8 (verified 2026-05-09); bump majors только после Dify re-verify."

# RAGFlow ES requirement:
elasticsearch:
  reason: "RAGFlow требует ES 9.x совместимый с DOC_ENGINE=elasticsearch."

# Dify stack — web/sandbox are co-bumped with dify-api (already held above). Probing them in
# isolation is meaningless and produced noisy ❌ error rows; they move only when the whole
# Dify stack is re-verified together.
langgenius/dify-web:
  reason: "Dify stack — co-bumped with dify-api; bump только после full Dify re-verify."

langgenius/dify-sandbox:
  reason: "Dify stack — co-bumped with dify-api; bump только после full Dify re-verify."

# MySQL pinned to 8.x for Dify metadata compatibility; the 9.x major is a Dify-verify gate,
# not an actionable bump — hold so the report stops flagging it ⚠️ major every week.
mysql:
  reason: "Dify requires MySQL 8.x (verified); do not bump to 9.x until Dify re-verify."

# --- Bump review 2026-07-21 (issue #12): held after per-component research ---

# homarr: v1.67.0 replaced Umami with server-side PostHog analytics (posthog-node cron
# POST to hog.homarr.dev). Our egress_telemetry_check exemption ("v1.62 Umami opt-out via
# UI only") is now WRONG. Bump blocked until a spike confirms NO_EXTERNAL_CONNECTION=true
# suppresses the cron POST (verify empirically, not by doc), then move homarr from
# _EGRESS_EXEMPT to _REQUIRED_EGRESS_ENV. v1.62→v1.71 drizzle migration is also one-way.
ghcr.io/homarr-labs/homarr:
  # Spike done 2026-07-22 (empirical, v1.71.0 image): NO_EXTERNAL_CONNECTION does NOT gate the
  # PostHog egress. Both the client (posthog-js) and server (posthog-node, POST to
  # https://hog.homarr.dev flushAt:10) captures are guarded ONLY by the DB serverSetting
  # `analytics.enableGeneral`, whose default is TRUE (analytics:{enableGeneral:!0}) — there is NO
  # env kill-switch (only DISABLE_REDIS_LOGS etc.) and no config/env seed at first boot. So a bump
  # is a zero-egress regression vs the current v1.62 Umami unless we pre-seed the serverSettings
  # row (enableGeneral:false, superJSON) into /appdata db before first boot, or contain
  # hog.homarr.dev at the network layer. Held until that seed mechanism exists.
  reason: "v1.67+ server-side PostHog (hog.homarr.dev) is DB-gated (analytics.enableGeneral, default true), NO env kill-switch; NO_EXTERNAL_CONNECTION does NOT suppress it (verified 2026-07-22). Bump needs a seed-enableGeneral-false mechanism."
  hold_until: 2026-09-01

# (docling hold removed 2026-07-22: v1.27 bump landed in #15 — mount narrowed to .cache/huggingface
# + HF_HUB_OFFLINE, live offline-boot verified. No longer held.)

# portainer: 2.43.0 image bump is safe, but the initial-admin flow changed (setup token in
# container logs, or --admin-password-file). Our access.note still says "restart + create
# admin", which is wrong under 2.43. Bump lands together with the access.note rewrite +
# CredentialsStep wiring — a doc/UX change, not a bare image swap.
portainer/portainer-ce:
  reason: "2.43 changed initial-admin setup (log token / --admin-password-file); bump lands with the access.note rewrite + CredentialsStep wiring, not as a bare image swap."
  hold_until: 2026-09-01

# ragflow: the weekly report's "v1.0" is a phantom (project is on 0.x; latest real tag v0.26.4).
# Tried the real minor bump v0.25.5->v0.26.4 but the ragflow container never reaches `healthy` in
# compose-up-smoke — verified twice locally (300s AND 600s waits) and on CI, with every data-tier
# dep (mysql/es/minio/redis) healthy and the container stuck `Starting`. The healthz path
# (/api/v1/system/healthz) is unchanged in v0.26.4 and our env surface matches, so the failure is
# a slower/changed init we don't yet understand — held pending root-cause diagnosis on the live
# stack. v0.25.5 stays pinned (it boots healthy).
infiniflow/ragflow:
  reason: "v0.26.4 never reaches healthy in compose-up-smoke (deps healthy, container stuck Starting >600s; healthz path + env unchanged) — root cause TBD. v1.0 in the report is a phantom (no such tag)."
  hold_until: 2026-09-01
