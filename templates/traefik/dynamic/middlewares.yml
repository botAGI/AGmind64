# Traefik dynamic config: middleware chains (Phase H'.C, ADR-0006).
#
# Три tier-based chains применяются к router'ам через label:
#   traefik.http.routers.<name>.middlewares=<chain-name>@file
#
# - chain-llm:      rate-limit + security-headers + Authelia, БЕЗ buffering (для SSE)
# - chain-internal: Authelia + security-headers (Grafana/Prometheus UI)
# - chain-public:   rate-limit + security-headers (без auth)
#
# См. deep-dive 01 §4 и 04-service-onboarding §2.

http:
  middlewares:
    # Per-source-IP flood protection. NOTE: a browser loads a whole SPA (Authelia portal,
    # Grafana, Dify, OpenWebUI…) as a BURST of 20-50 asset requests at once — the old
    # average:10/period:1m with no burst → traefik defaults burst to 1 → every page load
    # after the first request got 429 "Too Many Requests" (the portal was unusable). burst
    # must comfortably cover a page-load fan-out. Login brute-force is handled separately by
    # Authelia's own regulation, so this only needs to stop genuine floods.
    default-ratelimit:
      rateLimit:
        average: 100
        period: 1s
        burst: 200
        sourceCriterion:
          ipStrategy:
            depth: 1

    # LLM endpoints (compute-heavier) — a bit tighter sustained rate, but burst still must
    # cover a UI page-load (openwebui/dify-web stream via SSE but the asset fan-out bursts).
    llm-ratelimit:
      rateLimit:
        average: 60
        period: 1s
        burst: 120
        sourceCriterion:
          ipStrategy:
            depth: 1

    default-security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: strict-origin-when-cross-origin

    # Authelia forwardAuth — пропуск к /api/authz/forward-auth
    authelia:
      forwardAuth:
        address: http://authelia:9091/api/authz/forward-auth
        trustForwardHeader: true
        authResponseHeaders:
          - Remote-User
          - Remote-Groups
          - Remote-Email
          - Remote-Name

    # ---- Composite chains (используются routerами) ----

    # SSE-safe: для llama-server / dify / openwebui которые стримят tokens.
    # ВАЖНО: НЕ включаем buffering — он склеит chunks.
    chain-llm:
      chain:
        middlewares:
          - llm-ratelimit
          - default-security-headers
          - authelia

    # Internal services (Grafana, Prometheus UI, Portainer) — нужен auth.
    chain-internal:
      chain:
        middlewares:
          - default-security-headers
          - authelia

    # Публичные endpoints (если когда-нибудь будут) — auth не нужен.
    chain-public:
      chain:
        middlewares:
          - default-ratelimit
          - default-security-headers
