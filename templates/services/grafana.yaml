# yaml-language-server: $schema=../schemas/service.json
name: grafana
image: grafana/grafana:13.1.1
digest: 1c1bd67c54c5fcf6e759897852b5a584191bd6796e8d328a5ace457799801261
tier: ops
purpose: Metrics + logs visualization — Grafana 13.1 (2026-07-21)
profiles:
- observability
ports:
- 127.0.0.1:3002:3000
volumes:
- /etc/agmind/grafana/provisioning:/etc/grafana/provisioning:ro
- /var/lib/agmind/grafana:/var/lib/grafana
run_as_uid: 472
# run_as_gid defaults to run_as_uid (472)
writable_mounts:
- /var/lib/agmind/grafana
env:
  GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
  GF_PATHS_PROVISIONING: /etc/grafana/provisioning
  # zero-egress: [analytics] reporting_enabled alone is NOT enough — check_for_updates still
  # GETs stats.grafana.org and check_for_plugin_updates hits grafana.com on a timer. All four
  # are needed for a true no-phone-home. re-verified 2026-07-21 for grafana 13.1: these four
  # [analytics] keys are unchanged in 13.1 and still kill all four egress paths (docs below)
  # https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#analytics
  GF_ANALYTICS_REPORTING_ENABLED: 'false'
  GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
  GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
  GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: 'false'
depends_on:
- prometheus
- loki
resources:
  cpus: 2.0
  mem_limit: 1g
  mem_reservation: 256m
# /api/health is unauthenticated + returns 200 (verified live; curl present in the image).
# live-audit 2026-06-05 userfacing-services-no-docker-healthcheck.
health:
  test:
  - CMD
  - curl
  - -fsS
  - http://localhost:3000/api/health
  start_period: 60s
  interval: 15s
  timeout: 5s
  retries: 10
access:
  login: admin
  password_env: GRAFANA_PASSWORD
routing:
  host: grafana.agmind.dev
  healthcheck_path: /api/health
observability:
  prometheus_scrape: true

# Hardening (live-audit 2026-06-05): block privilege escalation via setuid/file-caps.
no_new_privileges: true
