# yaml-language-server: $schema=../schemas/service.json
name: llama-llm
image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b9049
tier: inference
purpose: LLM token generation via llama-server (Vulkan RADV primary, Qwen3.6-A3B MoE tuned)
profiles:
- core
ports:
- 127.0.0.1:8080:8080
volumes:
- /var/lib/agmind/models:/models:ro
env:
  AMD_VULKAN_ICD: RADV
  VK_DRIVER_FILES: /usr/share/vulkan/icd.d/radeon_icd.x86_64.json
  GGML_VK_VISIBLE_DEVICES: '0'
# Phase H runtime flags — community-tuned для Qwen3.6-35B-A3B MoE на gfx1151
# (см. .planning/research/x86-migration/R16-qwen-strix-halo-flags.md).
# Менять модель → менять --model arg; bench show Q4_K_M = 70.2 t/s decode.
command:
- --host
- 0.0.0.0
- --port
- '8080'
- --model
- /models/Qwen3.6-35B-A3B-Q4_K_M.gguf
- -ngl
- '999'
- --flash-attn
- --cache-type-k
- q8_0
- --cache-type-v
- q8_0
- --ubatch-size
- '2048'
- --batch-size
- '2048'
- --no-mmap
- --ctx-size
- '16384'
devices:
- /dev/dri
group_add:
- video
- render
security_opt:
- seccomp=unconfined
resources:
  cpus: 8.0
  mem_limit: 64g
health:
  test:
  - CMD
  - curl
  - -f
  - http://localhost:8080/health
routing:
  host: llama.agmind.dev
  middleware_chain: chain-llm
  sse: true
observability:
  prometheus_scrape: true
