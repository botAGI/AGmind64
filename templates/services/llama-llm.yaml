# yaml-language-server: $schema=../schemas/service.json
name: llama-llm
image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b9049
tier: inference
purpose: LLM token generation via llama-server (Vulkan RADV primary, Qwen3.6-A3B MoE tuned)
profiles:
- core
ports:
- 127.0.0.1:8080:8080
volumes:
- /var/lib/agmind/models:/models:ro
env:
  AMD_VULKAN_ICD: RADV
  VK_DRIVER_FILES: /usr/share/vulkan/icd.d/radeon_icd.x86_64.json
  GGML_VK_VISIBLE_DEVICES: '0'
  # Phase N.G: model + context settings populated from InstallConfig.
  # Defaults match Qwen3.6-35B-A3B Q4_K_M baseline (Phase H verified).
  AGMIND_MODEL_FILE: ${AGMIND_MODEL_FILE:-Qwen3.6-35B-A3B-Q4_K_M.gguf}
  AGMIND_CTX_SIZE: ${AGMIND_CTX_SIZE:-16384}
  AGMIND_KV_CACHE: ${AGMIND_KV_CACHE:-q8_0}
  AGMIND_THREADS: ${AGMIND_THREADS:--1}
  AGMIND_PARALLEL: ${AGMIND_PARALLEL:-1}
# Community-tuned runtime flags для MoE на gfx1151 (см. R16).
# Менять модель / контекст / KV cache → через env vars (см. AGMIND_MODEL_FILE).
command:
- --host
- 0.0.0.0
- --port
- '8080'
- --model
- /models/${AGMIND_MODEL_FILE}
- -ngl
- '999'
- --flash-attn
- --cache-type-k
- ${AGMIND_KV_CACHE}
- --cache-type-v
- ${AGMIND_KV_CACHE}
- --ubatch-size
- '2048'
- --batch-size
- '2048'
- --no-mmap
- --ctx-size
- ${AGMIND_CTX_SIZE}
- --threads
- ${AGMIND_THREADS}
- --parallel
- ${AGMIND_PARALLEL}
devices:
- /dev/dri
group_add:
- video
- render
security_opt:
- seccomp=unconfined
resources:
  cpus: 8.0
  mem_limit: 64g
health:
  test:
  - CMD
  - curl
  - -f
  - http://localhost:8080/health
routing:
  host: llama.agmind.dev
  middleware_chain: chain-llm
  sse: true
observability:
  prometheus_scrape: true

# Phase O capabilities
provides:
- llm_inference
