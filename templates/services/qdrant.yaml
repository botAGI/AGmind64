# yaml-language-server: $schema=../schemas/service.json
name: qdrant
image: qdrant/qdrant:v1.18.0
digest: b3063c673f3973877c038eeecc392bad5011f072ee7892b56c9a8e204a3bdea9
tier: storage
purpose: Vector store (primary per R11) — 2026-05-11 release
profiles:
- core
- rag
ports:
- 127.0.0.1:6333:6333
- 127.0.0.1:6334:6334
volumes:
- /var/lib/agmind/qdrant:/qdrant/storage
env:
  QDRANT__SERVICE__GRPC_PORT: '6334'
resources:
  cpus: 4.0
  mem_limit: 8g
health:
  test:
  - CMD
  - curl
  - -f
  - http://localhost:6333/healthz

# Phase O capabilities
provides:
- vector_db
