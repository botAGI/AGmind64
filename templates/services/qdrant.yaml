# yaml-language-server: $schema=../schemas/service.json
name: qdrant
# Pin the FULL patch version, never the floating minor alias `v1.19` — that alias moves to the
# next patch while the digest stays put, which is the tag/digest desync this repo already has a
# journal entry for.
image: qdrant/qdrant:v1.19.0
digest: 057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
tier: storage
purpose: Vector store (primary per R11) — 1.19.0 (2026-08-05 release)
profiles:
- core
- rag
# Caged on the internal data-net — consumed by dify-* over the network (qdrant:6333). Host
# ports dropped: an internal-only net has no host route, and the only consumers reach it by
# DNS name, not 127.0.0.1. live-audit 2026-06-05 (flat-network). K-3a.
networks:
- data-net
volumes:
- /var/lib/agmind/qdrant:/qdrant/storage
env:
  QDRANT__SERVICE__GRPC_PORT: '6334'
  # zero-egress: qdrant POSTs anonymized usage stats to telemetry.qdrant.io on a timer
  # unless disabled (maps to config telemetry_disabled). re-verified 2026-08-07 against
  # v1.19.0 source: config/config.yaml still carries telemetry_disabled and src/main.rs still
  # gates reporting on it. v1.19 enriches the telemetry PAYLOAD (cgroup CPU/RAM/disk) but the
  # payload is never transmitted while reporting is off — confirmed live, the container logged
  # "Telemetry reporting disabled" on boot with this env.
  # https://qdrant.tech/documentation/guides/usage-statistics/
  QDRANT__TELEMETRY_DISABLED: 'true'
resources:
  cpus: 4.0
  mem_limit: 8g
  mem_reservation: 1g
health:
  # qdrant/qdrant image ships NO curl/wget (only bash/sh) — a curl healthcheck
  # fails 'executable file not found' forever → qdrant perma-unhealthy. Use a
  # bash /dev/tcp connect to the HTTP port (qdrant binds 6333 only once serving).
  test:
  - CMD
  - bash
  - -c
  - exec 3<>/dev/tcp/127.0.0.1/6333
  start_period: 10s

# Phase O capabilities
provides:
- vector_db

# Hardening (SEC-2, security-live 2026-06-08): block runtime privilege escalation via
# setuid/file-caps. Safe here — the image either runs a plain server or drops privileges
# via gosu/su-exec (which no-new-privileges does NOT break; it only blocks privilege GAIN).
no_new_privileges: true
