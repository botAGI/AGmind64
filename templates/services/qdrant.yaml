# yaml-language-server: $schema=../schemas/service.json
name: qdrant
image: qdrant/qdrant:v1.18.3
digest: 0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286
tier: storage
purpose: Vector store (primary per R11) — 2026-05-11 release
profiles:
- core
- rag
# Caged on the internal data-net — consumed by dify-* over the network (qdrant:6333). Host
# ports dropped: an internal-only net has no host route, and the only consumers reach it by
# DNS name, not 127.0.0.1. live-audit 2026-06-05 (flat-network). K-3a.
networks:
- data-net
volumes:
- /var/lib/agmind/qdrant:/qdrant/storage
env:
  QDRANT__SERVICE__GRPC_PORT: '6334'
  # zero-egress: qdrant POSTs anonymized usage stats to telemetry.qdrant.io on a timer
  # unless disabled (maps to config telemetry_disabled). verified 2026-06-09 against
  # qdrant v1.18.0 docs https://qdrant.tech/documentation/guides/usage-statistics/
  QDRANT__TELEMETRY_DISABLED: 'true'
resources:
  cpus: 4.0
  mem_limit: 8g
  mem_reservation: 1g
health:
  # qdrant/qdrant image ships NO curl/wget (only bash/sh) — a curl healthcheck
  # fails 'executable file not found' forever → qdrant perma-unhealthy. Use a
  # bash /dev/tcp connect to the HTTP port (qdrant binds 6333 only once serving).
  test:
  - CMD
  - bash
  - -c
  - exec 3<>/dev/tcp/127.0.0.1/6333
  start_period: 10s

# Phase O capabilities
provides:
- vector_db

# Hardening (SEC-2, security-live 2026-06-08): block runtime privilege escalation via
# setuid/file-caps. Safe here — the image either runs a plain server or drops privileges
# via gosu/su-exec (which no-new-privileges does NOT break; it only blocks privilege GAIN).
no_new_privileges: true
