# yaml-language-server: $schema=../schemas/service.json
name: alertmanager
image: prom/alertmanager:v0.32.1
digest: 51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
tier: ops
purpose: Alert routing для Prometheus
profiles:
- observability
ports:
- 127.0.0.1:9093:9093
volumes:
- /etc/agmind/alertmanager:/etc/alertmanager:ro
- /var/lib/agmind/alertmanager:/alertmanager
run_as_uid: 65534
# run_as_gid defaults to run_as_uid (65534)
writable_mounts:
- /var/lib/agmind/alertmanager
resources:
  cpus: 1.0
  mem_limit: 512m
  mem_reservation: 128m
# /-/healthy is unauthenticated + 200 once up. Image ships busybox wget at /bin/wget (curl
# ABSENT — verified `docker run --rm --entrypoint sh ... command -v wget`, 2026-06-08). Without
# this probe every `depends_on: alertmanager` degrades to service_started (CFG-1). live-audit 2026-06-08.
health:
  test:
  - CMD
  - wget
  - -q
  - -O
  - /dev/null
  - http://localhost:9093/-/healthy
  start_period: 15s
  interval: 15s
  timeout: 5s
  retries: 10
observability:
  prometheus_scrape: true

# Hardening (SEC-2, security-live 2026-06-08): block runtime privilege escalation via
# setuid/file-caps. Safe here — the image either runs a plain server or drops privileges
# via gosu/su-exec (which no-new-privileges does NOT break; it only blocks privilege GAIN).
no_new_privileges: true
