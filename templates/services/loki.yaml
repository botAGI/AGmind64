# yaml-language-server: $schema=../schemas/service.json
name: loki
image: grafana/loki:3.7.2
digest: 191d4fdfb7264f16989f0a57f320872620a5a7c2ceeec6229212c4190ec49b86
tier: ops
purpose: Log aggregation — Loki 3.7 (2026-05-13, new tenancy schema)
profiles:
- observability
ports:
- 127.0.0.1:3100:3100
volumes:
- /etc/agmind/loki:/etc/loki:ro
- /var/lib/agmind/loki:/loki
run_as_uid: 10001
# run_as_gid defaults to run_as_uid (10001)
writable_mounts:
- /var/lib/agmind/loki
command:
- -config.file=/etc/loki/loki.yml
resources:
  cpus: 2.0
  mem_limit: 2g
# NO `health:` block on purpose (CFG-1 / service-config H1 suggested one, but the premise was
# wrong for THIS image): grafana/loki:3.7.2 is DISTROLESS — the only binary is /usr/bin/loki,
# there is no sh/wget/curl/nc, and the loki binary has no health/ready subcommand (verified by
# exporting the image fs + `loki -help`, 2026-06-08). Any wget/curl probe against /ready would
# hit the A6 'executable file not found' class → container unhealthy forever → false rollback.
# Loki therefore stays classified in healthcheck_coverage_check._HEALTHCHECK_EXEMPT (no usable
# in-image probe surface); readiness is observed externally (Prometheus scrape / Grafana panel).
