# yaml-language-server: $schema=../schemas/service.json
name: traefik
image: traefik:v3.7.9
digest: 652929a140a32d7cafafb13c6cdfab5376cfeff800f51397b87b524501ed02a8
tier: edge
purpose: Reverse proxy + TLS termination + middleware chains (ADR-0006)
owner: agmind-core
profiles:
- core
- full
# Dual-homed: default (the edge net it routes apps on) + the internal mgmt-net (to reach its
# docker provider via docker-socket-proxy:2375). live-audit 2026-06-07 (SEC-1).
networks:
- default
- mgmt-net
ports:
- 80:80
- 443:443
- 127.0.0.1:9100:9100
# NO raw /var/run/docker.sock — traefik's docker provider reaches the API through the read-only
# docker-socket-proxy (validated live: traefik discovered + routed a backend over tcp). This is
# the audit's worst case (internet-facing + root + raw socket); the proxy is POST=0 read-only.
# live-audit 2026-06-05 docker-sock-raw-mount-blast-radius.
volumes:
- /var/lib/agmind/traefik/dynamic:/etc/traefik/dynamic:ro
- /var/lib/agmind/traefik/letsencrypt:/letsencrypt
- /var/lib/agmind/secrets/cf_dns_api_token:/run/secrets/cf_dns_api_token:ro
env:
  CF_DNS_API_TOKEN_FILE: /run/secrets/cf_dns_api_token
command:
- --ping=true
- --providers.docker=true
- --providers.docker.endpoint=tcp://docker-socket-proxy:2375
- --providers.docker.exposedbydefault=false
- --providers.file.directory=/etc/traefik/dynamic
- --providers.file.watch=true
- --entrypoints.web.address=:80
- --entrypoints.web.http.redirections.entrypoint.to=websecure
- --entrypoints.web.http.redirections.entrypoint.scheme=https
- --entrypoints.websecure.address=:443
- --entrypoints.websecure.transport.respondingTimeouts.readTimeout=600s
- --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=600s
- --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=600s
- --entrypoints.metrics.address=:9100
- --metrics.prometheus=true
- --metrics.prometheus.entryPoint=metrics
- --certificatesresolvers.le.acme.email=ops@agmind.dev
- --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
- --certificatesresolvers.le.acme.dnschallenge=true
- --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
- --certificatesresolvers.le.acme.dnschallenge.delaybeforecheck=30
- --log.level=INFO
- --accesslog=true
# zero-egress (A8 / Карпатый #15): traefik's global.checkNewVersion defaults ON and GETs
# update.traefik.io (version + public IP) from the internet-facing edge on a timer;
# sendAnonymousUsage opt-out is belt-and-suspenders. Both are CLI flags (no env knob), so they
# are pinned in egress_telemetry_check._REQUIRED_EGRESS_CMD — dropping them reds the A8 gate.
- --global.checknewversion=false
- --global.sendanonymoususage=false
resources:
  cpus: 1.0
  mem_limit: 512m
  mem_reservation: 128m
health:
  test:
  - CMD
  - traefik
  - healthcheck
  - --ping
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 15s
observability:
  prometheus_scrape: true
  metrics_port: 9100

# Phase O capabilities
provides:
- reverse_proxy
- tls_termination
# Pulls the docker-socket-proxy into the closure (read-only Docker API). NO depends_on: a
# cross-profile (core->observability) depends_on hard-raises the --no-tui render; traefik's
# docker provider retries the connection until the proxy is up.
consumes:
- docker_api

# Hardening (SEC-2, security-live 2026-06-08): block runtime privilege escalation via
# setuid/file-caps. Safe here — the image either runs a plain server or drops privileges
# via gosu/su-exec (which no-new-privileges does NOT break; it only blocks privilege GAIN).
no_new_privileges: true
