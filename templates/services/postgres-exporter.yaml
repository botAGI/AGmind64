# yaml-language-server: $schema=../schemas/service.json
name: postgres-exporter
image: prometheuscommunity/postgres-exporter:v0.19.1
digest: e96064f876226d94bb6ce48a4c4b3dd76edba91168ec1ab024e5c4b959310b0f
tier: ops
purpose: Postgres metrics для Prometheus
profiles:
- observability
# Dual-homed: default (scraped by prometheus) + data-net (reaches its caged postgres).
# live-audit 2026-06-05 (flat-network). K-2b.
networks:
- default
- data-net
env:
  DATA_SOURCE_NAME: postgresql://dify:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/dify?sslmode=disable
resources:
  cpus: 0.5
  mem_limit: 256m
observability:
  prometheus_scrape: true
