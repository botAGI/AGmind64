# yaml-language-server: $schema=../schemas/service.json
name: postgres-exporter
image: prometheuscommunity/postgres-exporter:v0.20.1
digest: ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
tier: ops
purpose: Postgres metrics для Prometheus
profiles:
- observability
# Dual-homed: default (scraped by prometheus) + data-net (reaches its caged postgres).
# live-audit 2026-06-05 (flat-network). K-2b.
networks:
- default
- data-net
env:
  DATA_SOURCE_NAME: postgresql://dify:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/dify?sslmode=disable
resources:
  cpus: 0.5
  mem_limit: 256m
  mem_reservation: 64m
observability:
  prometheus_scrape: true

# Hardening (SEC-2, security-live 2026-06-08): block runtime privilege escalation via
# setuid/file-caps. Safe here — the image either runs a plain server or drops privileges
# via gosu/su-exec (which no-new-privileges does NOT break; it only blocks privilege GAIN).
no_new_privileges: true
