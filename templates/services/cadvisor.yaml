# yaml-language-server: $schema=../schemas/service.json
name: cadvisor
image: gcr.io/cadvisor/cadvisor:v0.55.1
digest: 3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
tier: ops
purpose: Per-container metrics (v0.55.1 — latest published stable; v0.57 was never released)
profiles:
- observability
# Dual-homed: default (scraped by prometheus) + internal mgmt-net (its --docker endpoint is the
# docker-socket-proxy). live-audit 2026-06-07 (SEC-1).
networks:
- default
- mgmt-net
ports:
- 127.0.0.1:8083:8080
# NO raw /var/run/docker.sock — cadvisor reaches the Docker API through the read-only
# docker-socket-proxy (validated live: container_* metrics present via tcp). /rootfs,/sys,
# /var/lib/docker are direct fs reads (cgroup/layer stats), not the socket.
# live-audit 2026-06-05 docker-sock-raw-mount-blast-radius.
volumes:
- /:/rootfs:ro
- /sys:/sys:ro
- /var/lib/docker/:/var/lib/docker:ro
command:
- --docker_only=true
- --docker=tcp://docker-socket-proxy:2375
depends_on:
- docker-socket-proxy
resources:
  cpus: 1.0
  mem_limit: 512m
observability:
  prometheus_scrape: true

# Phase O capabilities — pulls the docker-socket-proxy into the closure (read-only Docker API).
consumes:
- docker_api
