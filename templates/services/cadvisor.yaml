# yaml-language-server: $schema=../schemas/service.json
name: cadvisor
image: gcr.io/cadvisor/cadvisor:v0.55.1
digest: 3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
tier: ops
purpose: Per-container metrics (v0.55.1 — latest published stable; v0.57 was never released)
profiles:
- observability
ports:
- 127.0.0.1:8083:8080
volumes:
- /:/rootfs:ro
- /var/run/docker.sock:/var/run/docker.sock:ro
- /sys:/sys:ro
- /var/lib/docker/:/var/lib/docker:ro
command:
- --docker_only=true
resources:
  cpus: 1.0
  mem_limit: 512m
observability:
  prometheus_scrape: true
