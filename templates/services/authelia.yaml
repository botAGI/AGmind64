# yaml-language-server: $schema=../schemas/service.json
name: authelia
image: authelia/authelia:4.39.20
# Bumped 4.39.6 → 4.39.20 (latest 4.39.x patch) to clear the Go-stdlib CVE cluster
# (CVE-2025-68121 Critical + 8 High; rebuilt on go1.24.13+). grype 9H/2C → 0H/0C. INDEX digest
# (amd64/linux verified via docker manifest inspect). live-audit 2026-06-07 PROD-1.
digest: 1b363e9279e742397966333f364e0876ae02bf5c876de73e83af6d48c57ff51b
tier: edge
purpose: Optional 2FA / SSO
profiles:
- security
# Dual-homed: default (traefik forward-auth + host port) + data-net (its caged redis session
# store). live-audit 2026-06-05 (flat-network). K-2b.
networks:
- default
- data-net
ports:
- 127.0.0.1:9091:9091
# /config is WRITABLE: Authelia chowns it + writes db.sqlite3/notification.txt there.
# A staged configuration.yml + users_database.yml live here (see templates/authelia/);
# the 4 auth secrets come from mounted 0600 files below (_FILE convention), NOT plain env —
# narrows the docker-inspect / /proc-environ-visible plaintext surface (SPEC-15.4).
volumes:
# /config (writable): staged configuration.yml + users_database.yml; Authelia chowns it.
# /data (writable, persistent): sqlite DB + notifications — survives a config re-stage.
- /etc/agmind/authelia:/config
- /var/lib/agmind/authelia:/data
# Secret files (0600, installer/rotate-secrets materialized — AUTHELIA_SECRET_FILES in
# agmind/install/secret_keys.py). Authelia's native `_FILE` convention auto-loads any config
# key ending in key|secret|password|token|certificate_chain from the file it points at
# (authelia.com/configuration/methods/secrets/).
- /var/lib/agmind/secrets/authelia_session_secret:/run/secrets/authelia_session_secret:ro
- /var/lib/agmind/secrets/authelia_storage_encryption_key:/run/secrets/authelia_storage_encryption_key:ro
- /var/lib/agmind/secrets/authelia_reset_jwt_secret:/run/secrets/authelia_reset_jwt_secret:ro
- /var/lib/agmind/secrets/authelia_session_redis_password:/run/secrets/authelia_session_redis_password:ro
env:
  AUTHELIA_SESSION_SECRET_FILE: /run/secrets/authelia_session_secret
  AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/authelia_storage_encryption_key
  AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/authelia_reset_jwt_secret
  AUTHELIA_SESSION_REDIS_PASSWORD_FILE: /run/secrets/authelia_session_redis_password
depends_on:
- redis
# Authelia's OWN login portal must be routed at auth.<domain> WITH a cert. Without this
# routing block the renderer emits no traefik router for it, so the forwardAuth redirect
# target (https://auth.<domain>, from configuration.yml) has no router/cert → browsers get
# ERR_SSL_UNRECOGNIZED_NAME_ALERT and SSO is dead for EVERY protected service.
# chain-public = rate-limit + security-headers, NO authelia gating (the portal cannot sit
# behind itself → infinite redirect loop). Health is /api/health on Authelia 4.x.
access:
  login: admin
  # Generated at install, argon2id-hashed into users_database.yml (never the upstream
  # example password); surfaced here for the operator.
  password_env: AUTHELIA_ADMIN_PASSWORD
routing:
  host: auth.agmind.dev
  middleware_chain: chain-public
  healthcheck_path: /api/health
resources:
  cpus: 1.0
  mem_limit: 512m
  mem_reservation: 128m
# /api/health returns 200 {"status":"OK"} unauthenticated (verified live 2026-06-09 against
# 4.39.20) — matches routing.healthcheck_path. The image ships wget only (no curl/bash) — probe
# with wget. Phase 3: removes authelia from the A7 tech-debt exempt list.
health:
  test:
  - CMD
  - wget
  - -q
  - -O
  - /dev/null
  - http://localhost:9091/api/health
  start_period: 20s
  interval: 30s
  timeout: 5s
  retries: 3

# Hardening (SEC-2, security-live 2026-06-08): block runtime privilege escalation via
# setuid/file-caps. Safe here — the image either runs a plain server or drops privileges
# via gosu/su-exec (which no-new-privileges does NOT break; it only blocks privilege GAIN).
no_new_privileges: true
