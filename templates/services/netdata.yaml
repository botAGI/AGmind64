# yaml-language-server: $schema=../schemas/service.json
name: netdata
image: netdata/netdata:v2.10.4
digest: 689145f603fed0ca341b4d8a0fb9910cd9d8c0590b0530cd24ae1912a9c7f8f3
tier: ops
purpose: Real-time host and container health dashboard — Netdata v2.10.3 (2026-04-27)
owner: observability-stack
profiles:
- observability
# Dual-homed: default (scraped/UI) + internal mgmt-net (its go.d docker collector DOCKER_HOST is
# the docker-socket-proxy). live-audit 2026-06-07 (SEC-1).
networks:
- default
- mgmt-net
ports:
- 127.0.0.1:19999:19999
volumes:
- /var/lib/agmind/netdata/config:/etc/netdata
- /var/lib/agmind/netdata/lib:/var/lib/netdata
- /var/lib/agmind/netdata/cache:/var/cache/netdata
- /etc/passwd:/host/etc/passwd:ro
- /etc/group:/host/etc/group:ro
- /proc:/host/proc:ro
- /sys:/host/sys:ro
- /etc/os-release:/host/etc/os-release:ro
# NO raw /var/run/docker.sock — the go.d docker collector reaches the API via the read-only
# docker-socket-proxy (DOCKER_HOST). Validated live: netdata boots + 22 collectors run without
# the socket (cgroup-network container-name resolution is the only degraded bit — one startup log
# line, non-fatal). live-audit 2026-06-05 docker-sock-raw-mount-blast-radius.
env:
  DOCKER_HOST: tcp://docker-socket-proxy:2375
  DO_NOT_TRACK: '1'
  NETDATA_CLAIM_TOKEN: ''
  NETDATA_CLAIM_URL: ''
  NETDATA_CLAIM_ROOMS: ''
cap_add:
- SYS_PTRACE
- SYS_ADMIN
# NO no_new_privileges (SEC-2 exclusion): netdata runs setuid-root collector plugins
# (apps.plugin / ndsudo / debugfs.plugin) to read deep host metrics — no-new-privileges
# would void the setuid bit and break them. The cap_add + apparmor:unconfined above exist
# for exactly this privileged introspection, so nnp is intentionally omitted here.
security_opt:
- apparmor:unconfined
resources:
  cpus: 2.0
  mem_limit: 2g
  mem_reservation: 256m
routing:
  host: netdata.agmind.dev
  middleware_chain: chain-internal
  healthcheck_path: /api/v1/info
# No prometheus_scrape: netdata's /api/v1/allmetrics defaults to format=shell (not
# Prometheus), and the renderer copies metrics_path verbatim so a `?format=prometheus`
# query would be URL-encoded into a 404. Its host/CPU/mem metrics already come from
# node-exporter + cAdvisor; netdata stays a standalone UI (review MEDIUM
# netdata-scrape-not-prometheus).

# Phase O capabilities — pulls the docker-socket-proxy into the closure (read-only Docker API).
consumes:
- docker_api
