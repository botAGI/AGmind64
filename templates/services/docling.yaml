# yaml-language-server: $schema=../schemas/service.json
name: docling
image: quay.io/docling-project/docling-serve-cpu:v1.18.0
digest: fa1b087efcad34fe10f9f7dc3ce7e9913849a2836c9572c68e1d59074bd3228d
tier: app
purpose: Document parsing CPU-only (per R7); RapidOcr regression fixed
profiles:
- rag
ports:
- 127.0.0.1:5002:5001
volumes:
# Image runs as uid 1001 with HOME=/opt/app-root/src and DOCLING_SERVE_ARTIFACTS_PATH
# under .cache there — mount the real cache path (not /root/.cache, which persists
# nothing). Host dir pre-created 1001:1001 in bootstrap so the non-root user can write.
- /var/lib/agmind/docling-cache:/opt/app-root/src/.cache
run_as_uid: 1001
# run_as_gid defaults to run_as_uid (1001)
writable_mounts:
- /var/lib/agmind/docling-cache
env:
  DOCLING_SERVE_ALLOW_CUSTOM_OCR_CONFIG: 'true'
resources:
  cpus: 12.0
  mem_limit: 16g
  mem_reservation: 1g
# /health returns 200 (verified live; curl present). Generous start_period — docling-serve
# loads OCR/layout models on boot. live-audit 2026-06-05 userfacing-services-no-docker-healthcheck.
health:
  test:
  - CMD
  - curl
  - -fsS
  - http://localhost:5001/health
  start_period: 120s
  interval: 15s
  timeout: 5s
  retries: 15

# Hardening (SEC-2, security-live 2026-06-08): block runtime privilege escalation via
# setuid/file-caps. Safe here — the image either runs a plain server or drops privileges
# via gosu/su-exec (which no-new-privileges does NOT break; it only blocks privilege GAIN).
no_new_privileges: true
