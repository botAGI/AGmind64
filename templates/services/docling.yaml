# yaml-language-server: $schema=../schemas/service.json
name: docling
image: quay.io/docling-project/docling-serve-cpu:v1.28.0
digest: cc207e1eb768878456ed98042c5d84fae56af3729a9c03d3e5c8fef393902956
tier: app
purpose: Document parsing CPU-only (per R7); PP-OCRv6 — 2026-07-22
profiles:
- rag
ports:
- 127.0.0.1:5002:5001
volumes:
# Image runs as uid 1001 with HOME=/opt/app-root/src and BAKES 745MB of models at
# DOCLING_SERVE_ARTIFACTS_PATH=/opt/app-root/src/.cache/docling/models (v1.27+). Mounting the
# whole .cache would MASK the baked models → docling re-downloads them from HuggingFace on first
# boot (zero-egress break + slow start), so we mount only the huggingface subdir BELOW it. The
# baked docling/models survive; the hf cache persists. Host dir pre-created 1001:1001 in bootstrap.
# Verified live 2026-07-22: v1.27 boots healthy with egress blocked ("No model weights will be
# downloaded at runtime") under this mount + HF_HUB_OFFLINE.
- /var/lib/agmind/docling-cache:/opt/app-root/src/.cache/huggingface
run_as_uid: 1001
# run_as_gid defaults to run_as_uid (1001)
writable_mounts:
- /var/lib/agmind/docling-cache
env:
  DOCLING_SERVE_ALLOW_CUSTOM_OCR_CONFIG: 'true'
  # Zero-egress (Карпатый чек-лист п.15): the models are baked, so forbid any runtime HF fetch
  # and its telemetry. Fail-closed — a masked/missing model must error, not silently phone home.
  HF_HUB_OFFLINE: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
resources:
  cpus: 12.0
  mem_limit: 16g
  mem_reservation: 1g
# /health returns 200 (verified live; curl present). Generous start_period — docling-serve
# loads OCR/layout models on boot. live-audit 2026-06-05 userfacing-services-no-docker-healthcheck.
health:
  test:
  - CMD
  - curl
  - -fsS
  - http://localhost:5001/health
  start_period: 120s
  interval: 15s
  timeout: 5s
  retries: 15

# Hardening (SEC-2, security-live 2026-06-08): block runtime privilege escalation via
# setuid/file-caps. Safe here — the image either runs a plain server or drops privileges
# via gosu/su-exec (which no-new-privileges does NOT break; it only blocks privilege GAIN).
no_new_privileges: true
