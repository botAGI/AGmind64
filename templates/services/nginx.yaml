# yaml-language-server: $schema=../schemas/service.json
name: nginx
image: nginx:1.31.1-alpine
digest: 8b1e78743a03dbb2c95171cc58639fef29abc8816598e27fb910ed2e621e589a
tier: edge
purpose: Reverse proxy mainline 1.31 (2026-05-15) — LAN only, *.local
profiles:
- core-nginx
ports:
- 80:80
- 443:443
volumes:
- /etc/agmind/nginx:/etc/nginx/conf.d:ro
- /var/lib/agmind/nginx-cache:/var/cache/nginx
# No hard depends_on the dify stack: per Правила §12 a reverse proxy must not
# hard-depend on its app upstreams (it would break the standalone `core-nginx`
# render — nginx вместо traefik). Mirrors traefik, which reaches upstreams via
# discovery + the app's own `routing:` labels rather than depends_on.
resources:
  cpus: 2.0
  mem_limit: 256m
health:
  test:
  - CMD
  - wget
  - -qO-
  - http://localhost/_nginx_health

# Phase O capabilities
provides:
- reverse_proxy
