# yaml-language-server: $schema=../schemas/service.json
name: nginx
image: nginx:1.31.0-alpine
digest: dc48b7a872a79fb541ba5081d320b11b549231bc63ba465a7495afaa7d2ebcb8
tier: edge
purpose: Reverse proxy mainline 1.31 (2026-05-15) — LAN only, *.local
profiles:
- core-nginx
ports:
- 80:80
- 443:443
volumes:
- /etc/agmind/nginx:/etc/nginx/conf.d:ro
- /var/lib/agmind/nginx-cache:/var/cache/nginx
depends_on:
- dify-api
- dify-web
resources:
  cpus: 2.0
  mem_limit: 256m
health:
  test:
  - CMD
  - wget
  - -qO-
  - http://localhost/_nginx_health
