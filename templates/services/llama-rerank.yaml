# yaml-language-server: $schema=../schemas/service.json
name: llama-rerank
image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b9049
tier: inference
purpose: Reranker (bge-reranker-v2-m3 / custom) via llama-server pooling=rank
profiles:
- core
ports:
- 127.0.0.1:8082:8080
volumes:
- /var/lib/agmind/models:/models:ro
env:
  AMD_VULKAN_ICD: RADV
  VK_DRIVER_FILES: /usr/share/vulkan/icd.d/radeon_icd.x86_64.json
  # Phase M5.1: rerank model + per-service settings (separate from LLM / embed).
  # Empty AGMIND_RERANK_FILE → service start будет fail; убери из services list
  # если rerank не нужен.
  AGMIND_RERANK_FILE: ${AGMIND_RERANK_FILE:-}
  AGMIND_RERANK_CTX_SIZE: ${AGMIND_RERANK_CTX_SIZE:-2048}
command:
- --host
- 0.0.0.0
- --port
- '8080'
- --model
- /models/${AGMIND_RERANK_FILE}
- --reranking
- --pooling
- rank
- -ngl
- '999'
- --ctx-size
- ${AGMIND_RERANK_CTX_SIZE}
devices:
- /dev/dri
group_add:
- video
- render
resources:
  cpus: 4.0
  mem_limit: 8g
routing:
  host: rerank.agmind.dev
  middleware_chain: chain-llm
observability:
  prometheus_scrape: true

# Phase O capabilities
provides:
- reranker
