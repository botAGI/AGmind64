# yaml-language-server: $schema=../schemas/service.json
name: llama-rerank
image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b9049
digest: e359c01203861cf1d802795b8d443ed44660b6ff3f61ba04d7de6ead781c580a
tier: inference
purpose: Reranker (bge-reranker-v2-m3 / custom) via llama-server pooling=rank
profiles:
- core
ports:
- 127.0.0.1:8082:8080
volumes:
- /var/lib/agmind/models:/models:ro
env:
  AMD_VULKAN_ICD: RADV
  # radeon_icd.json is the RADV manifest the server-vulkan image actually ships; the
  # radeon_icd.x86_64.json (Debian-multiarch) name is ABSENT here and pinning it disabled
  # the GPU → CPU fallback (live-audit 2026-06-05 HIGH). Verify on each server-vulkan bump.
  VK_DRIVER_FILES: /usr/share/vulkan/icd.d/radeon_icd.json
  # Phase M5.1: rerank model + per-service settings (separate from LLM / embed).
  AGMIND_RERANK_FILE: ${AGMIND_RERANK_FILE:-bge-reranker-v2-m3-Q8_0.gguf}
  AGMIND_RERANK_CTX_SIZE: ${AGMIND_RERANK_CTX_SIZE:-2048}
command:
- --host
- 0.0.0.0
- --port
- '8080'
# Enable the Prometheus /metrics endpoint (404 without it) so prometheus_scrape works.
- --metrics
- --model
- /models/${AGMIND_RERANK_FILE:-bge-reranker-v2-m3-Q8_0.gguf}
- --reranking
- --pooling
- rank
- -ngl
- '999'
- --ctx-size
- ${AGMIND_RERANK_CTX_SIZE:-2048}
# Phase 14 (M9.C, D-01): rerank batches concurrent requests well (short inputs,
# no per-request state) — 2 slots, matching llama-embed's env-driven np4 precedent
# in spirit but hardcoded (no existing tunability infra for rerank; minimal diff).
- --parallel
- '2'
devices:
- /dev/dri
group_add:
- video
- render
resources:
  cpus: 4.0
  mem_limit: 8g
  mem_reservation: 2g
health:
  test:
  - CMD
  - curl
  - -f
  - http://localhost:8080/health
  start_period: 600s
  interval: 15s
  retries: 5
access:
  api_kind: openai
routing:
  host: rerank.agmind.dev
  middleware_chain: chain-llm
observability:
  prometheus_scrape: true

# Phase O capabilities
provides:
- reranker

# Hardening (SEC-2, security-live 2026-06-08): block runtime privilege escalation via
# setuid/file-caps. Safe here — the image either runs a plain server or drops privileges
# via gosu/su-exec (which no-new-privileges does NOT break; it only blocks privilege GAIN).
no_new_privileges: true
