# yaml-language-server: $schema=../schemas/service.json
name: llama-rerank
image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b9049
digest: e359c01203861cf1d802795b8d443ed44660b6ff3f61ba04d7de6ead781c580a
tier: inference
purpose: Reranker (bge-reranker-v2-m3 / custom) via llama-server pooling=rank
profiles:
- core
ports:
- 127.0.0.1:8082:8080
volumes:
- /var/lib/agmind/models:/models:ro
env:
  AMD_VULKAN_ICD: RADV
  VK_DRIVER_FILES: /usr/share/vulkan/icd.d/radeon_icd.x86_64.json
  # Phase M5.1: rerank model + per-service settings (separate from LLM / embed).
  AGMIND_RERANK_FILE: ${AGMIND_RERANK_FILE:-bge-reranker-v2-m3-Q8_0.gguf}
  AGMIND_RERANK_CTX_SIZE: ${AGMIND_RERANK_CTX_SIZE:-2048}
command:
- --host
- 0.0.0.0
- --port
- '8080'
# Enable the Prometheus /metrics endpoint (404 without it) so prometheus_scrape works.
- --metrics
- --model
- /models/${AGMIND_RERANK_FILE:-bge-reranker-v2-m3-Q8_0.gguf}
- --reranking
- --pooling
- rank
- -ngl
- '999'
- --ctx-size
- ${AGMIND_RERANK_CTX_SIZE:-2048}
devices:
- /dev/dri
group_add:
- video
- render
resources:
  cpus: 4.0
  mem_limit: 8g
health:
  test:
  - CMD
  - curl
  - -f
  - http://localhost:8080/health
  start_period: 600s
  interval: 15s
  retries: 5
access:
  api_kind: openai
routing:
  host: rerank.agmind.dev
  middleware_chain: chain-llm
observability:
  prometheus_scrape: true

# Phase O capabilities
provides:
- reranker
