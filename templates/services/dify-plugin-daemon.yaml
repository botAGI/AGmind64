# yaml-language-server: $schema=../schemas/service.json
name: dify-plugin-daemon
image: langgenius/dify-plugin-daemon:0.6.1-local
digest: fa7ad45e1b2a777cd243b902609abecb4fd924adcd13d21ef4258b5090a09be5
tier: app
purpose: Dify plugin runtime — 2026-04
profiles:
- rag
env:
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_USERNAME: dify
  DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  DB_DATABASE: dify
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  # B1: redis runs with --requirepass; dify-plugin-daemon reads REDIS_PASSWORD
  # (confirmed from dify-plugin-daemon/.env.example: REDIS_PASSWORD=difyai123456).
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  SERVER_PORT: '5002'
  # SERVER_KEY here MUST equal PLUGIN_DAEMON_KEY on dify-api (shared var);
  # DIFY_INNER_API_KEY MUST equal INNER_API_KEY_FOR_PLUGIN on dify-api.
  SERVER_KEY: ${DIFY_PLUGIN_DAEMON_KEY:-changeme-plugin-daemon-key}
  DIFY_INNER_API_URL: http://dify-api:5001
  DIFY_INNER_API_KEY: ${DIFY_PLUGIN_INNER_API_KEY:-changeme-inner-api-key}
  PLUGIN_WORKING_PATH: /app/storage/cwd
  # PLUGIN_REMOTE_INSTALLING_ENABLED defaults true in the image; without HOST/PORT
  # the daemon panics at startup. Match the langgenius reference compose defaults.
  PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
  PLUGIN_REMOTE_INSTALLING_PORT: '5003'
depends_on:
- postgres
- redis
resources:
  cpus: 2.0
  mem_limit: 2g

# Hardening (live-audit 2026-06-05): block privilege escalation via setuid/file-caps.
no_new_privileges: true
