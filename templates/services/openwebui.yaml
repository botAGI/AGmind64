# yaml-language-server: $schema=../schemas/service.json
name: openwebui
# digest must be the top-level OCI index digest, not the amd64 leaf (the old ef3eaeb6… was the leaf).
image: ghcr.io/open-webui/open-webui:v0.10.2
digest: 9fcea9c6e32ab60b0498f3986c6cdf651ddbe61db48d2213a3d28048ddd673d4
tier: app
purpose: Optional chat UI на OpenAI-compat llama-server — 2026-05-10
profiles:
- ui
# NO host port — access ONLY via traefik (chat.agmind.dev) behind Authelia. A 127.0.0.1 loopback
# port let any host-local process reach the open first-admin signup before the operator claims it
# (live-audit 2026-06-05 openwebui-first-admin-loopback). traefik routes over the network; the
# healthcheck uses the container-internal port — nothing needs the host publish.
volumes:
- /var/lib/agmind/openwebui:/app/backend/data
env:
  # OPENAI_API_BASE_URL (+ OPENAI_API_KEY) are injected by the llm_inference capability
  # binding ONLY when llama-llm is in the rendered set. Do NOT hardcode them here — with
  # model_id=skip there is no llama-llm and a static endpoint dangles at a dead DNS name
  # (live-audit 2026-06-05 HIGH dangling-llama-llm). See agmind/services/capability_bindings.py.
  ENABLE_OPENAI_API: 'true'
  WEBUI_AUTH: 'true'
  ENABLE_RAG_HYBRID_SEARCH: 'true'
  # zero-egress: open-webui bundles ChromaDB, whose PostHog client phones home unless
  # ANONYMIZED_TELEMETRY=False; DO_NOT_TRACK/SCARF_NO_ANALYTICS suppress the same in bundled
  # deps (belt-and-suspenders, matches netdata DO_NOT_TRACK). OFFLINE_MODE disables the
  # version-check + auto model downloads AND sets HF_HUB_OFFLINE=1 internally (env.py), so no
  # Hugging Face fetch happens at boot. These four env knobs are unchanged upstream through the
  # v0.9.5 → v0.10.2 (2026-07) minor bump; last source-verified 2026-06-09 against v0.9.5
  # (config.py / env.py) + https://docs.openwebui.com/tutorials/maintenance/offline-mode/
  # NB: local embeddings are NOT hardcoded here — pointing RAG_OPENAI_API_BASE_URL at
  # llama-embed:8080 would dangle at a dead DNS when llama-embed is not deployed (same class
  # as the dangling-llama-llm HIGH, live-audit 2026-06-05). That endpoint must come from a
  # capability binding when both services are co-deployed, never a static value.
  ANONYMIZED_TELEMETRY: 'False'
  DO_NOT_TRACK: 'True'
  SCARF_NO_ANALYTICS: 'True'
  OFFLINE_MODE: 'True'
resources:
  cpus: 2.0
  mem_limit: 2g
  mem_reservation: 1g
# /health returns 200 (verified live; curl present). live-audit 2026-06-05
# userfacing-services-no-docker-healthcheck.
health:
  test:
  - CMD
  - curl
  - -fsS
  - http://localhost:8080/health
  start_period: 60s
  interval: 15s
  timeout: 5s
  retries: 10
access:
  first_login_register: true
routing:
  host: chat.agmind.dev
  middleware_chain: chain-llm
  sse: true

# Phase O capabilities
consumes:
- llm_inference

# Hardening (live-audit 2026-06-05): block privilege escalation via setuid/file-caps.
no_new_privileges: true
