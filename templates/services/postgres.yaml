# yaml-language-server: $schema=../schemas/service.json
name: postgres
image: postgres:17.10-alpine3.22
digest: b02d9b5bcf608c2719da32cdabee274a33841202487fd5dc9b065b63f886753f
tier: storage
purpose: Dify metadata + plugin state — PG 17 LTS (2026-05-16)
profiles:
- rag
- observability
# Caged on the internal data-net (no host route) — consumers (dify-*, postgres-exporter) are
# dual-homed; a compromised internet-facing app on the shared net can't reach it.
# live-audit 2026-06-05 (flat-network). K-2b.
networks:
- data-net
volumes:
- /var/lib/agmind/postgres:/var/lib/postgresql/data
# Password as a 0600 file, NOT env — keeps it out of `docker inspect` / socket-proxy inspect.
# The installer writes secrets/postgres_password (= the generated POSTGRES_PASSWORD that consumers
# still use via env). live-audit 2026-06-05 db-secrets-plaintext-docker-inspect.
- /var/lib/agmind/secrets/postgres_password:/run/secrets/postgres_password:ro
env:
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  POSTGRES_DB: dify
  POSTGRES_USER: dify
  PGDATA: /var/lib/postgresql/data/pgdata
resources:
  cpus: 4.0
  mem_limit: 4g
  mem_reservation: 256m
health:
  test:
  - CMD-SHELL
  - pg_isready -U dify -d dify
  interval: 10s
  retries: 5

# Phase O capabilities
provides:
- postgres_db

# Hardening (SEC-2, security-live 2026-06-08): block runtime privilege escalation via
# setuid/file-caps. Safe here — the image either runs a plain server or drops privileges
# via gosu/su-exec (which no-new-privileges does NOT break; it only blocks privilege GAIN).
no_new_privileges: true
