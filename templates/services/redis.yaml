# yaml-language-server: $schema=../schemas/service.json
name: redis
image: redis:8.4.3-alpine
digest: 52e68c6542d1b658a207ba63e7545963ec7cde6c7efc8948108edfa7e339ff73
tier: storage
purpose: Dify task queue + plugin cache — Redis 8 (2026-05-09)
profiles:
- rag
- ragflow
# authelia (security profile) uses redis as its session store + depends_on redis, so
# redis must be selectable with `security` too (else security-alone fails to render).
- security
# B1: activate server-side auth via --requirepass. The official redis:alpine image does
# NOT read REDIS_PASSWORD env (that is a Bitnami convention) — only this command flag
# activates authentication. env.REDIS_PASSWORD was removed because it was silently ignored.
command:
- redis-server
- --requirepass
- ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
volumes:
- /var/lib/agmind/redis:/data
resources:
  cpus: 2.0
  mem_limit: 2g
health:
  test:
  - CMD
  - redis-cli
  - --no-auth-warning
  - -a
  - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  - ping
  interval: 10s

# Phase O capabilities
provides:
- redis_cache
