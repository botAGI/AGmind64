# yaml-language-server: $schema=../schemas/service.json
name: dify-web
image: langgenius/dify-web:1.14.2
digest: db73434e185ac778f31f4cc1adcce0dbe84b41a95ea5af58216acf095eed5f67
tier: app
purpose: Dify frontend Next.js
profiles:
- rag
ports:
- 127.0.0.1:3000:3000
env:
  CONSOLE_API_URL: ''
  APP_API_URL: ''
depends_on:
- dify-api
resources:
  cpus: 2.0
  mem_limit: 2g
routing:
  host: dify.agmind.dev
  middleware_chain: chain-llm
  sse: true
  # dify-web is a Next.js app with NO /health route → the /health default 404s → traefik
  # marks the backend DOWN and drops it (502 at dify.<domain>). / returns 307→/apps, which
  # is inside traefik's healthy 2XX-3XX range. Same class as the ragflow healthcheck fix.
  healthcheck_path: /
  # Catch-all on dify.<domain>: LOW priority so the path-scoped dify-api router (priority 100)
  # wins for /console/api,/api,/v1,/files,/mcp,/triggers,/socket.io; everything else (/,
  # /explore, static) lands here. Without an explicit priority traefik could rank this
  # host-only rule above dify-api and steal the API paths.
  priority: 1
