# yaml-language-server: $schema=../schemas/service.json
name: agent-ui
# Agno's OFFICIAL Agent UI (agno-agi/agent-ui), self-hosted — NOT the os.agno.com hosted control
# plane. Built on-host from pinned source (compose-native build:, digest-exempt like the agents); a
# Next.js chat client for OUR AgentOS (agent-agno). The image bakes a same-origin reverse-proxy
# (/os-api/* → agent-agno:8800) so the browser talks to AgentOS through the UI's own origin — no
# CORS, no per-install domain baked in, no separate AgentOS browser exposure. Works out of the box.
image: agmind-agent-ui:0.1.0
build:
  context: "."
  dockerfile: docker/Dockerfile.agent-ui
tier: app
purpose: Self-hosted Agno Agent UI for the Agno agent (built on-host) — opt-in agents-agno
owner: agent-stack
# Agno's UI speaks the AgentOS API, so it serves the Agno agent only (agents-agno profile).
profiles:
- agents-agno
resources:
  cpus: 1.0
  mem_limit: 1g
  mem_reservation: 256m
health:
  test:
  - CMD
  - curl
  - -fsS
  - http://localhost:3000/
  start_period: 40s
  interval: 15s
  timeout: 5s
  retries: 10
access:
  note: "Self-hosted Agno Agent UI (chat). Talks to the Agno AgentOS same-origin via /os-api. Authelia gates the edge; pick the agmind-agno agent and chat."
routing:
  host: agents.agmind.dev
  middleware_chain: chain-llm
  sse: true
# Consumes the AgentOS surface that agent-agno provides (same profile → resolves in-closure). The
# proxy upstream (agent-agno:8800) is baked into the image at build time (Next.js compiles rewrites).
consumes:
- agent_api
# Hardening: non-root (uid 10001 in the image) + block privilege escalation + drop all caps.
no_new_privileges: true
cap_drop:
- ALL
