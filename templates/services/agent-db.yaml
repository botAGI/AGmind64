# yaml-language-server: $schema=../schemas/service.json
name: agent-db
image: pgvector/pgvector:pg17
# Postgres 17 + pgvector. INDEX digest (amd64/linux verified via docker image inspect).
digest: feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
tier: storage
purpose: Postgres+pgvector for agent session/memory + DBOS checkpoints — opt-in agents
owner: agent-stack
# Both agent profiles consume it (agno session/memory always; pydanticai for DBOS durability).
profiles:
- agents-pydantic
- agents-agno
# Caged on the internal data-net (no host route), exactly like the dify postgres + milvus-minio.
# Its OWN root credential (separate trust domain from the dify postgres) — leaking one DB root
# does not grant the other.
networks:
- data-net
volumes:
- /var/lib/agmind/agent-db:/var/lib/postgresql/data
# DB password as a 0600 FILE (not env) — the installer writes it via DB_SECRET_FILES; the smoke
# synthesises it. Postgres reads *_FILE while still root, so no reader-uid entry is needed.
- /var/lib/agmind/secrets/agent_db_password:/run/secrets/agent_db_password:ro
env:
  POSTGRES_USER: agent
  POSTGRES_DB: agents
  POSTGRES_PASSWORD_FILE: /run/secrets/agent_db_password
  PGDATA: /var/lib/postgresql/data/pgdata
resources:
  cpus: 2.0
  mem_limit: 2g
  mem_reservation: 128m
health:
  test:
  - CMD-SHELL
  - pg_isready -U agent -d agents
  start_period: 30s
  interval: 10s
  timeout: 5s
  retries: 5
# Bespoke capability (NOT vector_db — that would conflict with qdrant/milvus as providers).
provides:
- agent_state
# Hardening: the pgvector/postgres image runs as root and self-chowns PGDATA (no run_as_uid →
# no bootstrap numeric-uid row; agent-db goes in ROOT_WRITER_ALLOWLIST instead).
no_new_privileges: true
