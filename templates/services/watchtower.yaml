# yaml-language-server: $schema=../schemas/service.json
name: watchtower
image: containrrr/watchtower:1.7.1
digest: 6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038
tier: ops
purpose: Container update monitor in dry-run mode — Watchtower 1.7.1
owner: observability-stack
profiles:
- observability
# mgmt-net ONLY — the raw-socket updater has no network callers, so isolate it from the app tier
# (a compromised app can't reach it). live-audit 2026-06-07 (SEC-1).
networks:
- mgmt-net
volumes:
- /var/run/docker.sock:/var/run/docker.sock:ro
env:
  WATCHTOWER_MONITOR_ONLY: 'true'
  WATCHTOWER_CLEANUP: 'false'
  WATCHTOWER_SCHEDULE: 0 0 4 * * *
  WATCHTOWER_NO_RESTART: 'true'
  # containrrr/watchtower 1.7.1's bundled Docker API client negotiates v1.25, which
  # Docker Engine 29 rejects (min 1.44). Pin the client to a supported API version.
  DOCKER_API_VERSION: '1.44'
resources:
  cpus: 0.5
  mem_limit: 256m
  mem_reservation: 64m
# Block privilege escalation via setuid/file-caps — watchtower holds the docker socket (monitor-
# only here) so it's a high-value target. Missed the original ops no-new-priv sweep (portainer
# got it). live-audit 2026-06-07 watchtower-missing-no-new-priv (SEC-2).
no_new_privileges: true
