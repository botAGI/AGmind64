# yaml-language-server: $schema=../schemas/service.json
name: dify-api
image: langgenius/dify-api:1.14.2
digest: 062815df8ed6fcf82285e55f3cb5586241b2828e6695a3fb8114bfb99b5e8517
tier: app
purpose: Dify backend API
profiles:
- rag
ports:
- 127.0.0.1:5001:5001
volumes:
- /var/lib/agmind/dify/storage:/app/api/storage
run_as_uid: 1001
# run_as_gid defaults to run_as_uid (1001)
writable_mounts:
- /var/lib/agmind/dify/storage
env:
  MODE: api
  LOG_LEVEL: INFO
  # Run Flask-Migrate `db upgrade` on boot. Without this Dify's schema is never created
  # (relation "dify_setups" does not exist) → every console/API call 500s and the web UI
  # /install page hangs. The api container is the single migration owner (NOT the worker).
  MIGRATION_ENABLED: 'true'
  DB_HOST: postgres
  DB_PORT: '5432'
  # Pin AGmind's actual postgres creds (POSTGRES_USER=dify); without these the
  # image defaults to postgres/difyai123456 and mismatches our postgres.
  DB_USERNAME: dify
  DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  DB_DATABASE: dify
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  # B1: redis runs with --requirepass; the official dify image reads REDIS_PASSWORD.
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  # Inner-API handshake with dify-plugin-daemon — keys MUST match the daemon side.
  PLUGIN_DAEMON_KEY: ${DIFY_PLUGIN_DAEMON_KEY:-changeme-plugin-daemon-key}
  PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
  INNER_API_KEY_FOR_PLUGIN: ${DIFY_PLUGIN_INNER_API_KEY:-changeme-inner-api-key}
depends_on:
- postgres
- redis
resources:
  cpus: 4.0
  mem_limit: 4g
# Dify is multi-component on ONE host: traefik path-routes these prefixes to dify-api:5001
# (priority 100) and everything else (/, /explore, static) falls to the dify-web catch-all
# router (priority 1) on the same host. Path list = Dify 1.14.2's own nginx default.conf
# (/console/api,/api,/v1,/files,/mcp,/triggers,/socket.io → api; /explore → web). Without
# this the browser's /console/api calls hit dify-web (404) → /install hangs forever.
routing:
  host: dify.agmind.dev
  middleware_chain: chain-llm
  sse: true
  healthcheck_path: /health
  priority: 100
  path_prefixes:
  - /console/api
  - /api
  - /v1
  - /files
  - /mcp
  - /triggers
  - /socket.io

# Phase O capabilities (revised post-research, ADR-0011 amendment)
# Dify coexists с RAGFlow и может consume его как external KB через
# witmeng/ragflow-api plugin. Capability dify_external_kb опционально
# подцепляется if ragflow present.
consumes:
- llm_inference
- embedding_inference
- reranker
- vector_db
- dify_external_kb

# Hardening (live-audit 2026-06-05): block privilege escalation via setuid/file-caps.
no_new_privileges: true
