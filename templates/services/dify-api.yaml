# yaml-language-server: $schema=../schemas/service.json
name: dify-api
image: langgenius/dify-api:1.14.2
digest: 062815df8ed6fcf82285e55f3cb5586241b2828e6695a3fb8114bfb99b5e8517
tier: app
purpose: Dify backend API
profiles:
- rag
ports:
- 127.0.0.1:5001:5001
volumes:
- /var/lib/agmind/dify/storage:/app/api/storage
run_as_uid: 1001
# run_as_gid defaults to run_as_uid (1001)
writable_mounts:
- /var/lib/agmind/dify/storage
env:
  MODE: api
  LOG_LEVEL: INFO
  DB_HOST: postgres
  DB_PORT: '5432'
  # Pin AGmind's actual postgres creds (POSTGRES_USER=dify); without these the
  # image defaults to postgres/difyai123456 and mismatches our postgres.
  DB_USERNAME: dify
  DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  DB_DATABASE: dify
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  # Inner-API handshake with dify-plugin-daemon — keys MUST match the daemon side.
  PLUGIN_DAEMON_KEY: ${DIFY_PLUGIN_DAEMON_KEY:-changeme-plugin-daemon-key}
  PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
  INNER_API_KEY_FOR_PLUGIN: ${DIFY_PLUGIN_INNER_API_KEY:-changeme-inner-api-key}
depends_on:
- postgres
- redis
resources:
  cpus: 4.0
  mem_limit: 4g

# Phase O capabilities (revised post-research, ADR-0011 amendment)
# Dify coexists с RAGFlow и может consume его как external KB через
# witmeng/ragflow-api plugin. Capability dify_external_kb опционально
# подцепляется if ragflow present.
consumes:
- llm_inference
- embedding_inference
- reranker
- vector_db
- dify_external_kb
