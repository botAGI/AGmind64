# yaml-language-server: $schema=../schemas/service.json
name: dify-api
image: langgenius/dify-api:1.14.2
digest: 062815df8ed6fcf82285e55f3cb5586241b2828e6695a3fb8114bfb99b5e8517
tier: app
purpose: Dify backend API
profiles:
- rag
# Tri-homed: default (traefik edge + host port), data-net (its caged postgres/redis/qdrant
# + milvus backends), and ssrf-net so the workflow Code node can reach the caged dify-sandbox
# at http://dify-sandbox:8194 (sandbox lives ONLY on ssrf-net). live-audit 2026-06-05
# (flat-network). K-2b. 2026-06-10: ssrf-net added — code-exec to sandbox was unroutable.
networks:
- default
- data-net
- ssrf-net
ports:
- 127.0.0.1:5001:5001
volumes:
- /var/lib/agmind/dify/storage:/app/api/storage
run_as_uid: 1001
# run_as_gid defaults to run_as_uid (1001)
writable_mounts:
- /var/lib/agmind/dify/storage
env:
  MODE: api
  LOG_LEVEL: INFO
  # Default doc upload cap is 15 MB (dify_config.UPLOAD_FILE_SIZE_LIMIT) — too small for real
  # PDF/DOCX/PPTX (e.g. markitdown conversion). Raise to 100 MB (matches the Cloudflare-tunnel
  # body ceiling on the external route). Dify ships this via a shared .env, so set on api+worker.
  # 2026-06-30.
  UPLOAD_FILE_SIZE_LIMIT: '100'
  # zero-egress: dify-api/console polls CHECK_UPDATE_URL (default https://updates.dify.ai) and
  # the console calls marketplace.dify.ai unless MARKETPLACE_ENABLED=false. Empty CHECK_UPDATE_URL
  # = disabled (docs: "useful for air-gapped"). These are api/console vars, NOT dify-web. verified
  # 2026-06-09 against dify 1.14.2 https://docs.dify.ai/en/self-host/configuration/environments +
  # https://github.com/langgenius/dify/blob/1.14.2/docker/.env.example
  CHECK_UPDATE_URL: ''
  MARKETPLACE_ENABLED: 'false'
  # Cage the HTTP-request node + MCP/tool fetches (user-controlled URLs) through the ssrf-proxy
  # squid — blocks SSRF to cloud metadata / the LAN. dify reads SSRF_PROXY_* ONLY for these user
  # fetches, NOT model-provider or DB calls (verified live: api/core/mcp/utils.py).
  # live-audit 2026-06-05 dify-api-worker-egress-unproxied.
  SSRF_PROXY_HTTP_URL: http://ssrf-proxy:3128
  SSRF_PROXY_HTTPS_URL: http://ssrf-proxy:3128
  # Run Flask-Migrate `db upgrade` on boot. Without this Dify's schema is never created
  # (relation "dify_setups" does not exist) → every console/API call 500s and the web UI
  # /install page hangs. The api container is the single migration owner (NOT the worker).
  MIGRATION_ENABLED: 'true'
  DB_HOST: postgres
  DB_PORT: '5432'
  # Pin AGmind's actual postgres creds (POSTGRES_USER=dify); without these the
  # image defaults to postgres/difyai123456 and mismatches our postgres.
  DB_USERNAME: dify
  DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  DB_DATABASE: dify
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  # B1: redis runs with --requirepass; the official dify image reads REDIS_PASSWORD.
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  # Celery broker for async tasks AND the advanced-chat/workflow streaming-task dispatch.
  # Without this the api falls back to Celery's default amqp://localhost (no broker) →
  # "Failed to enqueue streaming task" → chatflow/workflow apps hang ~300s. 2026-06-10: api
  # was missing it (only the worker had it) → advanced-chat never started. Mirrors dify-worker.
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
  # Inner-API handshake with dify-plugin-daemon — keys MUST match the daemon side.
  PLUGIN_DAEMON_KEY: ${DIFY_PLUGIN_DAEMON_KEY:-changeme-plugin-daemon-key}
  PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
  INNER_API_KEY_FOR_PLUGIN: ${DIFY_PLUGIN_INNER_API_KEY:-changeme-inner-api-key}
  # Workflow Code node → dify-sandbox (caged on ssrf-net; api joins ssrf-net above). Key MUST
  # match the sandbox's API_KEY. Without these, code nodes fail "sandbox: Name or service not
  # known" (endpoint defaults to an unroutable host). 2026-06-10.
  CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
  CODE_EXECUTION_API_KEY: ${DIFY_SANDBOX_API_KEY:-dify-sandbox}
depends_on:
- postgres
- redis
resources:
  cpus: 4.0
  mem_limit: 4g
  mem_reservation: 512m
# /health returns 200 once Flask + the boot migration are up (verified live; curl present).
# Generous start_period: dify-api runs `db upgrade` on boot. live-audit 2026-06-05
# userfacing-services-no-docker-healthcheck.
health:
  test:
  - CMD
  - curl
  - -fsS
  - http://localhost:5001/health
  start_period: 180s
  interval: 15s
  timeout: 5s
  retries: 20
# Dify is multi-component on ONE host: traefik path-routes these prefixes to dify-api:5001
# (priority 100) and everything else (/, /explore, static) falls to the dify-web catch-all
# router (priority 1) on the same host. Path list = Dify 1.14.2's own nginx default.conf
# (/console/api,/api,/v1,/files,/mcp,/triggers,/socket.io → api; /explore → web). Without
# this the browser's /console/api calls hit dify-web (404) → /install hangs forever.
routing:
  host: dify.agmind.dev
  middleware_chain: chain-llm
  sse: true
  healthcheck_path: /health
  priority: 100
  path_prefixes:
  - /console/api
  - /api
  - /v1
  - /files
  - /mcp
  - /triggers
  - /socket.io

# Phase O capabilities (revised post-research, ADR-0011 amendment)
# Dify coexists с RAGFlow и может consume его как external KB через
# witmeng/ragflow-api plugin. Capability dify_external_kb опционально
# подцепляется if ragflow present.
consumes:
- llm_inference
- embedding_inference
- reranker
- vector_db
- dify_external_kb

# Hardening (live-audit 2026-06-05): block privilege escalation via setuid/file-caps.
no_new_privileges: true
