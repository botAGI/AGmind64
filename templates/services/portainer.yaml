# yaml-language-server: $schema=../schemas/service.json
name: portainer
image: portainer/portainer-ce:2.41.1
digest: 4ac99847049fc6790562517a5cde2aeceb5ebbdf9c1ec5d3e20863399520685d
tier: ops
purpose: Container management UI — 2026-05-11
profiles:
- observability
ports:
# Route traefik to Portainer's HTTP listener (:9000), NOT 9443 — 9443 is HTTPS-ONLY, so
# traefik probing it over HTTP gets 400 "Client sent an HTTP request to an HTTPS server"
# → backend marked DOWN → 502 at portainer.<domain>. Host port 9444 (9000/9001 are taken
# by minio / minio-console). Edge TLS is terminated by traefik.
- 127.0.0.1:9444:9000
volumes:
# Docker socket mounted READ-ONLY (SEC-1, security-live H1). A RW socket is root-equivalent:
# anyone who authenticates to Portainer (or any RCE in it — its CVE history is non-trivial) could
# `docker run -v /:/host --privileged` = root on the host. With `:ro` Portainer degrades to
# READ-ONLY management — it can list/inspect containers, images and stacks but can NOT
# start/stop/exec/create/delete them or mutate the host. That is the conscious tradeoff: full
# container control would require routing Portainer through a scoped docker-socket-proxy (TCP),
# never the raw host socket. Until then, read-only is the safe default.
- /var/run/docker.sock:/var/run/docker.sock:ro
- /var/lib/agmind/portainer:/data
# Holds the (read-only) docker socket — still block in-container privilege escalation via
# setuid/file-caps as defense-in-depth. live-audit 2026-06-05 (portainer-periphery-root-no-priv-guard).
no_new_privileges: true
resources:
  cpus: 1.0
  mem_limit: 512m
  mem_reservation: 128m
access:
  first_login_register: true
  # Portainer locks initial-admin creation ~5 min after the container first starts (security). If you
  # missed the window and see "you cannot create the initial admin user", reopen it by restarting.
  note: "Admin creation locks ~5 min after first start. Locked? sudo docker restart agmind-portainer
    then open portainer.<domain> and create the admin immediately."
routing:
  host: portainer.agmind.dev
  # unauthenticated 200-JSON endpoint on the HTTP listener (/api/status on older builds)
  healthcheck_path: /api/system/status
# NO `health:` block on purpose: portainer-ce:2.41.1 is a SCRATCH image — the only binary is
# /portainer, there is no /bin/sh and no `portainer healthcheck` subcommand (verified 2026-06-09:
# `docker run --entrypoint sh` → "executable file not found"). The readiness endpoint
# (/api/system/status) IS correct, but there is no in-image HTTP client to call it, so any
# wget/curl probe would hit the A6 'executable file not found' class → unhealthy forever → false
# rollback. Portainer therefore stays classified no-probe in
# healthcheck_coverage_check._HEALTHCHECK_EXEMPT; readiness is observed via traefik's own probe.
