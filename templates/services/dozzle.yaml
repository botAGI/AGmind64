# yaml-language-server: $schema=../schemas/service.json
name: dozzle
image: amir20/dozzle:v10.6.1
digest: 4a5e45a15120807294d0a896ec9f89e63d8d43da4e97480fe245454e2b00403e
tier: ops
purpose: Container log viewer — Dozzle v10.6.1 (2026-05-24)
owner: observability-stack
profiles:
- observability
# Dual-homed: default (UI) + internal mgmt-net (its DOCKER_HOST is the docker-socket-proxy).
# live-audit 2026-06-07 (SEC-1).
networks:
- default
- mgmt-net
ports:
- 127.0.0.1:8084:8080
# NO raw /var/run/docker.sock — dozzle reads container logs via the read-only docker-socket-proxy
# (DOCKER_HOST). Validated live: dozzle logged "Connected to Docker" over tcp. No depends_on (a
# cross-profile depends_on hard-raises the --no-tui render); the consume pulls the proxy + dozzle
# retries the connection. live-audit 2026-06-05 docker-sock-raw-mount-blast-radius.
env:
  DOCKER_HOST: tcp://docker-socket-proxy:2375
resources:
  cpus: 0.5
  mem_limit: 512m
health:
  test:
  - CMD
  - /dozzle
  - healthcheck
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 10s
routing:
  host: dozzle.agmind.dev
  middleware_chain: chain-internal
  healthcheck_path: /

# Phase O capabilities — pulls the docker-socket-proxy into the closure (read-only Docker API).
consumes:
- docker_api
