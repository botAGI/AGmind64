# yaml-language-server: $schema=../schemas/service.json
name: alloy
image: grafana/alloy:v1.16.1
digest: 51aeb9d829239345070619dad3edd6873186f913c84f45b365b74574fcb38ec0
tier: ops
purpose: Log shipping (Promtail successor) — 2026-05-05
profiles:
- observability
volumes:
- /etc/agmind/alloy:/etc/alloy:ro
- /var/log:/var/log:ro
- /var/lib/docker/containers:/var/lib/docker/containers:ro
- /var/lib/agmind/alloy:/var/lib/alloy/data
command:
- run
- --server.http.listen-addr=0.0.0.0:12345
- --storage.path=/var/lib/alloy/data
- /etc/alloy/config.alloy
depends_on:
- loki
resources:
  cpus: 1.0
  mem_limit: 512m
