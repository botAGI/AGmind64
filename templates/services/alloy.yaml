# yaml-language-server: $schema=../schemas/service.json
name: alloy
image: grafana/alloy:v1.18.0
digest: 491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
tier: ops
purpose: Log shipping (Promtail successor) — 2026-05-05
profiles:
- observability
# Dual-homed: default (reaches loki + scraped) + internal mgmt-net (its discovery.docker /
# loki.source.docker endpoint is the docker-socket-proxy). live-audit 2026-06-07 (SEC-1).
networks:
- default
- mgmt-net
# NO raw /var/run/docker.sock — alloy's discovery.docker + loki.source.docker reach the Docker
# API through the read-only docker-socket-proxy (validated live: alloy discovered + tailed
# container logs over tcp). live-audit 2026-06-05 docker-sock-raw-mount-blast-radius.
volumes:
- /etc/agmind/alloy:/etc/alloy:ro
- /var/log:/var/log:ro
- /var/lib/docker/containers:/var/lib/docker/containers:ro
- /var/lib/agmind/alloy:/var/lib/alloy/data
command:
- run
# Zero-egress (Карпатый чек-лист п.15, 2026-07-21): Alloy POSTs an anonymous usage
# report — UUID, version, OS, arch and the list of enabled components — to
# https://stats.grafana.org/alloy-usage-report every 4h. `--disable-reporting`
# defaults to FALSE (verified in v1.18.0 `run --help`), so it must be passed
# explicitly. Pre-existing gap: v1.16.1 reported too; closed here with the v1.18.0 bump.
- --disable-reporting
- --server.http.listen-addr=0.0.0.0:12345
- --storage.path=/var/lib/alloy/data
- /etc/alloy/config.alloy
depends_on:
- loki
- docker-socket-proxy
resources:
  cpus: 1.0
  mem_limit: 512m
  mem_reservation: 128m

# Phase O capabilities — pulls the docker-socket-proxy into the closure (read-only Docker API).
consumes:
- docker_api

# Hardening (SEC-2, security-live 2026-06-08): block runtime privilege escalation via
# setuid/file-caps. Safe here — the image either runs a plain server or drops privileges
# via gosu/su-exec (which no-new-privileges does NOT break; it only blocks privilege GAIN).
no_new_privileges: true
