# yaml-language-server: $schema=../schemas/service.json
name: proxmox-exporter
image: prompve/prometheus-pve-exporter:3.9.0
digest: sha256:78a58df7a31c9fbee94962cd06422672668529de6421892df9aed4b6cee0757f
tier: ops
purpose: Proxmox VE metrics exporter for Prometheus
owner: observability-stack
profiles:
  - proxmox
ports:
  - 127.0.0.1:9221:9221
volumes:
  - /etc/agmind/proxmox-exporter/pve.yml:/etc/pve.yml:ro
# prometheus-pve-exporter 3.x uses argparse named flags; the old positional
# (config, port, addr) form is rejected ("unrecognized arguments").
command:
  - --config.file=/etc/pve.yml
  - --web.listen-address=0.0.0.0:9221
resources:
  cpus: 0.5
  mem_limit: 256m
  mem_reservation: 64m
observability:
  prometheus_scrape: true
  metrics_path: /pve
  metrics_port: 9221
  loki_scrape: false

# Hardening (SEC-2, security-live 2026-06-08): block runtime privilege escalation via
# setuid/file-caps. Safe here — the image either runs a plain server or drops privileges
# via gosu/su-exec (which no-new-privileges does NOT break; it only blocks privilege GAIN).
no_new_privileges: true
