# yaml-language-server: $schema=../schemas/service.json
name: elasticsearch
# 8.x line: ragflow's elasticsearch-py client + STACK_VERSION are 8.x; ES 9.x would break it.
image: elasticsearch:8.19.16
digest: 832cb4df76ba2a08f0051742d216a67e3e3a7d8a616082793ed0150a95d3c9fe
tier: storage
purpose: RAGFlow chunk index — 2026-05-12
profiles:
- ragflow
volumes:
- /var/lib/agmind/elasticsearch:/usr/share/elasticsearch/data
run_as_uid: 1000
run_as_gid: 0
writable_mounts:
- /var/lib/agmind/elasticsearch
env:
  discovery.type: single-node
  xpack.security.enabled: 'false'
  ES_JAVA_OPTS: -Xms4g -Xmx4g
resources:
  cpus: 4.0
  mem_limit: 8g
# Without a healthcheck, ragflow's depends_on fell back to service_started and could boot
# before ES was ready (live-audit 2026-06-05 MED). CMD (exec) form so the `&` in the query
# string is part of the URL arg, not a shell operator. curl is present in the 8.x image.
health:
  test:
  - CMD
  - curl
  - -fsS
  - http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=10s
  start_period: 120s
  interval: 15s
  timeout: 10s
  retries: 10

# Phase O capabilities
provides:
- search_index
