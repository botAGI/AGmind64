# yaml-language-server: $schema=../schemas/service.json
name: milvus-minio
image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
digest: cf3dadcfa1fb0324f43958bad1abba986d53c4ecc04d4d50b46c7dcda28bd3cd
tier: storage
purpose: Scoped S3 object store for Milvus standalone (distributed backend) — opt-in rag-milvus
owner: stateful-services
profiles:
- rag-milvus
# Internal-only: reached by milvus over the compose network (milvus-minio:9000); no
# host ports (the ragflow `minio` owns 127.0.0.1:9000/9001). Dedicated data volume so
# Milvus storage is isolated from RAGFlow's. Its OWN root credential (separate trust domain
# from the app `minio`) so leaking one MinIO root does not grant the other.
# live-audit 2026-06-05 shared-minio-root-cred-two-trust-domains.
networks:
# Caged on the internal data-net (only milvus, dual-homed, reaches it). live-audit 2026-06-05.
- data-net
volumes:
- /var/lib/agmind/milvus-minio:/data
command:
- server
- /data
- --console-address
- ":9001"
env:
  MINIO_ROOT_USER: ${MILVUS_MINIO_ROOT_USER:-milvusminio}
  MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_ROOT_PASSWORD:?MILVUS_MINIO_ROOT_PASSWORD is required}
resources:
  cpus: 2.0
  mem_limit: 2g
  mem_reservation: 128m
health:
  test:
  - CMD
  - mc
  - ready
  - local
  interval: 5s
  timeout: 5s
  retries: 5

# Hardening (SEC-2, security-live 2026-06-08): block runtime privilege escalation via
# setuid/file-caps. Safe here — the image either runs a plain server or drops privileges
# via gosu/su-exec (which no-new-privileges does NOT break; it only blocks privilege GAIN).
no_new_privileges: true
