# yaml-language-server: $schema=../schemas/service.json
name: mysql
image: mysql:8.0.46-oraclelinux9
digest: 7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
tier: storage
purpose: RAGFlow metadata (locked to MySQL 8.0.x) — 2026-05-05
profiles:
- ragflow
# Caged on the internal data-net (consumed only by ragflow, dual-homed) — not reachable from a
# compromised app on the shared net. live-audit 2026-06-05 (flat-network).
networks:
- data-net
volumes:
- /var/lib/agmind/mysql:/var/lib/mysql
# Root password as a 0600 file, NOT env (keeps it out of docker inspect / socket-proxy inspect).
# Installer writes secrets/mysql_root_password (= MYSQL_ROOT_PASSWORD that ragflow still uses via
# env). live-audit 2026-06-05 db-secrets-plaintext-docker-inspect.
- /var/lib/agmind/secrets/mysql_root_password:/run/secrets/mysql_root_password:ro
env:
  MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
  MYSQL_DATABASE: rag_flow
resources:
  cpus: 4.0
  mem_limit: 4g
  mem_reservation: 512m
health:
  # Password now lives in a file (MYSQL_ROOT_PASSWORD_FILE), not env — read it via cat.
  test:
  - CMD-SHELL
  - PW="$$(cat /run/secrets/mysql_root_password)"; mysqladmin ping -h 127.0.0.1 -uroot -p"$$PW" --silent && mysql -h 127.0.0.1 -uroot -p"$$PW" -e "SELECT 1" rag_flow
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 60s

# Phase O capabilities
provides:
- mysql_db

# Hardening (SEC-2, security-live 2026-06-08): block runtime privilege escalation via
# setuid/file-caps. Safe here — the image either runs a plain server or drops privileges
# via gosu/su-exec (which no-new-privileges does NOT break; it only blocks privilege GAIN).
no_new_privileges: true
