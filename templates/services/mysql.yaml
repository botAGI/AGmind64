# yaml-language-server: $schema=../schemas/service.json
name: mysql
image: mysql:8.0.46-oraclelinux9
digest: 7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
tier: storage
purpose: RAGFlow metadata (locked to MySQL 8.0.x) — 2026-05-05
profiles:
- ragflow
# Caged on the internal data-net (consumed only by ragflow, dual-homed) — not reachable from a
# compromised app on the shared net. live-audit 2026-06-05 (flat-network).
networks:
- data-net
volumes:
- /var/lib/agmind/mysql:/var/lib/mysql
env:
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
  MYSQL_DATABASE: rag_flow
resources:
  cpus: 4.0
  mem_limit: 4g
health:
  test:
  - CMD-SHELL
  - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent && mysql -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" -e "SELECT 1" rag_flow
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 60s

# Phase O capabilities
provides:
- mysql_db
