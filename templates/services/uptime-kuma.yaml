# yaml-language-server: $schema=../schemas/service.json
name: uptime-kuma
image: louislam/uptime-kuma:2.5.0
digest: a8610b3b4c38077922ba51b036691e06887d7cefd91fe620fd3d6d23d03dc240
tier: ops
purpose: Service uptime and synthetic health dashboard — Uptime Kuma 2.5.0 (2026-08-07)
owner: observability-stack
profiles:
- observability
ports:
- 127.0.0.1:3003:3001
volumes:
- /var/lib/agmind/uptime-kuma:/app/data
resources:
  cpus: 1.0
  mem_limit: 1g
  mem_reservation: 256m
health:
  test:
  - CMD
  - node
  - extra/healthcheck.js
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 40s
routing:
  host: uptime.agmind.dev
  middleware_chain: chain-internal
  healthcheck_path: /

# Hardening (SEC-2, security-live 2026-06-08): block runtime privilege escalation via
# setuid/file-caps. Safe here — the image either runs a plain server or drops privileges
# via gosu/su-exec (which no-new-privileges does NOT break; it only blocks privilege GAIN).
no_new_privileges: true
