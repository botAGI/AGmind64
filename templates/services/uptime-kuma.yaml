# yaml-language-server: $schema=../schemas/service.json
name: uptime-kuma
image: louislam/uptime-kuma:2.3.2
digest: 9aeb4e51d038047f414309c77a1af553281ca535723cb88907d907269d0a908e
tier: ops
purpose: Service uptime and synthetic health dashboard — Uptime Kuma 2.3.2 (2026-05-03)
owner: observability-stack
profiles:
- observability
ports:
- 127.0.0.1:3003:3001
volumes:
- /var/lib/agmind/uptime-kuma:/app/data
resources:
  cpus: 1.0
  mem_limit: 1g
health:
  test:
  - CMD
  - node
  - extra/healthcheck.js
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 40s
routing:
  host: uptime.agmind.dev
  middleware_chain: chain-internal
  healthcheck_path: /
