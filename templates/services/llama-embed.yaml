# yaml-language-server: $schema=../schemas/service.json
name: llama-embed
image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b9049
digest: e359c01203861cf1d802795b8d443ed44660b6ff3f61ba04d7de6ead781c580a
tier: inference
purpose: Embedding inference (bge-m3 default) via llama-server pooling=cls
profiles:
- core
ports:
- 127.0.0.1:8081:8080
volumes:
- /var/lib/agmind/models:/models:ro
env:
  AMD_VULKAN_ICD: RADV
  # radeon_icd.json is the RADV manifest the server-vulkan image actually ships; the
  # radeon_icd.x86_64.json (Debian-multiarch) name is ABSENT here and pinning it disabled
  # the GPU → CPU fallback (live-audit 2026-06-05 HIGH). Verify on each server-vulkan bump.
  VK_DRIVER_FILES: /usr/share/vulkan/icd.d/radeon_icd.json
  # Phase M5.1: embed model + per-service settings (separate from LLM).
  AGMIND_EMBED_FILE: ${AGMIND_EMBED_FILE:-bge-m3-Q8_0.gguf}
  AGMIND_EMBED_CTX_SIZE: ${AGMIND_EMBED_CTX_SIZE:-8192}
  AGMIND_EMBED_KV_CACHE: ${AGMIND_EMBED_KV_CACHE:-f16}
  AGMIND_EMBED_PARALLEL: ${AGMIND_EMBED_PARALLEL:-4}
  # Physical batch. Pooled embedding is non-causal, so llama.cpp must hold the WHOLE sequence in
  # one physical batch — `-ub` is therefore the real max input length, not `--ctx-size`. Left
  # unset it defaults to 512 (verified in server-vulkan-b9049 `--help`), which rejected every
  # input above 512 tokens with HTTP 500 while the service advertised 2048/slot: 26 of 30 corpus
  # documents failed to index in RAGFlow on 2026-08-05 because its chunker emits 545-574 tokens.
  # Matches per-slot context (CTX_SIZE / PARALLEL). Cost on Strix Halo, measured: 587 MiB GTT at
  # 512 → 1406 MiB at 2048 (8192 would be 5044 MiB, hence not the default).
  AGMIND_EMBED_BATCH: ${AGMIND_EMBED_BATCH:-2048}
command:
- --host
- 0.0.0.0
- --port
- '8080'
# Enable the Prometheus /metrics endpoint (404 without it) so prometheus_scrape works.
- --metrics
- --model
- /models/${AGMIND_EMBED_FILE:-bge-m3-Q8_0.gguf}
- --embeddings
- --pooling
- cls
- -ngl
- '999'
- --ctx-size
- ${AGMIND_EMBED_CTX_SIZE:-8192}
- --cache-type-k
- ${AGMIND_EMBED_KV_CACHE:-f16}
- --cache-type-v
- ${AGMIND_EMBED_KV_CACHE:-f16}
- --parallel
- ${AGMIND_EMBED_PARALLEL:-4}
# -b (logical) must be >= -ub (physical); llama.cpp's own default -b is 2048.
- -b
- ${AGMIND_EMBED_BATCH:-2048}
- -ub
- ${AGMIND_EMBED_BATCH:-2048}
devices:
- /dev/dri
group_add:
- video
- render
resources:
  cpus: 4.0
  mem_limit: 8g
  mem_reservation: 2g
health:
  test:
  - CMD
  - curl
  - -f
  - http://localhost:8080/health
  start_period: 600s
  interval: 15s
  retries: 5
access:
  api_kind: openai
routing:
  host: embed.agmind.dev
  middleware_chain: chain-llm
observability:
  prometheus_scrape: true

# Phase O capabilities
provides:
- embedding_inference

# Hardening (SEC-2, security-live 2026-06-08): block runtime privilege escalation via
# setuid/file-caps. Safe here — the image either runs a plain server or drops privileges
# via gosu/su-exec (which no-new-privileges does NOT break; it only blocks privilege GAIN).
no_new_privileges: true
