# yaml-language-server: $schema=../schemas/service.json
name: llama-embed
image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b9049
tier: inference
purpose: Embedding inference (bge-m3 default) via llama-server pooling=cls
profiles:
- core
ports:
- 127.0.0.1:8081:8080
volumes:
- /var/lib/agmind/models:/models:ro
env:
  AMD_VULKAN_ICD: RADV
  VK_DRIVER_FILES: /usr/share/vulkan/icd.d/radeon_icd.x86_64.json
  # Phase M5.1: embed model + per-service settings (separate from LLM).
  AGMIND_EMBED_FILE: ${AGMIND_EMBED_FILE:-bge-m3-Q8_0.gguf}
  AGMIND_EMBED_CTX_SIZE: ${AGMIND_EMBED_CTX_SIZE:-8192}
  AGMIND_EMBED_KV_CACHE: ${AGMIND_EMBED_KV_CACHE:-f16}
  AGMIND_EMBED_PARALLEL: ${AGMIND_EMBED_PARALLEL:-4}
command:
- --host
- 0.0.0.0
- --port
- '8080'
- --model
- /models/${AGMIND_EMBED_FILE}
- --embeddings
- --pooling
- cls
- -ngl
- '999'
- --ctx-size
- ${AGMIND_EMBED_CTX_SIZE}
- --cache-type-k
- ${AGMIND_EMBED_KV_CACHE}
- --cache-type-v
- ${AGMIND_EMBED_KV_CACHE}
- --parallel
- ${AGMIND_EMBED_PARALLEL}
devices:
- /dev/dri
group_add:
- video
- render
resources:
  cpus: 4.0
  mem_limit: 8g
routing:
  host: embed.agmind.dev
  middleware_chain: chain-llm
observability:
  prometheus_scrape: true

# Phase O capabilities
provides:
- embedding_inference
