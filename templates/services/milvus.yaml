# yaml-language-server: $schema=../schemas/service.json
name: milvus
image: milvusdb/milvus:v2.6.17
digest: 37ce939f2afdb6df217c33765c8468c963e42ac76433bf5a6be073d63d78caab
tier: storage
purpose: Billion-scale vector store (opt-in profile) — 2026-05-16
profiles:
- rag-milvus
ports:
- 127.0.0.1:19530:19530
volumes:
- /var/lib/agmind/milvus:/var/lib/milvus
# Standalone Milvus has NO default CMD — the image entrypoint is `/tini --`, so without
# this it gets no program and prints tini usage then exits. `milvus run standalone`
# starts the server against the external etcd + scoped minio (distributed backend).
command:
- milvus
- run
- standalone
env:
  ETCD_ENDPOINTS: etcd:2379
  MINIO_ADDRESS: milvus-minio:9000
  # milvus-minio has its OWN root credential (separate trust domain from the app minio).
  MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ROOT_USER:-milvusminio}
  MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_ROOT_PASSWORD:?MILVUS_MINIO_ROOT_PASSWORD is required}
  MINIO_USE_SSL: 'false'
  MINIO_BUCKET_NAME: milvus
  # Milvus v2.6 storage-V2 arrow-filesystem accepts only [local, remote, opendal];
  # the legacy "minio" token is removed and panics at boot ("Unsupported storage
  # type: minio"). MinIO stays the backend via MINIO_ADDRESS; the TYPE is "remote".
  COMMON_STORAGETYPE: remote
depends_on:
- etcd
- milvus-minio
# Upstream milvus standalone compose ships this; jemalloc/Knowhere issue syscalls
# Docker's default seccomp profile can restrict (intermittent crashes without it).
security_opt:
- seccomp:unconfined
# Milvus serves /healthz on the internal 9091 metrics port (verified live 200). A real probe
# lets dependents wait on service_healthy instead of service_started. curl is present in the
# image. live-audit 2026-06-05 (milvus-no-healthcheck).
health:
  test:
  - CMD
  - curl
  - -fsS
  - http://localhost:9091/healthz
  start_period: 90s
  interval: 15s
  timeout: 10s
  retries: 10
resources:
  cpus: 8.0
  mem_limit: 16g

# Phase O capabilities
provides:
- vector_db
