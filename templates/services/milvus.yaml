# yaml-language-server: $schema=../schemas/service.json
name: milvus
image: milvusdb/milvus:v2.6.17
digest: 37ce939f2afdb6df217c33765c8468c963e42ac76433bf5a6be073d63d78caab
tier: storage
purpose: Billion-scale vector store (opt-in profile) — 2026-05-16
profiles:
- rag-milvus
ports:
- 127.0.0.1:19530:19530
volumes:
- /var/lib/agmind/milvus:/var/lib/milvus
# Standalone Milvus has NO default CMD — the image entrypoint is `/tini --`, so without
# this it gets no program and prints tini usage then exits. `milvus run standalone`
# starts the server against the external etcd + scoped minio (distributed backend).
command:
- milvus
- run
- standalone
env:
  ETCD_ENDPOINTS: etcd:2379
  MINIO_ADDRESS: milvus-minio:9000
  MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  MINIO_USE_SSL: 'false'
  MINIO_BUCKET_NAME: milvus
  COMMON_STORAGETYPE: minio
depends_on:
- etcd
- milvus-minio
resources:
  cpus: 8.0
  mem_limit: 16g

# Phase O capabilities
provides:
- vector_db
