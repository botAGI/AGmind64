# yaml-language-server: $schema=../schemas/service.json
name: prometheus
image: prom/prometheus:v3.5.3
digest: ddc2493835a1509976d5e4e0c94199c4f843ce1f42dd6bcfc8231ba734a93ff7
tier: ops
purpose: Metrics collection — Prometheus 3.x (PromQL v2→v3 breaking — R12)
profiles:
- observability
ports:
- 127.0.0.1:9090:9090
volumes:
- /etc/agmind/prometheus:/etc/prometheus:ro
- /var/lib/agmind/prometheus:/prometheus
run_as_uid: 65534
# run_as_gid defaults to run_as_uid (65534)
writable_mounts:
- /var/lib/agmind/prometheus
# NB: no hard depends_on the docker-socket-proxy — docker_sd reconnects every 15s once the
# proxy is up, and a hard depends_on would break isolated prometheus renders. Instead we co-pull
# it via the docker_api capability below (resolve_service_selection adds the provider), so an
# EXPLICIT-services selection deploys the proxy too — not only the observability profile.
resources:
  cpus: 2.0
  mem_limit: 2g
observability:
  prometheus_scrape: true
# docker_sd_configs discovers targets over tcp://docker-socket-proxy:2375; consuming docker_api
# makes selecting prometheus co-pull docker-socket-proxy into the closure (live-audit 2026-06-05
# grafana-empty: the proxy was profile-only, so an explicit-services install left it out -> 0
# targets). (prometheus, docker_api) is whitelisted in KNOWN_CROSS_PROFILE_CONSUMES so a raw
# per-service render does not fail-closed when the proxy is not literally co-listed.
consumes:
- docker_api
