# yaml-language-server: $schema=../schemas/service.json
name: ragflow
image: infiniflow/ragflow:v0.25.5
digest: 1025603bd79a373ab0f65e8ee3730710a1bccfb2ba88fd443d57078ebbf24724
tier: app
purpose: RAGFlow deep parsing — coexists с Dify (см. marketplace.dify.ai/plugin/witmeng/ragflow-api)
profiles:
- ragflow
# Dual-homed: default (traefik edge + host-published 9380) AND the internal data-net where its
# caged backends mysql + elasticsearch live. live-audit 2026-06-05 (flat-network).
networks:
- default
- data-net
ports:
- 127.0.0.1:9380:9380
env:
  DEVICE: cpu
  MINERU_BACKEND: vlm-http-client
  # VLM_ENDPOINT is injected by the llm_inference capability binding ONLY when llama-llm is in
  # the rendered set. Do NOT hardcode it — with model_id=skip there is no llama-llm and a static
  # endpoint dangles at a dead DNS name (live-audit 2026-06-05 HIGH dangling-llama-llm).
  MYSQL_HOST: mysql
  MYSQL_PORT: '3306'
  MYSQL_USER: root
  MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
  MYSQL_DBNAME: rag_flow
  MINIO_HOST: minio
  MINIO_PORT: '9000'
  MINIO_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  MINIO_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  # Elasticsearch now requires basic auth (xpack.security on). RAGFlow's service_conf reads
  # ES_USER (default 'elastic') + ELASTIC_PASSWORD. live-audit 2026-06-05 elasticsearch-xpack-disabled.
  ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
depends_on:
- mysql
- elasticsearch
- minio
- redis
resources:
  cpus: 8.0
  mem_limit: 16g
access:
  first_login_register: true
routing:
  host: rag.agmind.dev
  middleware_chain: chain-llm
  sse: true
  # RAGFlow serves its web UI from nginx on container port 80 and its API (hypercorn) on
  # 9380. We publish only 9380 (for the Dify ragflow-api plugin), so without this override
  # the edge router targets 9380 and every browser path 404s ("Not Found: /"). Route the
  # edge to the nginx UI on 80; nginx proxies /api/v1/system/healthz -> 200 so the active
  # healthcheck below still works. live-audit 2026-06-05 HIGH ragflow-edge-route-wrong-port.
  port: 80
  # RAGFlow v0.25.5 serves health at /api/v1/system/healthz (not the /health default);
  # the default probe 404s -> traefik drops the backend from routing (502 at the edge).
  healthcheck_path: /api/v1/system/healthz

# Phase O capabilities (revised — see ADR-0011 amendment)
# RAGFlow's vector store options per verified ragflow/docker/.env (2026-05-20):
#   DOC_ENGINE ∈ {elasticsearch, infinity, oceanbase, opensearch, seekdb}
# RAGFlow does NOT support milvus/qdrant/weaviate as DOC_ENGINE — these
# are Dify-only options. Therefore ragflow consumes:
#   • llm_inference (через VLM_ENDPOINT → llama-llm)
#   • embedding_inference (через EMBEDDING_ENDPOINT → llama-embed)
#   • search_index (ES / opensearch / infinity)
# RAGFlow provides `dify_external_kb` — Dify может подключиться к RAGFlow
# через witmeng/ragflow-api plugin (RAGFLOW_API_ENDPOINT=http://ragflow:9380).
provides:
- rag_stack
- dify_external_kb
consumes:
- llm_inference
- embedding_inference
- reranker
- search_index

# Hardening (live-audit 2026-06-05): block privilege escalation via setuid/file-caps.
no_new_privileges: true
