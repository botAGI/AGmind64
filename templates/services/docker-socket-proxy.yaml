# yaml-language-server: $schema=../schemas/service.json
name: docker-socket-proxy
# Verified live 2026-06-05: amd64/linux. Read-only Docker-API gateway (haproxy) so
# prometheus docker_sd can discover scrape targets WITHOUT mounting the raw root socket
# (live-audit HIGH: prometheus had no docker.sock → 0 targets → empty Grafana; and the raw
# socket is root-equivalent host control). Only the GET endpoints docker_sd needs are allowed.
image: tecnativa/docker-socket-proxy:0.3.0
digest: 9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
tier: ops
purpose: Read-only Docker API gateway for prometheus/traefik/cadvisor/alloy
# Must be present wherever a consumer is: core/full (traefik docker provider) + observability
# (prometheus docker_sd, cadvisor, alloy). The --no-tui `--profile` render includes profile
# members only (consume-pull is TUI/explicit-services-path only), so the proxy is profile-listed
# alongside its consumers rather than relying on closure-pull. live-audit 2026-06-05.
profiles:
- core
- full
- observability
# Caged on the internal mgmt-net ONLY — a compromised internet-facing app on the shared net can no
# longer reach docker-socket-proxy:2375 (which exposes every container's env via CONTAINERS=1).
# Only its dual-homed docker_api consumers reach it. live-audit 2026-06-07 (SEC-1).
networks:
- mgmt-net
volumes:
- /var/run/docker.sock:/var/run/docker.sock:ro
env:
  # Read endpoints the consumers need: prometheus docker_sd (CONTAINERS/NETWORKS/INFO),
  # traefik docker provider (CONTAINERS + EVENTS watch + VERSION), cadvisor + alloy (CONTAINERS).
  # All GET-only; throwaway-validated 2026-06-05 that cadvisor/traefik/alloy work with this set.
  CONTAINERS: '1'
  NETWORKS: '1'
  INFO: '1'
  VERSION: '1'
  EVENTS: '1'
  # Everything dangerous stays denied (defaults are 0; declared for intent + regression guard).
  POST: '0'
  EXEC: '0'
  CONTAINERS_CREATE: '0'
  IMAGES: '0'
  VOLUMES: '0'
  SECRETS: '0'
  SERVICES: '0'
no_new_privileges: true
resources:
  cpus: 0.25
  mem_limit: 128m
  mem_reservation: 64m

# Capability: prometheus consumes docker_api so selecting prometheus pulls this proxy into the
# closure (otherwise it is observability-profile-only and an explicit-services selection deploys
# prometheus without it -> 0 docker targets -> empty Grafana). live-audit 2026-06-05.
provides:
- docker_api
