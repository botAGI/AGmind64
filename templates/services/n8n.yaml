# yaml-language-server: $schema=../schemas/service.json
name: n8n
image: n8nio/n8n:2.32.6
digest: 5f7856f4fc7cd935230f7596e39fdb3d5eda0e379c5b40b699b9c0eb35ebd0bf
tier: app
purpose: Local workflow automation for agent and integration flows — n8n 2.32.6 (2026-07-30)
owner: automation-stack
profiles:
- automation
# NO host port — access ONLY via traefik (n8n.agmind.dev) behind Authelia. A 127.0.0.1 loopback
# port let any host-local process reach the unclaimed owner-setup before the operator
# (live-audit 2026-06-05 n8n-owner-unclaimed-loopback). traefik routes over the network; the
# healthcheck uses the container-internal port — nothing needs the host publish.
volumes:
- /var/lib/agmind/n8n:/home/node/.n8n
run_as_uid: 1000
# run_as_gid defaults to run_as_uid (1000)
writable_mounts:
- /var/lib/agmind/n8n
env:
  GENERIC_TIMEZONE: ${N8N_TIMEZONE:-UTC}
  N8N_DIAGNOSTICS_ENABLED: 'false'
  N8N_EDITOR_BASE_URL: https://n8n.agmind.dev/
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
  N8N_HIRING_BANNER_ENABLED: 'false'
  N8N_HOST: n8n.agmind.dev
  N8N_LISTEN_ADDRESS: 0.0.0.0
  N8N_METRICS: 'true'
  N8N_METRICS_INCLUDE_DEFAULT_METRICS: 'true'
  N8N_METRICS_PREFIX: n8n_
  N8N_PORT: '5678'
  N8N_PROTOCOL: https
  N8N_RUNNERS_ENABLED: 'true'
  N8N_SECURE_COOKIE: 'true'
  N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
  WEBHOOK_URL: https://n8n.agmind.dev/
resources:
  cpus: 2.0
  mem_limit: 2g
  mem_reservation: 512m
health:
  test:
  - CMD-SHELL
  - node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 40s
access:
  first_login_register: true
routing:
  host: n8n.agmind.dev
  middleware_chain: chain-internal
  healthcheck_path: /healthz
observability:
  prometheus_scrape: true
  metrics_path: /metrics
  metrics_port: 5678
provides:
- workflow_automation

# Hardening (live-audit 2026-06-05): block privilege escalation via setuid/file-caps.
no_new_privileges: true
