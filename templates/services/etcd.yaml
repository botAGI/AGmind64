# yaml-language-server: $schema=../schemas/service.json
name: etcd
image: quay.io/coreos/etcd:v3.5.18
digest: d0a641d5fbcc89678c931a61b7de7b8a1cf097149f135c9c73bc81d076a1494b
tier: storage
purpose: Metadata store for Milvus standalone (distributed backend) — opt-in rag-milvus
owner: stateful-services
profiles:
- rag-milvus
# Internal-only: reached by milvus over the compose network (etcd:2379); no host ports.
volumes:
- /var/lib/agmind/etcd:/etcd
command:
- etcd
- -advertise-client-urls=http://etcd:2379
- -listen-client-urls=http://0.0.0.0:2379
- --data-dir=/etcd
env:
  ETCD_AUTO_COMPACTION_MODE: revision
  ETCD_AUTO_COMPACTION_RETENTION: '1000'
  ETCD_QUOTA_BACKEND_BYTES: '4294967296'
  ETCD_SNAPSHOT_COUNT: '50000'
resources:
  cpus: 1.0
  mem_limit: 1g
health:
  test:
  - CMD
  - etcdctl
  - endpoint
  - health
  interval: 30s
  timeout: 20s
  retries: 3
