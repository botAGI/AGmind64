# yaml-language-server: $schema=../schemas/service.json
name: homarr
image: ghcr.io/homarr-labs/homarr:v1.62.0
digest: fc96436bf80000bed8989d6606fc1ac0929bf4809bb4594168ad4b327e8f2c5f
tier: ops
purpose: Homelab application portal and service dashboard — Homarr v1.62.0 (2026-05-22)
owner: observability-stack
profiles:
- observability
ports:
- 127.0.0.1:7575:7575
# NO raw /var/run/docker.sock — homarr boots fine without it (validated live: clean start, no
# errors). The optional "docker" dashboard widget is UI-configured; point it at the read-only
# docker-socket-proxy (docker-socket-proxy:2375, present alongside in the observability profile)
# instead of the raw root socket if needed. live-audit 2026-06-05 docker-sock-raw-mount-blast-radius.
volumes:
- /var/lib/agmind/homarr/appdata:/appdata
env:
  SECRET_ENCRYPTION_KEY: ${HOMARR_SECRET_ENCRYPTION_KEY:?HOMARR_SECRET_ENCRYPTION_KEY is required}
resources:
  cpus: 1.0
  mem_limit: 1g
access:
  first_login_register: true
routing:
  host: homarr.agmind.dev
  middleware_chain: chain-internal
  healthcheck_path: /
