# yaml-language-server: $schema=../schemas/service.json
name: redis-exporter
image: oliver006/redis_exporter:v1.83.0
digest: e8c209894d4c0cc55b1259ddd47e0b769ad1ff864b356736ee885462a3b0e48c
tier: ops
purpose: Redis metrics для Prometheus
profiles:
- observability
env:
  REDIS_ADDR: redis://redis:6379
  # B1: redis runs with --requirepass; oliver006/redis_exporter reads REDIS_PASSWORD
  # separately from REDIS_ADDR (confirmed per exporter README §3e of B1 research).
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
resources:
  cpus: 0.5
  mem_limit: 256m
observability:
  prometheus_scrape: true
