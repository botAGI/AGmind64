# yaml-language-server: $schema=../schemas/service.json
name: node-exporter
image: prom/node-exporter:v1.11.1
digest: e9cff4fc67b1818f8c97adb115b9f12c9a54b533de86765d4a0effc01b357205
tier: ops
purpose: Host metrics (CPU/disk/memory/network)
profiles:
- observability
# Read the host textfile dir where scripts/ops/amdgpu_textfile.sh writes amdgpu.prom
# (AMD Strix Halo gfx1151 has no working upstream Prometheus exporter — see that script).
# Without this flag + mount the GPU metrics are generated on the host but never scraped.
command:
- --collector.textfile.directory=/var/lib/node_exporter/textfile
volumes:
- /:/host:ro,rslave
- /var/lib/node_exporter/textfile:/var/lib/node_exporter/textfile:ro
resources:
  cpus: 0.5
  mem_limit: 256m
observability:
  prometheus_scrape: true
