# yaml-language-server: $schema=../schemas/service.json
name: dify-worker
image: langgenius/dify-api:1.14.2
digest: 062815df8ed6fcf82285e55f3cb5586241b2828e6695a3fb8114bfb99b5e8517
tier: app
purpose: Dify celery worker
profiles:
- rag
# Tri-homed: default + data-net (its caged postgres/redis/qdrant/milvus backends) + ssrf-net so
# the worker (which runs advanced-chat/workflow generation, incl. Code nodes) can reach the caged
# dify-sandbox at http://dify-sandbox:8194. live-audit 2026-06-05 (flat-network). K-2b.
# 2026-06-10: ssrf-net added — code-exec to sandbox was unroutable from the worker.
networks:
- default
- data-net
- ssrf-net
volumes:
# B6: dify-worker uses the same storage path as dify-api (same image, uid 1001).
# bootstrap already pre-creates /var/lib/agmind/dify/storage at uid 1001.
- /var/lib/agmind/dify/storage:/app/api/storage
run_as_uid: 1001
# run_as_gid defaults to run_as_uid (1001)
writable_mounts:
- /var/lib/agmind/dify/storage
env:
  MODE: worker
  LOG_LEVEL: INFO
  # Mirror dify-api: raise doc upload cap 15 MB → 100 MB (default UPLOAD_FILE_SIZE_LIMIT is 15).
  # Dify ships this via a shared .env across api+worker; keep parity. 2026-06-30.
  UPLOAD_FILE_SIZE_LIMIT: '100'
  # Cage user-controlled HTTP/MCP fetches through the ssrf-proxy (NOT provider/DB calls — see
  # dify-api). live-audit 2026-06-05 dify-api-worker-egress-unproxied.
  SSRF_PROXY_HTTP_URL: http://ssrf-proxy:3128
  SSRF_PROXY_HTTPS_URL: http://ssrf-proxy:3128
  DB_HOST: postgres
  # B6: dify-worker needs full DB creds (mirrors dify-api; same postgres DB).
  DB_PORT: '5432'
  DB_USERNAME: dify
  DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  DB_DATABASE: dify
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  # B1: redis runs with --requirepass; worker reads REDIS_PASSWORD for direct redis ops.
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  # B1+B6: Celery does NOT read REDIS_PASSWORD — it reads only CELERY_BROKER_URL.
  # The URL must embed the credential with empty-username prefix (`:` before password).
  # Matches dify upstream shared.env.example: redis://:difyai123456@redis:6379/1
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
  # The worker runs advanced-chat/workflow generation (dispatched via the broker above), so it
  # needs the SAME plugin-daemon handshake as dify-api to resolve models / invoke the LLM node.
  # Without these the worker hits "Failed to request plugin daemon" (ConnectError) and the
  # chatflow never produces a reply. Keys MUST match dify-api. 2026-06-10.
  PLUGIN_DAEMON_KEY: ${DIFY_PLUGIN_DAEMON_KEY:-changeme-plugin-daemon-key}
  PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
  INNER_API_KEY_FOR_PLUGIN: ${DIFY_PLUGIN_INNER_API_KEY:-changeme-inner-api-key}
  # Workflow Code node → dify-sandbox (caged on ssrf-net; worker joins ssrf-net above). Key MUST
  # match the sandbox's API_KEY. 2026-06-10.
  CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
  CODE_EXECUTION_API_KEY: ${DIFY_SANDBOX_API_KEY:-dify-sandbox}
depends_on:
- postgres
- redis
resources:
  cpus: 4.0
  mem_limit: 4g
  mem_reservation: 512m

# Phase O capabilities
consumes:
- llm_inference
- embedding_inference
- vector_db

# Hardening (live-audit 2026-06-05): block privilege escalation via setuid/file-caps.
no_new_privileges: true
