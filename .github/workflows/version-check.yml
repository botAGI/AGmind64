# Phase P: daily upstream version check.
#
# Scans templates/services/*.yaml + docker/Dockerfile.* pins,
# probes upstream registries (Docker Hub, GHCR, GitHub Releases),
# pads HOLD annotations from templates/version_holds.yaml,
# и создаёт/обновляет GitHub issue с тегом 'upstream-update'.
#
# Aligned with legacy AGmind workflow (https://github.com/botAGI/AGmind/issues/63).

name: Upstream Version Check

on:
  schedule:
    # Каждый день 06:00 UTC = 09:00 МСК
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print to job log only, do NOT create/update issue"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install uv (fresh — ubuntu-latest has no pre-provisioned uv)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install PyYAML with runner-local uv
        run: |
          "$HOME/.local/bin/uv" --version
          "$HOME/.local/bin/uv" venv --python python3 .venv
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python -c constraints/dev.txt pyyaml

      - name: Run version check
        id: check
        run: |
          .venv/bin/python scripts/checks/version_check.py --output report.md --json report.json
          echo "report_path=report.md" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Upload report artefact
        uses: actions/upload-artifact@v7
        with:
          name: component-version-report
          path: |
            report.md
            report.json
          retention-days: 90

      - name: Update or create GitHub issue
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Upstream version report ($(date -u +%Y-%m-%d))"
          BODY="$(cat report.md)"

          # Найти existing open issue с label upstream-update
          EXISTING_ISSUE=$(gh issue list --label upstream-update --state open --limit 1 \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Updating existing issue #$EXISTING_ISSUE"
            gh issue edit "$EXISTING_ISSUE" --title "$TITLE" --body "$BODY"
          else
            echo "Creating new issue"
            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label upstream-update
          fi
