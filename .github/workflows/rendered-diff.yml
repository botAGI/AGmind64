name: rendered-diff

# SPEC-16.1: informational PR gate. Renders every compose profile from the PR
# BASE tree and the PR HEAD tree (each with its own editable venv, so a
# descriptor/renderer change renders through), then posts a single sticky PR
# comment with the semantic diff. NEVER fails the PR — every effectful step is
# guarded with continue-on-error. Uses `pull_request` (not `_target`): a comment
# on a same-repo PR needs no secrets, and fork PRs (read-only token) simply skip
# the comment instead of erroring.

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout head tree
        uses: actions/checkout@v6
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout base tree
        uses: actions/checkout@v6
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Install uv (fresh — ubuntu-latest has no pre-provisioned uv)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Render head profiles
        continue-on-error: true
        working-directory: head
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -c constraints/dev.txt -e ".[dev]"
          .venv/bin/python scripts/checks/rendered_diff.py render --out "$GITHUB_WORKSPACE/head_out"
      - name: Render base profiles
        continue-on-error: true
        working-directory: base
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -c constraints/dev.txt -e ".[dev]"
          # The base ref may predate this script; render the BASE tree with HEAD's
          # copy of the script (its own base venv still imports the base renderer).
          cp "$GITHUB_WORKSPACE/head/scripts/checks/rendered_diff.py" scripts/checks/rendered_diff.py
          .venv/bin/python scripts/checks/rendered_diff.py render --out "$GITHUB_WORKSPACE/base_out"
      - name: Compute rendered diff (markdown)
        continue-on-error: true
        working-directory: head
        run: |
          .venv/bin/python scripts/checks/rendered_diff.py diff \
            --base "$GITHUB_WORKSPACE/base_out" \
            --head "$GITHUB_WORKSPACE/head_out" \
            > "$GITHUB_WORKSPACE/rendered-diff.md"
          echo "--- rendered-diff report ---"
          cat "$GITHUB_WORKSPACE/rendered-diff.md"
      - name: Post/update sticky PR comment
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ github.workspace }}/rendered-diff.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- rendered-diff -->';
            let report;
            try {
              report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            } catch (e) {
              report = '_rendered-diff report unavailable (render step failed)._';
            }
            let body = marker + '\n' + report;
            // GitHub caps a comment at 65536 chars — keep a safe margin.
            if (body.length > 60000) {
              body = body.slice(0, 60000) + '\n\n… (report truncated)';
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
