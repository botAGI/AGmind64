# LIVE operator gate — token-throughput regression check (SPEC-16.4).
#
# NOT hermetic and NOT part of the PR gate: this job needs the self-hosted Strix Halo
# GPU runner AND a running llama-llm (the OpenAI-compatible endpoint it load-tests),
# plus the `k6` binary installed on that runner. It runs `agmind loadtest chat`, lifts
# tokens_per_second from the k6 summary, and FAILS the job when generation throughput
# drops below 90% of the frozen catalog baseline (templates/models.yaml measured_tg_t_s
# of the default LLM — a single source of truth, read via agmind.loadtest.perf_gate).
# Fires nightly on a cron and on demand via workflow_dispatch.
name: perf-nightly

on:
  schedule:
    # Nightly ~04:17 UTC — off-peak, and an odd minute avoids top-of-hour scheduler pileups.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      endpoint:
        description: OpenAI-compatible chat-completions URL of the live llama-llm.
        default: http://127.0.0.1:8080/v1/chat/completions
      vus:
        description: Concurrent virtual users (constant load).
        default: "4"
      duration:
        description: Load duration (e.g. 30s / 2m).
        default: "60s"

permissions:
  contents: read

# One live perf run at a time — never cancel an in-flight measurement (a half-run
# would report bogus throughput).
concurrency:
  group: perf-nightly
  cancel-in-progress: false

jobs:
  token-throughput-gate:
    runs-on: [self-hosted, linux, x64, strix-halo]
    # Fork-PR guard (defense-in-depth): this job runs verbatim repo code on the production
    # Strix Halo box that holds every secret and the docker group. Today the triggers are only
    # schedule/workflow_dispatch, so a fork PR cannot reach it — the guard is here so that
    # ADDING `pull_request` to `on:` later cannot silently expose the runner. Same three-clause
    # allow-list as ci.yml test-strix-halo and chaos-regression.yml chaos-probe.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install uv (fresh — no dependency on a pre-provisioned runner)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install agmind + dev deps
        run: |
          "$HOME/.local/bin/uv" venv --python python3 .venv
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python -c constraints/dev.txt -e ".[dev]"
      - name: Resolve default LLM id from the model catalog
        id: model
        run: |
          model=$(.venv/bin/python -c "from agmind.models import load_model_catalog_defaults; print(load_model_catalog_defaults()['llm'])")
          echo "id=$model" >> "$GITHUB_OUTPUT"
      - name: Run k6 chat load test against the live llama-llm, then gate on baseline
        env:
          # workflow_dispatch inputs are null on scheduled runs → fall back to the defaults.
          ENDPOINT: ${{ github.event.inputs.endpoint || 'http://127.0.0.1:8080/v1/chat/completions' }}
          VUS: ${{ github.event.inputs.vus || '4' }}
          DURATION: ${{ github.event.inputs.duration || '60s' }}
        run: |
          set -o pipefail
          .venv/bin/agmind loadtest chat \
            --model "${{ steps.model.outputs.id }}" \
            --endpoint "$ENDPOINT" \
            --vus "$VUS" \
            --duration "$DURATION" \
            --json \
            | tee loadtest-summary.json \
            | .venv/bin/python -m agmind.loadtest.perf_gate
