name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-flight runs for same PR/branch (save Actions minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---- Static checks via pre-commit hooks (single gate для всего consistency) ----
  pre-commit:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv (Phase L.A — для editable install)
        run: pip install uv
      - name: Install agmind + dev deps
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - uses: pre-commit/action@v3.0.1

  # ---- Forbidden-pattern audit ----
  audit:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run forbidden-pattern audit
        run: python3 scripts/audit_forbidden.py --fail --json audit-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json

  # ---- Schema validation (Phase H'.B) — отдельная job для visibility ----
  schema-validate:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install check-jsonschema
        run: pip install check-jsonschema
      - name: Validate all service descriptors
        run: |
          check-jsonschema \
            --schemafile templates/schemas/service.json \
            templates/services/*.yaml

  # ---- Python lint + type + test (CPU backend on Linux runner) ----
  test-cpu:
    runs-on: [self-hosted, linux, x64]
    needs: [audit, schema-validate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: pip install uv
      - name: Install agmind + cpu + dev
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[cpu,dev]"
      - name: Lint (ruff)
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Type check (mypy)
        run: .venv/bin/mypy agmind/
      - name: Tests + coverage
        run: |
          .venv/bin/pytest -q \
            --cov=agmind --cov-branch \
            --cov-report=xml --cov-report=term \
            -m "backend_any or backend_cpu"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-cpu
          path: coverage.xml

  # ---- Docker matrix build ----
  docker-build:
    runs-on: [self-hosted, linux, x64]
    needs: [audit]
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan, rocm]
    steps:
      - uses: actions/checkout@v4

      - name: Build base image
        run: docker build -f docker/Dockerfile.base -t agmind-base:ci .

      - name: Build ${{ matrix.backend }} image
        run: |
          docker build \
            -f docker/Dockerfile.${{ matrix.backend }} \
            --build-arg BASE_IMAGE=agmind-base:ci \
            -t agmind-${{ matrix.backend }}:ci \
            .

  # ---- Compose validation (Phase L.A) ----
  compose-validate:
    runs-on: [self-hosted, linux, x64]
    needs: [schema-validate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install agmind
        run: |
          pip install uv
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Render compose для разных profiles
        run: |
          for profile in core "core,rag" "core,observability" full; do
            echo "=== Rendering --profile $profile ==="
            .venv/bin/agmind render compose --profile "$profile" --domain ci.example.com \
              --output /tmp/compose-$profile.yml
          done
      - name: Validate rendered compose через docker compose config
        run: |
          for f in /tmp/compose-*.yml; do
            echo "=== Validating $f ==="
            docker compose -f "$f" config --quiet
          done

  # ---- Real Strix Halo hardware (self-hosted runner — same machine) ----
  # M5-followup: since все jobs теперь на self-hosted, этот тоже бежит на
  # каждом push/PR (но fork PRs пропускаются — security: чужой код не должен
  # запускаться на твоей машине без approval).
  test-strix-halo:
    runs-on: [self-hosted, linux, x64, strix-halo]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [audit, test-cpu]
    strategy:
      fail-fast: false
      matrix:
        backend: [vulkan, rocm]
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke benchmark on ${{ matrix.backend }}
        env:
          AGMIND_BACKEND: ${{ matrix.backend }}
        run: |
          docker run --rm \
            --device /dev/dri \
            $( [ "${{ matrix.backend }}" = "rocm" ] && echo "--device /dev/kfd --group-add video --group-add render --security-opt seccomp=unconfined --cap-add=SYS_PTRACE --ipc=host --shm-size=16G" ) \
            -e AGMIND_BACKEND \
            agmind-${{ matrix.backend }}:ci \
            pytest -q -m "backend_${{ matrix.backend }} or backend_any"
