name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-flight runs for the same ref to save Actions minutes and avoid
# pileups on the single self-hosted runner. NEVER cancel on `main` (promotion
# runs must complete), but cancel superseded PR and develop/feature-branch runs —
# the old `== 'pull_request'` guard let develop pushes serialize and stall behind
# a stuck queued run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---- Static checks via pre-commit hooks (single gate для всего consistency) ----
  pre-commit:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v6
      - name: Install agmind + dev deps
        run: |
          "$HOME/.local/bin/uv" --version
          "$HOME/.local/bin/uv" venv --python python3 .venv
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python -c constraints/dev.txt -e ".[dev]"
      - name: Run pre-commit
        run: .venv/bin/pre-commit run --all-files --show-diff-on-failure

  # ---- Public deterministic lane (GitHub-hosted; runs on fork PRs too) ----
  # The self-hosted jobs are the hardware/integration gates and are fork-guarded (fork code
  # must never touch the box that holds the secrets + docker group). THIS lane is the
  # reproducible quality gate that depends on NO self-hosted runner and NO pre-installed
  # $HOME/.local/bin/uv — uv is installed fresh — and (unlike the guarded lanes) runs on fork
  # PRs, so external contributions actually get CI. Mirrors the local fresh-venv gate.
  public-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv (fresh — no dependency on a pre-provisioned runner)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Create venv + install agmind[dev] (declared deps only)
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -c constraints/dev.txt -e ".[dev]"
      - name: Ruff lint + format check
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Mypy (strict)
        run: .venv/bin/mypy agmind/
      - name: Schema + governance gates
        run: |
          .venv/bin/python scripts/checks/component_check.py
          .venv/bin/python scripts/checks/topology_check.py
          .venv/bin/python scripts/checks/healthcheck_coverage_check.py
          .venv/bin/python scripts/checks/governance_check.py
          .venv/bin/python scripts/checks/audit_forbidden.py
      - name: Unit tests (no integration tier)
        run: .venv/bin/python -m pytest -q -m "(backend_any or backend_cpu) and not integration"
      - name: Packaging build (wheel + sdist)
        run: uv build
      - name: Assert wheel bundles templates/ansible/docs (package-data regression guard)
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl | head -1)
          .venv/bin/python - "$wheel" <<'PY'
          import sys, zipfile
          names = set(zipfile.ZipFile(sys.argv[1]).namelist())
          required = [
              "agmind/templates/services/llama-llm.yaml",
              "agmind/ansible/install.yml",
              "agmind/docs/TROUBLESHOOTING.md",
          ]
          missing = [p for p in required if p not in names]
          if missing:
              print("::error::built wheel is missing package-data:", missing)
              sys.exit(1)
          print("wheel bundles templates/ansible/docs OK")
          PY

  # ---- Forbidden-pattern audit ----
  audit:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v6
      - name: Run forbidden-pattern audit
        run: python3 scripts/checks/audit_forbidden.py --fail --json audit-report.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-report
          path: audit-report.json

  # ---- Schema validation (Phase H'.B) — отдельная job для visibility ----
  schema-validate:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v6
      - name: Validate all service descriptors
        run: |
          "$HOME/.local/bin/uvx" check-jsonschema \
            --schemafile templates/schemas/service.json \
            templates/services/*.yaml
          "$HOME/.local/bin/uvx" check-jsonschema \
            --schemafile templates/schemas/component.json \
            templates/components/*.yaml
          "$HOME/.local/bin/uvx" check-jsonschema \
            --schemafile templates/schemas/deploy-target.json \
            templates/deploy-targets/*.yaml
          "$HOME/.local/bin/uvx" check-jsonschema \
            --schemafile templates/schemas/tool-candidate.json \
            templates/tool-candidates/*.yaml

  # ---- Component contract/conflict validation (M7.A) ----
  component-validate:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [schema-validate]
    steps:
      - uses: actions/checkout@v6
      - name: Install agmind
        run: |
          "$HOME/.local/bin/uv" --version
          "$HOME/.local/bin/uv" venv --python python3 .venv
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python -c constraints/dev.txt -e ".[dev]"
      - name: Validate component contracts
        run: .venv/bin/python scripts/checks/component_check.py

  # ---- Deployment target validation (M7.B) ----
  deploy-target-validate:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [schema-validate]
    steps:
      - uses: actions/checkout@v6
      - name: Install agmind
        run: |
          "$HOME/.local/bin/uv" --version
          "$HOME/.local/bin/uv" venv --python python3 .venv
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python -c constraints/dev.txt -e ".[dev]"
      - name: Validate deployment targets
        run: .venv/bin/python scripts/checks/deploy_target_check.py

  # ---- Optional tool candidate validation (M7.C) ----
  tool-candidate-validate:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [schema-validate]
    steps:
      - uses: actions/checkout@v6
      - name: Install agmind
        run: |
          "$HOME/.local/bin/uv" --version
          "$HOME/.local/bin/uv" venv --python python3 .venv
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python -c constraints/dev.txt -e ".[dev]"
      - name: Validate optional tool candidates
        run: .venv/bin/python scripts/checks/tool_candidate_check.py

  # ---- Dependency constraint validation (M7.A) ----
  constraints-validate:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v6
      - name: Validate dependency constraint planes
        run: python3 scripts/checks/constraints_check.py

  # ---- Documentation mirror validation ----
  docs-mirror-validate:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v6
      - name: Validate README language mirrors
        run: python3 scripts/checks/docs_mirror_check.py

  # ---- Service topology validation (M7.C) ----
  topology-validate:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [schema-validate]
    steps:
      - uses: actions/checkout@v6
      - name: Install agmind
        run: |
          "$HOME/.local/bin/uv" --version
          "$HOME/.local/bin/uv" venv --python python3 .venv
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python -c constraints/dev.txt -e ".[dev]"
      - name: Validate service topology lanes
        run: .venv/bin/python scripts/checks/topology_check.py

  # ---- A6: healthcheck tool-in-image gate ----
  healthcheck-tool-validate:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [schema-validate]
    steps:
      - uses: actions/checkout@v6
      - name: Install agmind
        run: |
          "$HOME/.local/bin/uv" --version
          "$HOME/.local/bin/uv" venv --python python3 .venv
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python -c constraints/dev.txt -e ".[dev]"
      - name: A6 — healthcheck tools present in image (offline curated maps)
        run: .venv/bin/python scripts/checks/healthcheck_tool_check.py
      - name: A7 — healthcheck coverage (probe or classified exemption)
        run: .venv/bin/python scripts/checks/healthcheck_coverage_check.py

  # ---- Kubernetes renderer validation (M7.D) ----
  kubernetes-render-validate:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [schema-validate, deploy-target-validate]
    steps:
      - uses: actions/checkout@v6
      - name: Install agmind
        run: |
          "$HOME/.local/bin/uv" --version
          "$HOME/.local/bin/uv" venv --python python3 .venv
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python -c constraints/dev.txt -e ".[dev]"
      - name: Validate Kubernetes research target rendering
        run: .venv/bin/python scripts/checks/kubernetes_render_check.py

  # ---- Kubernetes proof workflow validation (M7.D) ----
  kubernetes-proof-workflow-validate:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [deploy-target-validate]
    steps:
      - uses: actions/checkout@v6
      - name: Install agmind
        run: |
          "$HOME/.local/bin/uv" --version
          "$HOME/.local/bin/uv" venv --python python3 .venv
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python -c constraints/dev.txt -e ".[dev]"
      - name: Validate Kubernetes proof workflow contract
        run: .venv/bin/python scripts/checks/kubernetes_proof_workflow_check.py

  # ---- Aggregate governance summary (M7) ----
  governance-validate:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [docs-mirror-validate, component-validate, deploy-target-validate, tool-candidate-validate, constraints-validate, topology-validate, healthcheck-tool-validate, kubernetes-render-validate, kubernetes-proof-workflow-validate]
    steps:
      - uses: actions/checkout@v6
      - name: Install agmind
        run: |
          "$HOME/.local/bin/uv" --version
          "$HOME/.local/bin/uv" venv --python python3 .venv
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python -c constraints/dev.txt -e ".[dev]"
      - name: Run aggregate governance report
        run: .venv/bin/python scripts/checks/governance_check.py

  # ---- Python lint + type + test (CPU backend on Linux runner) ----
  test-cpu:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [audit, schema-validate, component-validate, deploy-target-validate, tool-candidate-validate, constraints-validate, topology-validate, healthcheck-tool-validate, kubernetes-render-validate]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install agmind + dev
        run: |
          "$HOME/.local/bin/uv" --version
          "$HOME/.local/bin/uv" venv --python python3 .venv
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python -c constraints/dev.txt -e ".[dev]"
      - name: Lint (ruff)
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Type check (mypy)
        run: .venv/bin/mypy agmind/
      - name: Tests + coverage
        run: |
          .venv/bin/pytest -q \
            --cov=agmind --cov-branch \
            --cov-report=xml --cov-report=term \
            -m "backend_any or backend_cpu"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-cpu
          path: coverage.xml

  # ---- Docker matrix build ----
  # Build the base image once; the backend matrix reuses the daemon-local tag
  # (single self-hosted runner) instead of rebuilding it three times.
  docker-build-base:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [audit, constraints-validate]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build base image
        run: docker build -f docker/Dockerfile.base -t agmind-base:ci .

  docker-build:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [audit, constraints-validate, docker-build-base]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan, rocm]
    steps:
      - uses: actions/checkout@v6

      - name: Build ${{ matrix.backend }} image
        run: |
          docker build \
            -f docker/Dockerfile.${{ matrix.backend }} \
            --build-arg BASE_IMAGE=agmind-base:ci \
            -t agmind-${{ matrix.backend }}:ci \
            .

  # ---- Compose validation (Phase L.A) ----
  compose-validate:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [schema-validate, component-validate, deploy-target-validate, tool-candidate-validate, constraints-validate]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install agmind
        run: |
          "$HOME/.local/bin/uv" --version
          "$HOME/.local/bin/uv" venv --python python3 .venv
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python -c constraints/dev.txt -e ".[dev]"
      - name: Render + validate compose for all profiles (all_profile_names)
        run: |
          cat > /tmp/agmind-compose-ci.env <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password
          GRAFANA_PASSWORD=ci-grafana-password
          MYSQL_ROOT_PASSWORD=ci-mysql-root-password
          MINIO_ROOT_USER=ci-minio
          MINIO_ROOT_PASSWORD=ci-minio-password
          REDIS_PASSWORD=ci-redis-password
          ELASTIC_PASSWORD=ci-elastic-password
          MILVUS_MINIO_ROOT_PASSWORD=ci-milvus-minio-password
          HOMARR_SECRET_ENCRYPTION_KEY=ci-homarr-secret-encryption-key
          N8N_ENCRYPTION_KEY=ci-n8n-encryption-key
          AUTHELIA_SESSION_SECRET=ci-authelia-session-secret-0000000000000000000000000000
          AUTHELIA_STORAGE_ENCRYPTION_KEY=ci-authelia-storage-encryption-key-00000000000000000
          AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=ci-authelia-jwt-secret-00000000000000000000000000000000
          AGENT_DB_PASSWORD=ci-agent-db-password
          EOF
          for profile in $(.venv/bin/python -c "from agmind.services.profile_sets import all_profile_names; print('\n'.join(sorted(all_profile_names())))"); do
            echo "=== Rendering --profile $profile ==="
            .venv/bin/agmind render compose --profile "$profile" --domain ci.example.com \
              --output "/tmp/compose-${profile}.yml"
            echo "=== Validating $profile ==="
            docker compose --env-file /tmp/agmind-compose-ci.env \
              -f "/tmp/compose-${profile}.yml" config --quiet
          done

  # ---- Real-compose smoke lane (H.3) ----
  # Renders the NON-GPU subset and runs docker compose up --wait to assert every
  # container reaches healthy, then down -v always.  Catches perms/command/config/
  # group_add crash-loops that 17 config-only jobs cannot detect.
  # Isolation: the test rewrites fixed deploy fields (container_name, host ports,
  # network name, /var/lib/agmind bind mounts) before using -p agmind-ci, so it
  # does not collide with or write into the live GPU stack on the self-hosted runner.
  # Fork-guarded: same pattern as test-strix-halo — fork PRs are skipped.
  compose-up-smoke:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [docker-build, compose-validate]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install agmind + dev
        run: |
          "$HOME/.local/bin/uv" --version
          "$HOME/.local/bin/uv" venv --python python3 .venv
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python -c constraints/dev.txt -e ".[dev]"
      - name: Write CI env file
        run: |
          cat > /tmp/agmind-compose-ci.env <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password
          GRAFANA_PASSWORD=ci-grafana-password
          MYSQL_ROOT_PASSWORD=ci-mysql-root-password
          MINIO_ROOT_USER=ci-minio
          MINIO_ROOT_PASSWORD=ci-minio-password
          REDIS_PASSWORD=ci-redis-password
          ELASTIC_PASSWORD=ci-elastic-password
          MILVUS_MINIO_ROOT_PASSWORD=ci-milvus-minio-password
          HOMARR_SECRET_ENCRYPTION_KEY=ci-homarr-secret-encryption-key
          N8N_ENCRYPTION_KEY=ci-n8n-encryption-key
          AUTHELIA_SESSION_SECRET=ci-authelia-session-secret-0000000000000000000000000000
          AUTHELIA_STORAGE_ENCRYPTION_KEY=ci-authelia-storage-encryption-key-00000000000000000
          AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=ci-authelia-jwt-secret-00000000000000000000000000000000
          AGENT_DB_PASSWORD=ci-agent-db-password
          EOF
      - name: Run compose-up-smoke integration tests
        env:
          AGMIND_CI: "1"
        run: |
          .venv/bin/python -m pytest -q \
            -m integration \
            tests/integration/test_compose_up_smoke.py \
            --tb=short
      - name: Teardown (belt-and-suspenders)
        if: always()
        run: |
          # Belt-and-suspenders: the test's finally block already calls down -v,
          # but we also tear down here in case the test process was killed mid-run.
          docker compose -p agmind-ci down -v --remove-orphans 2>/dev/null || true

  # ---- Clean-machine bootstrap lane (Lane A — CLEAN-INSTALL-HARDENING.md §3) ----
  # Builds a bare ubuntu:24.04 image (docker/Dockerfile.ubuntu-test) that has
  # ansible-core + python3-venv but DELIBERATELY NOT the `virtualenv` pip pkg,
  # then runs the agmind_python role TWICE in a fresh container — including a
  # corruption-injection variant + a direct pip-module probe — so the two ansible
  # clean-machine bugs that reached the operator serially (missing
  # virtualenv_command; pip-reinstall-corrupts-venv on re-run) FAIL CI, not the
  # operator. (The model 0-MiB transient is the steps.py side, guarded by Lane D.)
  # Needs Docker; fork-guarded with the same `if:` as compose-up-smoke (fork code
  # must never run on the box that holds the secrets + docker group).
  clean-machine-bootstrap:
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [schema-validate]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install agmind + dev
        run: |
          "$HOME/.local/bin/uv" --version
          "$HOME/.local/bin/uv" venv --python python3 .venv
          "$HOME/.local/bin/uv" pip install --python .venv/bin/python -c constraints/dev.txt -e ".[dev]"
      - name: Run clean-machine bootstrap integration test
        run: |
          .venv/bin/python -m pytest -q \
            -m integration \
            tests/install/test_clean_machine_bootstrap.py \
            --tb=short
      - name: Teardown test image (belt-and-suspenders)
        if: always()
        run: docker image rm agmind-ubuntu-test:ci 2>/dev/null || true

  # ---- Real Strix Halo hardware (self-hosted runner — same machine) ----
  # M5-followup: since все jobs теперь на self-hosted, этот тоже бежит на
  # каждом push/PR (но fork PRs пропускаются — security: чужой код не должен
  # запускаться на твоей машине без approval).
  # Keep this after docker-build so the smoke checks fresh backend images for
  # the current commit, not stale tags left on the self-hosted runner.
  test-strix-halo:
    runs-on: [self-hosted, linux, x64, strix-halo]
    timeout-minutes: 40
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    # Build the image IN this job rather than depending on docker-build: with multiple self-hosted
    # runners the docker-build image lands on a different machine than this strix-halo runner, so
    # `docker run agmind-<backend>:ci` fails with "pull access denied" (the image isn't local).
    # Building here makes the GPU smoke self-contained + deterministic. Layer cache keeps it fast.
    needs: [audit, test-cpu]
    strategy:
      fail-fast: false
      matrix:
        backend: [vulkan, rocm]
    steps:
      - uses: actions/checkout@v6
      - name: Build base + ${{ matrix.backend }} image (self-contained on this runner)
        run: |
          docker build -f docker/Dockerfile.base -t agmind-base:ci .
          docker build \
            -f docker/Dockerfile.${{ matrix.backend }} \
            --build-arg BASE_IMAGE=agmind-base:ci \
            -t agmind-${{ matrix.backend }}:ci \
            .
      - name: Run backend smoke on ${{ matrix.backend }}
        env:
          AGMIND_BACKEND: ${{ matrix.backend }}
        run: |
          docker run --rm \
            --device /dev/dri \
            $( [ "${{ matrix.backend }}" = "rocm" ] && echo "--device /dev/kfd --group-add video --group-add render --security-opt seccomp=unconfined --cap-add=SYS_PTRACE --ipc=host --shm-size=16G" ) \
            -e AGMIND_BACKEND \
            --entrypoint python3 \
            agmind-${{ matrix.backend }}:ci \
            -c "import os; from agmind.compute import get_backend; b = get_backend(); di = b.device_info(); assert di.backend == os.environ['AGMIND_BACKEND'], di; print(di)"
