name: release-drafter

# Phase L.A: автоматически draft'ит release notes из merged PR в main.
# Use conventional commits prefixes (feat/fix/chore/refactor/etc) для grouping.

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
