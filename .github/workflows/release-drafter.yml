name: release-drafter

# Phase L.A: автоматически draft'ит release notes из merged PR в main.
# Use conventional commits prefixes (feat/fix/chore/refactor/etc) для grouping.

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    # Fork-PR guard: pull_request_target runs with the base-repo token and
    # contents/pull-requests write scope. Only run on push to main or on PRs
    # from the same repository, never on untrusted fork PRs.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # GitHub-API-only job: keep it off the single-lane self-hosted runner so it
    # never blocks the critical CI/test/deploy queue (backlog M6.B.5).
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (review LOW ci-actions-mutable-tag-pins): this job runs on
      # pull_request_target with contents+pull-requests write — a force-moved tag would inject
      # code into a token-bearing job. Dependabot (github-actions) bumps the pin via the # v7.
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
