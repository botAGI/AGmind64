repos:
  - repo: local
    hooks:
      - id: agmind-audit-forbidden
        name: AGmind — запрет на non-x86 / CUDA хардкоды
        entry: python3 scripts/audit_forbidden.py --fail
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]

  # Phase H'.B: валидация service descriptors против Pydantic-generated JSON Schema.
  # См. ADR-0005, templates/schemas/service.json (regenerate: scripts/export_schemas.py).
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.30.0
    hooks:
      - id: check-jsonschema
        name: Validate templates/services/*.yaml against ServiceDescriptor schema
        files: ^templates/services/.*\.yaml$
        args:
          - --schemafile
          - templates/schemas/service.json
