# Phase L.A: pre-commit hooks (CI gate parity).
# Run: `pre-commit install` (one-time) + `pre-commit run --all-files`
# CI runs `pre-commit run --all-files` в .github/workflows/ci.yml job `pre-commit`.

repos:
  # ---- AGmind audit (project-specific, forbids legacy patterns) ----
  - repo: local
    hooks:
      - id: agmind-audit-forbidden
        name: AGmind audit (forbid CUDA/non-x86 hardcodes)  # audit: allow rule-self-reference
        entry: python3 scripts/audit_forbidden.py --fail
        language: system
        pass_filenames: false
        always_run: true

  # ---- Python: ruff (lint + format) ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ---- Python: mypy strict (Phase L.A) ----
  # Local hook потому что mypy mirror отстаёт; используем pinned version из dev deps.
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (agmind/)
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && .venv/bin/mypy agmind/ --no-error-summary 2>&1 | head -20'
        language: system
        pass_filenames: false
        files: ^agmind/.*\.py$

  # ---- Generic file hygiene ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Service descriptors имеют свой schema check ниже, не общий
        exclude: ^templates/services/.*\.yaml$
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key   # Phase L.A: предотвращает commit RSA/DSA/EC/OpenSSH keys

  # ---- Service descriptors: JSON Schema validation (Phase H'.B) ----
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.30.0
    hooks:
      - id: check-jsonschema
        name: Validate templates/services/*.yaml against ServiceDescriptor
        files: ^templates/services/.*\.yaml$
        args:
          - --schemafile
          - templates/schemas/service.json

  # ---- Secrets scanning (Phase L.A) ----
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.0
    hooks:
      - id: gitleaks
        name: Scan for secrets (gitleaks)

  # ---- Dockerfile linting (Phase L.A) ----
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.0-beta
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles (hadolint)
        files: ^docker/Dockerfile\.
        args: [--failure-threshold, error]

  # ---- Shell script linting (Phase L.A) ----
  # Pure-shell check для нашего minimum bash (scripts/amdgpu_textfile.sh + container entrypoints).
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        name: shellcheck (bash scripts)
        files: \.sh$

  # ---- Ansible linting (Phase L.A) ----
  - repo: https://github.com/ansible/ansible-lint
    rev: v25.9.2
    hooks:
      - id: ansible-lint
        name: ansible-lint (playbooks + roles)
        files: ^ansible/.*\.(ya?ml)$
        # ansible-lint v25 default = python3.13 (не везде есть). Pin к 3.12 — на 3.10+ работает.
        language_version: python3.12
        # Skip некоторых rule что не релевантны (jinja whitespace, no-changed-when для idempotent tasks)
        args:
          - --offline
          # M5 followup: skip violations в legacy ansible/ — full cleanup deferred в M6.
          # See https://ansible.readthedocs.io/projects/lint/rules/ для каждого rule.
          - --skip-list=yaml,jinja[spacing],var-naming,name[casing],no-changed-when,partial-become,risky-shell-pipe,command-instead-of-shell

  # ---- Conventional commits enforcement (Phase L.A) ----
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - feat
          - fix
          - chore
          - docs
          - refactor
          - test
          - perf
          - style
          - ci
          - build
          - revert
