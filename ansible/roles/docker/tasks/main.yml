---
# Docker install + daemon config.

- name: Check Docker installed
  ansible.builtin.command: docker --version
  register: docker_version
  failed_when: false
  changed_when: false
  check_mode: false

- name: Check Docker Compose plugin installed
  ansible.builtin.command: docker compose version --short
  register: docker_compose_version
  failed_when: false
  changed_when: false
  check_mode: false

- name: Parse Docker Compose plugin version
  ansible.builtin.set_fact:
    docker_compose_detected_version: >-
      {{
        docker_compose_version.stdout
        | regex_search('[0-9]+(\\.[0-9]+){1,2}')
        | default('0.0.0', true)
      }}

- name: Ensure Docker apt keyring dir exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repo
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Remove conflicting distro Docker packages before official Engine install
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - podman-docker
      - containerd
      - runc
    state: absent
  when: >
    docker_version.rc != 0 or
    docker_compose_version.rc != 0 or
    docker_compose_detected_version is version('2.24.0', '<')

- name: Install Docker packages (official Engine + Compose plugin)
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  when: >
    docker_version.rc != 0 or
    docker_compose_version.rc != 0 or
    docker_compose_detected_version is version('2.24.0', '<')

- name: Re-check Docker Compose plugin version
  ansible.builtin.command: docker compose version --short
  register: docker_compose_final_version_cmd
  failed_when: false
  changed_when: false
  check_mode: false

- name: Parse final Docker Compose plugin version
  ansible.builtin.set_fact:
    docker_compose_final_version: >-
      {{
        docker_compose_final_version_cmd.stdout
        | regex_search('[0-9]+(\\.[0-9]+){1,2}')
        | default('0.0.0', true)
      }}

- name: Assert Docker Compose plugin version is supported
  ansible.builtin.assert:
    that:
      - docker_compose_final_version is version('2.24.0', '>=')
    fail_msg: >-
      Docker Compose plugin must be >= 2.24.0 for AGmind/Dify.
      Detected {{ docker_compose_final_version | default('missing') }}.
      Install or upgrade docker-compose-plugin from the official Docker apt repository.
    success_msg: "Docker Compose plugin {{ docker_compose_final_version }} is supported"

- name: Configure docker daemon.json
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "data-root": "{{ agmind_docker.data_root }}",
        "default-runtime": "{{ agmind_docker.default_runtime }}",
        "default-shm-size": "{{ agmind_docker.shm_size }}",
        "storage-driver": "overlay2",
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "100m",
          "max-file": "3"
        },
        "dns": ["1.1.1.1", "8.8.8.8"]
      }
    mode: "0644"
  notify: restart docker

- name: Enable & start docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Verify Docker can access AMD GPU
  ansible.builtin.command:
    cmd: docker run --rm --device=/dev/dri ubuntu:24.04 ls /dev/dri
  register: docker_dri
  changed_when: false
  failed_when: false
  check_mode: false

- name: Warn if Docker can't see /dev/dri
  ansible.builtin.debug:
    msg: |
      Docker can't see /dev/dri в контейнере. Это может означать:
      1. amdgpu module не загружен
      2. /dev/dri имеет неправильные permissions
      3. docker daemon отсутствует rootful access
      Try: sudo modprobe amdgpu && sudo usermod -aG render,video $USER
  when: docker_dri.rc != 0
