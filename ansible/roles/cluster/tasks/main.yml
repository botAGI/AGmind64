---
# Cluster setup — выполняется только на agmind_master.
# Discovery workers через Ansible inventory, opening firewall к ним.

- name: Build worker endpoints list
  ansible.builtin.set_fact:
    agmind_worker_endpoints: >-
      {{
        groups['agmind_workers']
        | default([])
        | map('extract', hostvars)
        | selectattr('agmind_worker_endpoint', 'defined')
        | map(attribute='agmind_worker_endpoint')
        | list
      }}

- name: Display discovered workers
  ansible.builtin.debug:
    msg: |
      Cluster workers discovered: {{ agmind_worker_endpoints | length }}
      Endpoints: {{ agmind_worker_endpoints }}

- name: Render cluster.yaml config
  ansible.builtin.template:
    src: cluster.yaml.j2
    dest: "{{ agmind_config_dir }}/cluster.yaml"
    owner: "{{ agmind_user }}"
    group: "{{ agmind_group }}"
    mode: "0644"

# No firewall rule here: in the coordinator topology the MASTER is the CLIENT that reaches
# OUT to the workers' 8080-8082 (outgoing is already allowed), so opening the master's INBOUND
# to those ports from worker IPs was wrong-direction and a no-op (review MEDIUM
# cluster-firewall-wrong-direction). The inbound allow belongs on the WORKERS. Re-add it as a
# worker-side rule together with the other two coupled changes (LAN-reachable worker llama bind
# + running the `services` role on workers) when the routing layer is actually wired.
