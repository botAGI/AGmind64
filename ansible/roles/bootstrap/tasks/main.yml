---
# Bootstrap host: apt packages, user/groups, base directories.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - jq
      - git
      - ca-certificates
      - software-properties-common
      - python3
      - python3-pip
      - python3-venv
      - python3-yaml
      - apt-transport-https
      - gnupg
      - lsb-release
      - net-tools
      - lsof
      - pciutils
    state: present

- name: Install Vulkan tooling (per R2/R3)
  ansible.builtin.apt:
    name:
      - mesa-vulkan-drivers
      - libvulkan1
      - vulkan-tools
      - libglvnd0
      - libgl1
      - libegl1
      - libegl-mesa0
    state: present

- name: Install ROCm tooling (опционально, если включён ROCm backend)
  ansible.builtin.debug:
    msg: |
      ROCm install требует amdgpu-install — этот шаг скриптуется в
      ansible/roles/rocm/ (будет добавлен в M2). Сейчас пропускается.
      Если нужен ROCm backend сейчас — установить вручную:
        wget https://repo.radeon.com/amdgpu-install/...
        sudo apt install ./amdgpu-install_*.deb
        sudo amdgpu-install --usecase=rocm,hiplibsdk --no-dkms
      См. docs/HARDWARE.md § ROCm install.

# On a CLEAN host none of docker/render/video exist yet (docker creates `docker`
# in its own role AFTER bootstrap; render/video come from the GPU stack). `useradd -G
# <missing-group>` exits rc=6 and creates NO user, and the old blanket `failed_when: false`
# swallowed that — so "Create AGmind directories" then aborted with "user agmind does not
# exist". Pre-create the groups (idempotent; docker's postinst reuses an existing group) so
# the user task can succeed AND surface a real failure instead of being silently ignored.
- name: Ensure docker/render/video groups exist (clean host pre-create)
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop:
    - docker
    - render
    - video

- name: Create agmind user
  ansible.builtin.user:
    name: "{{ agmind_user }}"
    system: true
    home: "{{ agmind_install_dir }}"
    shell: /usr/sbin/nologin
    groups:
      - docker
      - render
      - video
    state: present

- name: Add primary host user to render+video groups
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups:
      - render
      - video
    append: true
  when: ansible_user_id is defined and ansible_user_id != "root"

- name: Create AGmind directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ agmind_user }}"
    group: "{{ agmind_group }}"
    mode: "0755"
  loop:
    - "{{ agmind_install_dir }}"
    - "{{ agmind_data_dir }}"
    - "{{ agmind_config_dir }}"
    - "{{ agmind_data_dir }}/models"
    - "{{ agmind_data_dir }}/qdrant"
    - "{{ agmind_data_dir }}/postgres"
    - "{{ agmind_config_dir }}/prometheus"
    - "{{ agmind_config_dir }}/grafana"
    - "{{ agmind_config_dir }}/loki"
    - "{{ agmind_config_dir }}/alloy"

- name: Pre-create non-root service data dirs owned by their container UIDs
  # A missing bind-mount host dir is auto-created root:root 0755 by the Docker daemon,
  # which the image's non-root user cannot write to (crash loop). Pre-create each with
  # the numeric uid/gid the image runs as. NOT the agmind user — these uids differ and
  # only the matching uid can write. (milvus runs as root, so it needs no entry here.)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0755"
  loop:
    - { path: "{{ agmind_data_dir }}/prometheus", owner: "65534", group: "65534" }
    - { path: "{{ agmind_data_dir }}/alertmanager", owner: "65534", group: "65534" }
    - { path: "{{ agmind_data_dir }}/grafana", owner: "472", group: "472" }
    - { path: "{{ agmind_data_dir }}/loki", owner: "10001", group: "10001" }
    - { path: "{{ agmind_data_dir }}/n8n", owner: "1000", group: "1000" }
    - { path: "{{ agmind_data_dir }}/elasticsearch", owner: "1000", group: "0" }
    - { path: "{{ agmind_data_dir }}/dify/storage", owner: "1001", group: "1001" }
    - { path: "{{ agmind_data_dir }}/docling-cache", owner: "1001", group: "1001" }
    # redis:alpine runs as uid 999 and writes dump.rdb to the MOUNT ROOT (/data). Its
    # `redis-server --requirepass` command + non-root start means the image does NOT
    # self-chown /data, so the dir MUST be pre-owned by 999 — otherwise bgsave fails with
    # "Permission denied", redis enters MISCONF (writes disabled) and Authelia (whose
    # session store is redis) crash-loops → the whole SSO login goes down. (Was previously
    # in the agmind-chown loop above → 997-owned → exactly this failure.)
    - { path: "{{ agmind_data_dir }}/redis", owner: "999", group: "1000" }

- name: Set restrictive perms on agmind config dir
  ansible.builtin.file:
    path: "{{ agmind_config_dir }}"
    state: directory
    mode: "0750"

- name: Configure sysctl for ML workloads (per R10)
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-agmind.conf
    reload: true
  loop:
    - { name: "vm.swappiness", value: "10" }
    - { name: "vm.overcommit_memory", value: "1" }
    - { name: "vm.max_map_count", value: "1048576" }
