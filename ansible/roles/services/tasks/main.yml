---
# Render docker-compose.yml через `agmind render compose` (Phase H'.C, ADR-0006).
# Заменён прежний Jinja2 шаблон typed-Python рендерером на ServiceDescriptor catalog.

# ---- Secret materialization (Phase H'.E follow-up) ----
- name: Ensure AGmind secrets directory exists
  ansible.builtin.file:
    path: /var/lib/agmind/secrets
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Save Cloudflare API token to secret file
  ansible.builtin.copy:
    content: "{{ agmind_cf_api_token }}"
    dest: /var/lib/agmind/secrets/cf_dns_api_token
    owner: root
    group: docker
    mode: "0640"  # readable by docker daemon для secret mount
  when: agmind_cf_api_token is defined and agmind_cf_api_token | length > 0
  no_log: true   # ВАЖНО: токен НЕ должен попасть в Ansible stdout / logs

- name: Validate Proxmox exporter token settings
  ansible.builtin.assert:
    that:
      - agmind_proxmox_exporter_user | default('') | length > 0
      - agmind_proxmox_exporter_token_name | default('') | length > 0
      - agmind_proxmox_exporter_token_value | default('') | length > 0
    fail_msg: >-
      proxmox profile requires agmind_proxmox_exporter_user,
      agmind_proxmox_exporter_token_name, and
      agmind_proxmox_exporter_token_value, or set
      agmind_proxmox_exporter_existing_config=true after provisioning
      {{ agmind_config_dir }}/proxmox-exporter/pve.yml yourself.
  when:
    - "'proxmox' in agmind_profiles"
    - not (agmind_proxmox_exporter_existing_config | default(false) | bool)
  no_log: true

- name: Ensure Proxmox exporter config directory exists
  ansible.builtin.file:
    path: "{{ agmind_config_dir }}/proxmox-exporter"
    state: directory
    owner: root
    group: "{{ agmind_group }}"
    mode: "0750"
  when:
    - "'proxmox' in agmind_profiles"

- name: Check existing Proxmox exporter config
  ansible.builtin.stat:
    path: "{{ agmind_config_dir }}/proxmox-exporter/pve.yml"
  register: agmind_proxmox_exporter_existing_config_stat
  when:
    - "'proxmox' in agmind_profiles"
    - agmind_proxmox_exporter_existing_config | default(false) | bool

- name: Validate existing Proxmox exporter config file
  ansible.builtin.assert:
    that:
      - agmind_proxmox_exporter_existing_config_stat.stat.exists
      - not agmind_proxmox_exporter_existing_config_stat.stat.isdir
    fail_msg: >-
      agmind_proxmox_exporter_existing_config=true requires an existing file at
      {{ agmind_config_dir }}/proxmox-exporter/pve.yml before compose up.
  when:
    - "'proxmox' in agmind_profiles"
    - agmind_proxmox_exporter_existing_config | default(false) | bool

- name: Render Proxmox exporter token config
  ansible.builtin.template:
    src: proxmox-pve.yml.j2
    dest: "{{ agmind_config_dir }}/proxmox-exporter/pve.yml"
    owner: root
    group: "{{ agmind_group }}"
    # File is bind-mounted directly into the container (pve.yml:/etc/pve.yml:ro);
    # the prometheus-pve-exporter image runs as non-root uid 101, which is "other"
    # for this file. 0640 -> PermissionError crash at boot. 0644 lets uid 101 read
    # it; confidentiality is preserved by the 0750 parent dir gating host access.
    mode: "0644"
  when:
    - "'proxmox' in agmind_profiles"
    - not (agmind_proxmox_exporter_existing_config | default(false) | bool)
  no_log: true

- name: Validate Proxmox exporter config
  ansible.builtin.command:
    cmd: >-
      {{ agmind_venv }}/bin/python -m agmind.deploy.proxmox_exporter
      --config {{ agmind_config_dir }}/proxmox-exporter/pve.yml
  changed_when: false
  when:
    - "'proxmox' in agmind_profiles"

- name: Ensure templates/services exists в install dir
  ansible.builtin.file:
    path: "{{ agmind_install_dir }}/templates/services"
    state: directory
    owner: "{{ agmind_user }}"
    group: "{{ agmind_group }}"
    mode: "0755"

- name: Sync service descriptors (templates/services/*.yaml)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../templates/services/"
    dest: "{{ agmind_install_dir }}/templates/services/"
    owner: "{{ agmind_user }}"
    group: "{{ agmind_group }}"
    mode: "0644"
  notify: recreate compose

- name: Sync service JSON Schema (templates/schemas/service.json)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../templates/schemas/service.json"
    dest: "{{ agmind_install_dir }}/templates/schemas/service.json"
    mode: "0644"

- name: Sync Traefik dynamic config (middlewares + transport)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../templates/traefik/dynamic/"
    dest: "/var/lib/agmind/traefik/dynamic/"
    mode: "0644"
  when: agmind_proxy | default('traefik') == 'traefik'
  notify: recreate compose

# G.4 (M6.G): content-diff-driven render. Render to a temp output with
# changed_when: false, then a content-based copy into place owns the real change
# signal — so a repeat run with no compose change does NOT force-recreate the stack.
- name: Render docker-compose.yml через agmind render compose (temp output)
  ansible.builtin.command:
    cmd: >-
      {{ agmind_venv }}/bin/agmind render compose
      --profile {{ agmind_profiles | join(',') }}
      --domain {{ agmind_domain }}
      --output {{ agmind_install_dir }}/docker-compose.yml.new
  args:
    chdir: "{{ agmind_install_dir }}"
  changed_when: false

- name: Activate rendered docker-compose.yml (content-diff drives recreate)
  ansible.builtin.copy:
    src: "{{ agmind_install_dir }}/docker-compose.yml.new"
    dest: "{{ agmind_install_dir }}/docker-compose.yml"
    remote_src: true
    owner: "{{ agmind_user }}"
    group: "{{ agmind_group }}"
    mode: "0644"
  notify: recreate compose

- name: Remove temporary rendered docker-compose.yml.new
  ansible.builtin.file:
    path: "{{ agmind_install_dir }}/docker-compose.yml.new"
    state: absent

- name: Render .env с secrets (chmod 600)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ agmind_install_dir }}/.env"
    owner: "{{ agmind_user }}"
    group: "{{ agmind_group }}"
    mode: "0600"
  no_log: true   # ВАЖНО: plaintext secrets НЕ должны попасть в Ansible stdout / logs под --diff/-vvv

- name: Validate compose config (docker compose --quiet)
  ansible.builtin.command:
    cmd: docker compose -f {{ agmind_install_dir }}/docker-compose.yml config --quiet
  changed_when: false
  check_mode: false

- name: Pull images
  ansible.builtin.command:
    cmd: docker compose -f {{ agmind_install_dir }}/docker-compose.yml pull
  changed_when: false
  register: compose_pull
  failed_when: compose_pull.rc != 0

- name: Bring up services
  community.docker.docker_compose_v2:
    project_src: "{{ agmind_install_dir }}"
    state: present
    pull: missing
