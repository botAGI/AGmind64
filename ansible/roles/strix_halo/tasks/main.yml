---
# Strix Halo specific tuning: AMDVLK cleanup, GRUB cmdline для GTT pool.
# Per R2 (Vulkan/RADV mandatory) + R10 (BIOS UMA + ttm.pages_limit).

- name: Detect AMDVLK ICD files (R2 — discontinued AMD 2025-09-15)
  ansible.builtin.stat:
    path: "{{ item }}"
  register: amdvlk_files
  loop: "{{ agmind_strix_halo.amdvlk_purge_paths }}"

- name: Purge AMDVLK ICD files (имеют 2 GiB cap, ломает LLM ≥30B)
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: absent
  loop: "{{ amdvlk_files.results }}"
  when: item.stat.exists
  notify: warn AMDVLK purged

- name: Read current GRUB cmdline
  ansible.builtin.slurp:
    src: /etc/default/grub
  register: grub_current
  no_log: true

- name: Compute recommended ttm.pages_limit (94% RAM)
  ansible.builtin.set_fact:
    agmind_ttm_pages_limit: "{{ ((ansible_memtotal_mb * 1024 * 1024 * agmind_strix_halo.ttm_pages_limit_pct) / 4096) | int }}"

# Per-param toggles (group_vars agmind_strix_halo.*): pages_limit is the only GTT
# prerequisite; page_pool / iommu-off / zswap-off are independent node choices —
# see the WHY-comments next to each toggle in group_vars/all.yml.
- name: Assemble agmind GRUB params from toggles
  ansible.builtin.set_fact:
    agmind_grub_params: >-
      {{ (['ttm.pages_limit=' ~ agmind_ttm_pages_limit])
         + (['ttm.page_pool_size=' ~ agmind_ttm_pages_limit] if agmind_strix_halo.ttm_page_pool | default(true) else [])
         + (['amd_iommu=off'] if agmind_strix_halo.amd_iommu_off | default(true) else [])
         + (['zswap.enabled=0'] if agmind_strix_halo.zswap_off | default(true) else [])
         + (['amdgpu.lockup_timeout=60000'] if agmind_strix_halo.lockup_timeout | default(true) else []) }}

# Append agmind kernel params via a grub.d drop-in (sourced by grub-mkconfig AFTER
# /etc/default/grub) instead of REPLACING the whole GRUB_CMDLINE_LINUX_DEFAULT line —
# overwriting it would silently drop distro/operator args (resume=, console=, LUKS/
# cryptdevice, secure-boot), risking an unbootable host.
- name: Ensure /etc/default/grub.d exists
  ansible.builtin.file:
    path: /etc/default/grub.d
    state: directory
    mode: "0755"

# Hosts provisioned by the OLD lineinfile still carry the four agmind tokens INLINE in
# /etc/default/grub; the additive drop-in below would then list them twice. Surgically strip
# ONLY those four tokens (with their leading whitespace) from the main file — preserving
# quiet/splash/resume/console/LUKS — so the drop-in is the single source (review LOW
# ansible-grub-dropin-duplicate-params). A whole-line rewrite would re-introduce the
# drop-operator-args/unbootable regression the drop-in fixed.
- name: Strip legacy inline agmind GRUB params (pre-drop-in hosts)
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '\s+{{ item }}'
    replace: ''
  loop:
    - 'amd_iommu=off'
    - 'ttm\.pages_limit=\S+'
    - 'ttm\.page_pool_size=\S+'
    - 'zswap\.enabled=0'
  notify: regenerate grub

- name: Append agmind GRUB params (non-destructive drop-in)
  ansible.builtin.copy:
    dest: /etc/default/grub.d/99-agmind.cfg
    mode: "0644"
    content: |
      # Managed by AGmind (strix_halo role). Appends to the existing cmdline; does NOT
      # replace operator/distro args. ttm.pages_limit = 94% RAM as GTT pool (R10);
      # the remaining params are per-node toggles (group_vars agmind_strix_halo.*).
      GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT {{ agmind_grub_params | join(' ') }}"
  notify: regenerate grub

- name: Verify Mesa version (R2 — min 25.2.8)
  ansible.builtin.shell: |
    set -o pipefail
    glxinfo 2>/dev/null | grep -oE 'Mesa [0-9]+\.[0-9]+\.[0-9]+' | head -1 | awk '{print $2}'
  args:
    executable: /bin/bash
  register: mesa_ver
  changed_when: false
  failed_when: false
  check_mode: false

- name: Warn if Mesa below {{ agmind_mesa_min }}
  ansible.builtin.debug:
    msg: |
      Mesa {{ mesa_ver.stdout | default('not-detected') }} below {{ agmind_mesa_min }}.
      Recommended {{ agmind_mesa_recommended }}+ через kisak PPA:
        sudo add-apt-repository ppa:kisak/kisak-mesa
        sudo apt upgrade
  when:
    - mesa_ver.stdout | default('') | length > 0
    - mesa_ver.stdout is version(agmind_mesa_min, '<')

- name: Render AGmind env file (Strix Halo defaults)
  ansible.builtin.template:
    src: agmind-env.j2
    dest: "{{ agmind_config_dir }}/strix-halo.env"
    owner: "{{ agmind_user }}"
    group: "{{ agmind_group }}"
    mode: "0644"
