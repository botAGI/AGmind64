---
# Install agmind Python package в /opt/agmind/venv + CLI entrypoint.

- name: Create agmind venv
  ansible.builtin.command:
    cmd: python3 -m venv {{ agmind_install_dir }}/venv
    creates: "{{ agmind_install_dir }}/venv/bin/python"
  become_user: "{{ agmind_user }}"

# Re-run safety: the task above guards on bin/python, but a venv whose ensurepip was interrupted by a
# prior failed run has bin/python WITHOUT pip → the next "Ensure pip tooling" task fails with "Unable
# to find pip in the virtualenv". Bootstrap pip explicitly (offline-safe: uses the bundled wheels from
# python3-pip-whl). Idempotent via creates: bin/pip. live clean-install 2026-06-07 (pip-less-venv rake).
- name: Bootstrap pip into the venv (a partial prior venv may have python but no pip)
  ansible.builtin.command:
    cmd: "{{ agmind_install_dir }}/venv/bin/python -m ensurepip --upgrade"
    creates: "{{ agmind_install_dir }}/venv/bin/pip"
  become_user: "{{ agmind_user }}"

- name: Ensure pip tooling in venv
  ansible.builtin.pip:
    name:
      - "pip>=24,<26"
      - "setuptools>=68,<90"
      - "wheel>=0.43,<1"
    state: present
    virtualenv: "{{ agmind_install_dir }}/venv"
    # Use the stdlib venv module (python3-venv, installed in bootstrap) — NOT the separate
    # `virtualenv` package, which a clean machine lacks (the ansible pip module otherwise demands a
    # `virtualenv` executable and fails on a freshly-wiped host). live clean-install 2026-06-07.
    virtualenv_command: python3 -m venv
  become_user: "{{ agmind_user }}"

