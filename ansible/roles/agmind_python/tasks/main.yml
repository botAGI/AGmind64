---
# Install agmind Python package в /opt/agmind/venv + CLI entrypoint.

- name: Create agmind venv
  ansible.builtin.command:
    cmd: python3 -m venv {{ agmind_install_dir }}/venv
    creates: "{{ agmind_install_dir }}/venv/bin/python"
  become_user: "{{ agmind_user }}"

- name: Ensure pip tooling in venv
  ansible.builtin.pip:
    name:
      - "pip>=24,<26"
      - "setuptools>=68,<90"
      - "wheel>=0.43,<1"
    state: present
    virtualenv: "{{ agmind_install_dir }}/venv"
    # Use the stdlib venv module (python3-venv, installed in bootstrap) — NOT the separate
    # `virtualenv` package, which a clean machine lacks (the ansible pip module otherwise demands a
    # `virtualenv` executable and fails on a freshly-wiped host). live clean-install 2026-06-07.
    virtualenv_command: python3 -m venv
  become_user: "{{ agmind_user }}"

- name: Install agmind package (runtime only — no dev toolchain on deployed nodes)
  ansible.builtin.pip:
    name:
      # Bare `agmind` (runtime deps): a deployed node runs the CLI/ansible, not the test
      # suite — `[dev]` would drag pytest/ruff/mypy + their tree onto every node (audit M#27).
      - "agmind @ file://{{ playbook_dir }}/.."
    virtualenv: "{{ agmind_install_dir }}/venv"
    virtualenv_command: python3 -m venv
    state: present

- name: Create /usr/local/bin/agmind wrapper
  ansible.builtin.copy:
    dest: /usr/local/bin/agmind
    content: |
      #!/bin/sh
      # AGmind CLI wrapper — pinned venv invocation.
      exec {{ agmind_install_dir }}/venv/bin/python -m agmind "$@"
    mode: "0755"

- name: Symlink audit_forbidden.py for CI / pre-commit
  ansible.builtin.file:
    src: "{{ playbook_dir }}/../scripts/checks/audit_forbidden.py"
    dest: "{{ agmind_install_dir }}/audit_forbidden.py"
    state: link
    force: true

- name: Smoke test agmind import
  ansible.builtin.command:
    cmd: "{{ agmind_install_dir }}/venv/bin/python -c 'import agmind; print(agmind.__version__)'"
  register: agmind_smoke
  changed_when: false
  check_mode: false

- name: Display agmind version
  ansible.builtin.debug:
    msg: "agmind installed: {{ agmind_smoke.stdout }}"
