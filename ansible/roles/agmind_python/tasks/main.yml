---
# Install agmind Python package в /opt/agmind/venv + CLI entrypoint.

# Guard on bin/PIP, not bin/python: a venv whose ensurepip was interrupted by a prior failed run has
# bin/python but NO pip → the next "Ensure pip tooling" pip task fails "Unable to find pip in the
# virtualenv". `--clear` makes such a partial/broken venv SELF-HEAL on re-run (wipe + recreate WITH
# pip), while a healthy venv (bin/pip present) is skipped by the guard and left untouched (its agmind
# install survives). Verified: --clear restores pip even on a pip-stripped venv. live clean-install
# 2026-06-07 (the pip-less-venv rake — `creates: bin/python` reused a venv that had no pip).
- name: Create agmind venv (self-healing — recreates a partial/pip-less venv)
  ansible.builtin.command:
    cmd: python3 -m venv --clear {{ agmind_install_dir }}/venv
    creates: "{{ agmind_install_dir }}/venv/bin/pip"
  become_user: "{{ agmind_user }}"

- name: Ensure pip tooling in venv
  ansible.builtin.pip:
    name:
      - "pip>=24,<26"
      - "setuptools>=68,<90"
      - "wheel>=0.43,<1"
    state: present
    virtualenv: "{{ agmind_install_dir }}/venv"
    # Use the stdlib venv module (python3-venv, installed in bootstrap) — NOT the separate
    # `virtualenv` package, which a clean machine lacks (the ansible pip module otherwise demands a
    # `virtualenv` executable and fails on a freshly-wiped host). live clean-install 2026-06-07.
    virtualenv_command: python3 -m venv
  become_user: "{{ agmind_user }}"

