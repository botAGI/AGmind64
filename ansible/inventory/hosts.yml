# AGmind inventory — single-node (default) и multi-node (master/workers).
#
# Single-node: ansible-playbook install.yml
# Multi-node:  ansible-playbook -i inventory/cluster.yml install.yml

all:
  vars:
    # Override через group_vars / host_vars / -e
    agmind_install_dir: /opt/agmind
    agmind_data_dir: /var/lib/agmind
    agmind_config_dir: /etc/agmind
    agmind_user: agmind
    agmind_group: agmind
    agmind_profiles:
      - core
      - rag

  children:
    agmind_nodes:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
          agmind_role: master

    agmind_master:
      hosts:
        localhost:

    agmind_workers:
      # Empty by default — single-node deployment.
      # Add hosts here for multi-node x86 cluster:
      #   worker-01:
      #     ansible_host: 192.168.1.11
      #     agmind_role: worker
      hosts: {}
