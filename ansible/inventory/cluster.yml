# AGmind multi-node cluster inventory (example).
#
# Usage:
#   ansible-playbook -i inventory/cluster.yml install.yml
#
# Topology: 1 master + N workers. Master runs the full stack (Dify, Qdrant,
# llama-llm, monitoring); workers run llama-llm for extra GPU capacity.
#
# ⚠️ EXPERIMENTAL — multi-node INFERENCE ROUTING is not yet wired end-to-end:
# the master does not currently forward /completion to workers (no routing gateway),
# and workers publish llama-server on 127.0.0.1, so they are not reachable cross-host
# yet. This inventory provisions the nodes (bootstrap/docker/agmind) and renders the
# peer config; actual sharded inference is a future milestone. The single-node default
# (inventory/hosts.yml) is the supported path.
#
# Network requirements:
#   - LAN connectivity между all nodes
#   - SSH access from control node к workers (key-based)
#   - mDNS/avahi works (для *.local discovery), либо static DNS
#   - Firewall allows 8080-8082 (llama-server) between master + workers

all:
  vars:
    agmind_install_dir: /opt/agmind
    agmind_data_dir: /var/lib/agmind
    agmind_config_dir: /etc/agmind
    agmind_user: agmind
    agmind_group: agmind
    agmind_lan_only: true
    agmind_mdns_enabled: true

  children:
    # Parent group = master ∪ workers. install.yml's foundational plays (preflight,
    # bootstrap, strix_halo, docker, agmind_python, security) target `hosts: agmind_nodes`;
    # without this group `ansible-playbook -i cluster.yml install.yml` matched ZERO hosts and
    # silently bootstrapped nothing on any node (audit arch-cluster HIGH).
    agmind_nodes:
      children:
        agmind_master:
        agmind_workers:

    agmind_master:
      hosts:
        agmind-master:
          ansible_host: 192.168.1.10
          agmind_role: master
          agmind_profiles:
            - core
            - rag
            - observability
          # Master координирует cluster
          agmind_cluster_role: coordinator

    agmind_workers:
      hosts:
        # Worker nodes — run llama-llm only, share inference capacity
        agmind-worker-01:
          ansible_host: 192.168.1.11
          agmind_role: worker
          agmind_profiles:
            - core
          agmind_cluster_role: worker
          # Worker advertises себя через mDNS:
          # `agmind-worker-01.local:8080` discoverable from master.
          agmind_worker_endpoint: "http://agmind-worker-01.local:8080"
        # Add more workers:
        # agmind-worker-02:
        #   ansible_host: 192.168.1.12
        #   agmind_role: worker
        #   agmind_profiles: [core]
        #   agmind_worker_endpoint: "http://agmind-worker-02.local:8080"
