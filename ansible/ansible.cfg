# AGmind Ansible config — local + remote операции.

[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = ./.galaxy
host_key_checking = False
retry_files_enabled = False
# Built-in default callback with YAML output (ansible-core 2.13+). NOT the short
# name `yaml`: it resolved to community.general.yaml, removed in community.general
# 12.0.0 — selecting it aborts ansible-playbook with rc=1 on modern hosts.
stdout_callback = default
result_format = yaml
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .facts_cache
fact_caching_timeout = 7200
forks = 5
interpreter_python = auto_silent

# Не показывать deprecation warning'и при каждом запуске (loud в логах)
deprecation_warnings = True
command_warnings = False

[privilege_escalation]
become = False
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
control_path = ~/.ssh/cm-%%r@%%h:%%p
control_path_dir = ~/.ssh/cm
